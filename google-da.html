<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한끼통살 · 구글 DA 성과</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --band:#15213b;--band2:#1f3160;--band-ink:#f4f6fb;--band-mute:#9fb0d4;
  --ink:#1b2231;--ink2:#465064;--mute:#8b93a5;--faint:#b7bdca;
  --line:#e4e6ec;--line2:#eef0f4;--bg:#f2f3f6;--panel:#fff;
  --ac:#2f4f8f;--ac-soft:#e9eef8;
  --good:#2f855a;--good-bg:#e6f4ec;--mid:#b7791f;--mid-bg:#fbf1dc;--bad:#c0473f;--bad-bg:#fbe9e7;
  --sat:#2a58b0;--sun:#c0304a;
}
body.m-tiktok{--band:#0c0c10;--band2:#17171d;--band-mute:#9a9aa8;--ac:#111;--ac-soft:#efeff2}
html{scroll-padding-top:120px}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
.num{font-variant-numeric:tabular-nums}

/* ── 헤더 밴드 ── */
.band{background:linear-gradient(120deg,var(--band) 0%,var(--band2) 100%);color:var(--band-ink);position:relative}
body.m-tiktok .band::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#25f4ee,#fe2c55)}
.band-in{max-width:1480px;margin:0 auto;padding:22px 28px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.band-l{display:flex;align-items:center;gap:14px;min-width:0}
.band-logo{width:50px;height:50px;border-radius:12px;background:#fff;object-fit:contain;padding:5px;flex-shrink:0}
body.m-tiktok .band-logo{padding:0;background:#000}
.band-kicker{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--band-mute);font-weight:600}
.band-title{font-size:26.5px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.band-meta{font-size:14.5px;color:var(--band-mute);margin-top:3px}
.band-meta b{color:var(--band-ink);font-weight:600}
.band-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.media-tog{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:2px}
.media-tog button{border:none;background:transparent;color:var(--band-mute);padding:6px 13px 6px 7px;border-radius:7px;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.media-tog button:hover{color:#fff}
.media-tog button.active{background:#fff;color:#15213b}
.media-tog img{width:22px;height:22px;border-radius:5px;object-fit:contain}
.media-tog button:not(.active) img{opacity:.6}
.xls-btn{background:transparent;color:var(--band-ink);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 13px;font:600 14.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.xls-btn:hover{background:rgba(255,255,255,.1)}

/* ── 고정 툴바 ── */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:9px 28px;display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-lbl{font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:.4px;width:36px;flex-shrink:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;padding:6px 12px;font:500 14.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.seg button .d{color:var(--mute);font-size:13px;margin-left:4px}
.seg button:hover{border-color:var(--ac);color:var(--ac)}
.seg button.active{background:var(--ac);border-color:var(--ac);color:#fff}
.seg button.active .d{color:rgba(255,255,255,.75)}
.custom{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:2px 3px 2px 8px;background:#fff}
.custom input{border:none;font:14.5px inherit;font-family:inherit;color:var(--ink);outline:none;width:136px;background:transparent}
.custom span{color:var(--faint)}
.custom button{border:none;background:var(--ac-soft);color:var(--ac);border-radius:5px;padding:4px 9px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.custom button.active{background:var(--ac);color:#fff}
.spacer{flex:1}
.goal{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
.goal input{width:64px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:600 15px inherit;font-family:inherit;text-align:right;color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 13px;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.dim{opacity:.38;border-style:dashed}
.chip.dim.active{opacity:.7}
.chip.on:not(.active){border-color:#c9cfdb;color:var(--ink);font-weight:600}

/* ── 본문 ── */
.wrap{max-width:1480px;margin:0 auto;padding:18px 28px 28px;display:flex;flex-direction:column;gap:18px}
.notice{background:#fff8e1;border:1px solid #f3dc9a;color:#7a5a00;border-radius:8px;padding:9px 14px;font-size:14.5px;display:none}
.notice.show{display:block}
.h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.h2 .t{font-size:17.5px;font-weight:700;letter-spacing:-.2px}
.h2 .s{font-size:14px;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* KPI 스트립 */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.kpi{padding:17px 18px 15px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;position:relative}
.kpi:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(21,33,59,.10);border-color:#cfd5e1}
.kpi.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 6px 16px rgba(21,33,59,.08);background:var(--ac-soft)}
.kpi.sel .l{color:var(--ac);font-weight:600}
.kpi .pick{position:absolute;top:12px;right:13px;font-size:11px;color:var(--ac);opacity:0;transition:opacity .15s}
.kpi:hover .pick,.kpi.sel .pick{opacity:1}
.kpi .l{font-size:14px;color:var(--mute);white-space:nowrap}
.kpi .v{font-size:28.5px;font-weight:400;letter-spacing:-.2px;font-feature-settings:normal;line-height:1.3;margin-top:4px;white-space:nowrap;color:var(--ink)}
.kpi .v small{font-size:15px;color:var(--mute);margin-left:2px}
.kpi .v.good{color:var(--good)}.kpi .v.mid{color:var(--mid)}.kpi .v.bad{color:var(--bad)}
.kpi .dl{font-size:13px;margin-top:3px;color:var(--faint);white-space:nowrap}
.kpi .dl .up{color:var(--good)}.kpi .dl .dn{color:var(--bad)}


/* 차트 */
.chart-panel{padding:16px 18px 12px}
.chart-wrap{position:relative;height:310px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2)}
.foot b{font-weight:600;color:var(--ink)}
.lnk{border:none;background:none;color:var(--ac);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:2px 0}
.daily-box{display:none;margin-top:10px}
.daily-box.show{display:block}

/* 성과 표 */
.tbl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.tabs button{border:none;border-left:1px solid var(--line);background:#fff;padding:7px 17px;font:500 15px inherit;font-family:inherit;color:var(--ink2);cursor:pointer}
.tabs button:first-child{border-left:none}
.tabs button.active{background:var(--ink);color:#fff}
.crumb{font-size:15px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--ac);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb .cur{color:var(--ink);font-weight:600}
.twin{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:12px;align-items:start}
.box-t{font-size:14px;font-weight:600;color:var(--ink2);padding:10px 14px 0;display:flex;justify-content:space-between}
.box-t span{color:var(--faint);font-weight:400}
.tscroll{overflow:auto;max-height:620px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:2;background:#fff;padding:10px 11px;font-size:13px;font-weight:600;color:var(--mute);text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th.l{text-align:left}
th.sorted{color:var(--ink)}
th .ar{font-size:10.5px;margin-left:3px}
td{height:44px;padding:0 11px;font-size:15px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;color:var(--ink)}
td.l{text-align:left}
.tscroll td.l:first-child{position:sticky;left:0;z-index:1;background:#fff}
.tscroll th.l:first-child{left:0;z-index:3}
.tscroll tr.tot td.l:first-child{background:#fafbfc}
.tscroll tr.row:hover td.l:first-child,.tscroll tr.hov td.l:first-child{background:#f5f7fb}
td.nm{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.twin .right td.nm{max-width:150px}
.twin .right th,.twin .right td{padding-left:8px;padding-right:8px}
td.nm .up{display:block;font-size:12px;color:var(--faint);line-height:1.1;overflow:hidden;text-overflow:ellipsis}
td.nm .main{display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
tr.row{cursor:pointer}
tr.row:hover td,tr.hov td{background:#f5f7fb}
tr.tot td{background:#fafbfc;font-weight:600;border-bottom:1px solid var(--line)}
tr.noclick{cursor:default}
.r{font-weight:600}
.r.good{color:var(--good)}.r.mid{color:var(--mid)}.r.bad{color:var(--bad)}.r.none{color:var(--faint);font-weight:400}.r.plain{font-weight:400;color:var(--ink)}
th.hl{color:var(--ac);background:#eef2fa;box-shadow:inset 0 -2px 0 var(--ac)}
td.hl{background:rgba(47,79,143,.055);font-size:1.07em}
td.hl .r{font-weight:700}
tr.tot td.hl{background:rgba(47,79,143,.10)}
tr.row:hover td.hl,tr.hov td.hl{background:rgba(47,79,143,.11)}
body.m-tiktok th.hl{background:#f0f0f3}body.m-tiktok td.hl{background:rgba(0,0,0,.04)}
.badge{font-size:12px;font-weight:500;padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:1px;border:1px solid}
.b-ret{color:#6b3fb0;border-color:#d9c9f2}.b-new{color:#1f5fa8;border-color:#c5d8f0}.b-smart{color:#2f7a4d;border-color:#c4e3cf}
.b-man{color:#8a3d9e;border-color:#e3c9ea}.b-orph{color:#b2560e;border-color:#f1d2b5}.b-pause{color:#8b93a5;border-color:#dfe2e8}.b-grp{color:#557;border-color:#dde}
.dbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font:500 13px inherit;font-family:inherit;color:var(--ac);cursor:pointer;white-space:nowrap}
.dbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
td.btncell{width:1%;padding-left:2px}
.wk-sat{color:var(--sat)}.wk-sun{color:var(--sun)}
.empty{text-align:center!important;color:var(--faint);padding:24px!important;height:auto}

.ft{text-align:center;font-size:12.5px;color:var(--faint);padding:4px 0 20px}

/* 모달 */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(15,20,35,.5);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-ov.show{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:1180px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-t{font-size:17.5px;font-weight:700}
.modal-s{font-size:14px;color:var(--mute);margin-top:2px}
.modal-x{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--ink2)}
.modal-b{padding:14px 20px 18px;overflow:auto}

/* 비밀번호 */
#pw-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999}
#pw-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:40px 36px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:300px}
#pw-logo{font-size:22px;font-weight:700}
#pw-sub{font-size:15px;color:var(--mute);margin-top:-8px}
#pw-input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);font-size:17.5px;outline:none;text-align:center;letter-spacing:3px}
#pw-input:focus{border-color:var(--ac)}
#pw-btn{width:100%;padding:11px;border-radius:8px;background:#15213b;color:#fff;font-size:16px;font-weight:600;border:none;cursor:pointer}
#pw-err{font-size:14px;color:var(--bad);height:16px}

@media(max-width:1280px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .twin{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:760px){
  .band-in{padding:16px 14px 14px;align-items:flex-start}
  .band-title{font-size:22px}
  .bar{position:static}
  .bar-in{padding:8px 12px}
  .bar-lbl{display:none}
  .seg button{padding:4px 8px;font-size:14px}
  .custom input{width:auto;flex:1;min-width:0}
  .custom{width:100%}
  .wrap{padding:12px 10px 20px;gap:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:13px 13px 12px;border-radius:12px}
  .kpi:hover{transform:none}
  .kpi .v{font-size:24px}
  .chart-wrap{height:250px}
  .chart-panel{padding:12px 10px 10px}
  td.nm{max-width:170px}
  .modal-ov{padding:6px}
}
</style>
</head>
<body>

<div id="pw-overlay">
  <div id="pw-box">
    <div id="pw-logo">구글 DA 성과 대시보드</div>
    <div id="pw-sub">접근 비밀번호를 입력하세요</div>
    <input id="pw-input" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pw-err"></div>
    <button id="pw-btn" onclick="checkPw()">확인</button>
  </div>
</div>
<script>
(function(){
  var PW = 'hankkigda3483';
  if (sessionStorage.getItem('gda_auth') === '1') { document.getElementById('pw-overlay').style.display='none'; return; }
  function checkPw() {
    var v = document.getElementById('pw-input').value;
    if (v === PW) { sessionStorage.setItem('gda_auth','1'); document.getElementById('pw-overlay').style.display='none'; }
    else { var err = document.getElementById('pw-err'); err.textContent = '비밀번호가 틀렸습니다'; setTimeout(function(){ err.textContent=''; },2000); }
  }
  window.checkPw = checkPw;
  document.getElementById('pw-input').focus();
})();
</script>

/* ── 포맷 ── */
function h(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

}
function kpiWon(n) {

// 목표 대비 색은 순ROAS에만 — 목표가 순ROAS 기준이라 다른 ROAS에 같은 잣대를 대면 오해를 부른다

/* ── 집계 ── */

  { k: 'roasCafe', t: '순ROAS', hl: true, f: function (m) { return netRoasCell(m.roasCafe, m.cost > 0); } }

var FLOW_COLS = [
  { k: 'impr', t: '노출수', f: function (m) { return cnt(m.impr); } },

];
function cells(cols, m) { return cols.map(function (c) { return '<td' + (c.hl ? ' class="hl"' : '') + '>' + c.f(m) + '</td>'; }).join(''); }
function thPlain(c) { return '<th style="cursor:default"' + (c.hl ? ' class="hl"' : '') + (c.tip ? ' title="' + c.tip + '"' : '') + '>' + c.t + '</th>'; }

function renderDailyTable(ser) {

/* ── 성과 표: 보기 단위 탭 + 드릴다운 + 브레드크럼 ── */
function campDisplayName(product, type, rawName, subtype) {
  if (!product || !type || product === '미분류' || type === '미분류') return rawName;
  return product + '_' + type + (subtype ? '_' + subtype : '');
}
function typeBadge(type, subtype) {
  var s = subtype ? ' · ' + h(subtype) : '';
  if (type === '리타겟팅') return '<span class="badge b-ret">리타겟팅' + s + '</span>';
  if (type === '신규유입') return '<span class="badge b-new">신규' + s + '</span>';
  if (type === '스마트') return '<span class="badge b-smart">스마트+' + s + '</span>';
  if (type === '수동') return '<span class="badge b-man">수동' + s + '</span>';
  if (type === '미매칭') return '<span class="badge b-orph">Cafe24 미매칭</span>';
  return '';
}
function findCampaign(campaignId) {
  for (var i = 0; i < DATA.byProduct.length; i++) { var p = DATA.byProduct[i];
    for (var j = 0; j < p.campaigns.length; j++) if (p.campaigns[j].campaignId === campaignId) return { c: p.campaigns[j], product: p.product }; }
  return null;
}
// 현재 보기 단위·드릴 상태에 맞는 행 목록 [{id, name, up, badge, m, kind}]
function buildRows() {
  var r = getRange(CUR_PERIOD), s = r[0], e = r[1], out = [];
  DATA.byProduct.forEach(function (p) {
    if (!productMatch(p.product)) return;
    if (DRILL.product && DRILL.product !== p.product) return;
    if (VIEW === 'product') { out.push({ kind: 'product', id: p.product, name: p.product, up: '', badge: '', m: metrics(sumRange(p.byDate, s, e)) }); return; }
    p.campaigns.forEach(function (c) {
      if (DRILL.campaignId && DRILL.campaignId !== c.campaignId) return;
      var cname = campDisplayName(p.product, c.type, c.name, c.subtype);
      if (VIEW === 'campaign') { out.push({ kind: 'campaign', id: c.campaignId, product: p.product, name: cname, raw: c.name, up: p.product, badge: typeBadge(c.type, c.subtype), m: metrics(sumRange(c.byDate, s, e)) }); return; }
      c.ads.forEach(function (a) {
        var label = a.adName && a.adName.trim() && a.adName.trim() !== '--' ? a.adName : (a.adGroup || a.adId);
        var st = a.status && a.status !== '사용중' ? '<span class="badge b-pause">' + h(a.status) + '</span>' : '';
        out.push({ kind: 'ad', id: a.adId, name: label, up: p.product + ' › ' + cname + (a.adGroup ? ' › ' + a.adGroup : ''), badge: st, m: metrics(sumRange(a.byDate, s, e)) });
      });
    });
  });
  out = out.filter(function (x) { return !isEmptyM(x.m); });
  var k = SORT.key, dir = SORT.dir;
  out.sort(function (a, b) {
    if (k === 'name') return dir * String(a.name).localeCompare(String(b.name), 'ko');
    return dir * ((a.m[k] || 0) - (b.m[k] || 0));
  });
  return out;
}
function headHtml(cols, labelTitle, withBtn) {
  var th = function (key, title, cls, tip) {
    var on = SORT.key === key;
    if (key === 'roasCafe') cls = (cls ? cls + ' ' : '') + 'hl';
    return '<th class="' + (cls || '') + (on ? ' sorted' : '') + '" data-sort="' + key + '"' + (tip ? ' title="' + tip + '"' : '') + '>' + title + (on ? '<span class="ar">' + (SORT.dir < 0 ? '▼' : '▲') + '</span>' : '') + '</th>';
  };
  return '<thead><tr>' + th('name', labelTitle, 'l') + cols.map(function (c) { return th(c.k, c.t, '', c.tip); }).join('') + (withBtn ? '<th class="noclick" style="cursor:default"></th>' : '') + '</tr></thead>';
}
function nameCell(x) {
  return '<td class="l nm" title="' + h(x.raw || x.name) + '">' + (x.up ? '<span class="up">' + h(x.up) + '</span>' : '') + '<span class="main">' + h(x.name) + x.badge + '</span></td>';
}
function renderPerf() {
  var tabs = [{ v: 'product', t: '품목' }, { v: 'campaign', t: '캠페인' }, { v: 'ad', t: '소재' }];
  var tEl = document.getElementById('view-tabs');
  tEl.innerHTML = tabs.map(function (t) { return '<button class="' + (VIEW === t.v ? 'active' : '') + '" data-v="' + t.v + '">' + t.t + '</button>'; }).join('');
  tEl.querySelectorAll('button').forEach(function (b) {
    b.onclick = function () {
      VIEW = b.dataset.v;
      if (VIEW === 'product') DRILL = { product: null, campaignId: null };
      if (VIEW === 'campaign') DRILL.campaignId = null;
      renderPerf();
    };
  });
  // 브레드크럼
  var cr = ['<a data-c="root">전체</a>'];
  if (DRILL.product) cr.push(DRILL.campaignId ? '<a data-c="product">' + h(DRILL.product) + '</a>' : '<span class="cur">' + h(DRILL.product) + '</span>');
  if (DRILL.campaignId) { var fc = findCampaign(DRILL.campaignId); cr.push('<span class="cur">' + h(fc ? campDisplayName(fc.product, fc.c.type, fc.c.name, fc.c.subtype) : DRILL.campaignId) + '</span>'); }
  if (!DRILL.product && !DRILL.campaignId) cr = ['<span class="cur">전체</span>'];
  var cEl = document.getElementById('crumb');
  cEl.innerHTML = cr.join(' <span>›</span> ') + ' <span style="color:var(--faint)">· ' + rangeTxt.apply(null, getRange(CUR_PERIOD)) + '</span>';
  cEl.querySelectorAll('a').forEach(function (a) {
    a.onclick = function () {
      if (a.dataset.c === 'root') { DRILL = { product: null, campaignId: null }; VIEW = 'product'; }
      else { DRILL.campaignId = null; VIEW = 'campaign'; }
      renderPerf();
    };
  });

  var rows = buildRows();
  var tot = emptyTotals(); rows.forEach(function (x) { addTotals(tot, x.m); });
  var tm = metrics(tot);
  var unitT = VIEW === 'product' ? '품목' : VIEW === 'campaign' ? '캠페인' : '소재';
  var withBtn = VIEW === 'campaign';
  document.getElementById('left-sub').textContent = rows.length + '개 ' + unitT + (VIEW !== 'ad' ? ' · 행 클릭 시 하위로' : '');

  var totL = '<tr class="tot noclick"><td class="l">합계</td>' + cells(CONV_COLS, tm) + (withBtn ? '<td></td>' : '') + '</tr>';
  var totR = '<tr class="tot noclick"><td class="l">합계</td>' + cells(FLOW_COLS, tm) + '</tr>';
  var bodyL = rows.map(function (x, i) {
    var btn = withBtn ? '<td class="btncell"><button class="dbtn" data-camp="' + h(x.id) + '" title="이 캠페인 일자별 성과">일자별</button></td>' : '';
    return '<tr class="row' + (VIEW === 'ad' ? ' noclick' : '') + '" data-i="' + i + '">' + nameCell(x) + cells(CONV_COLS, x.m) + btn + '</tr>';
  }).join('');
  var bodyR = rows.map(function (x, i) { return '<tr class="row' + (VIEW === 'ad' ? ' noclick' : '') + '" data-i="' + i + '">' + nameCell(x) + cells(FLOW_COLS, x.m) + '</tr>'; }).join('');
  var empty = '<tr><td class="empty" colspan="14">데이터 없음</td></tr>';
  document.getElementById('t-left').innerHTML = headHtml(CONV_COLS, unitT, withBtn) + '<tbody>' + (rows.length ? totL + bodyL : empty) + '</tbody>';
  document.getElementById('t-right').innerHTML = headHtml(FLOW_COLS, unitT, false) + '<tbody>' + (rows.length ? totR + bodyR : empty) + '</tbody>';

  // 이벤트: 정렬(두 박스 공유) · 드릴다운 · 일자별 버튼 · hover 동기화
  ['t-left', 't-right'].forEach(function (id) {
    var t = document.getElementById(id);
    t.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.onclick = function () { var k = th.dataset.sort; if (SORT.key === k) SORT.dir = -SORT.dir; else SORT = { key: k, dir: k === 'name' ? 1 : -1 }; renderPerf(); };
    });
    t.querySelectorAll('tr.row').forEach(function (tr) {
      var x = rows[+tr.dataset.i];
      tr.onclick = function () {
        if (x.kind === 'product') { DRILL = { product: x.id, campaignId: null }; VIEW = 'campaign'; renderPerf(); }
        else if (x.kind === 'campaign') { DRILL = { product: x.product, campaignId: x.id }; VIEW = 'ad'; renderPerf(); }
      };
      tr.onmouseenter = function () { document.querySelectorAll('.twin tr[data-i="' + tr.dataset.i + '"]').forEach(function (o) { o.classList.add('hov'); }); };
      tr.onmouseleave = function () { document.querySelectorAll('.twin tr.hov').forEach(function (o) { o.classList.remove('hov'); }); };
    });
    t.querySelectorAll('.dbtn').forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); openCampaignModal(b.dataset.camp); }; });
  });
}

var modalChart = null;
function openCampaignModal(campaignId) {
  var f = findCampaign(campaignId); if (!f) return;
  var c = f.c, r = monthRange();
  var dates = DATA.dates.filter(function (d) { return d >= r[0] && d <= r[1]; });
  var ms = dates.map(function (d) { return metrics(c.byDate[d] || emptyTotals()); });
  document.getElementById('modal-t').textContent = campDisplayName(f.product, c.type, c.name, c.subtype);
  document.getElementById('modal-s').textContent = (CUR_PERIOD === 'lastMonth' ? '지난달 ' : '이번달 ') + rangeTxt(r[0], r[1]) + ' · ' + c.name;
  var cols = CONV_COLS.concat(FLOW_COLS);
  var rows = [];
  for (var i = dates.length - 1; i >= 0; i--) { if (isEmptyM(ms[i])) continue; rows.push('<tr class="noclick"><td class="l">' + mdwHtml(dates[i]) + '</td>' + cells(cols, ms[i]) + '</tr>'); }
  var tot = emptyTotals(); ms.forEach(function (m) { addTotals(tot, m); });

function closeCampaignModal() { document.getElementById('modal-ov').classList.remove('show'); if (modalChart) { modalChart.destroy(); modalChart = null; } }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCampaignModal(); });

/* ===== 엑셀(.xlsx) 내보내기 — 외부 라이브러리 없이 자체 생성 =====
   광고ID/캠페인ID는 텍스트 셀(inlineStr)로 넣어 과학적 표기 손상 방지.
   전체 데이터(기간·품목 필터 무시, 전 계층) 출력. */
function xlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function xlColName(n){ var s=''; n++; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function XS(v){ return {t:'s',v:(v==null?'':String(v))}; }
function XN(v){ return {t:'n',v:(v==null||!isFinite(v))?0:v}; }
function xlRound(x,d){ if(!isFinite(x)) return 0; var p=Math.pow(10,d||0); return Math.round(x*p)/p; }

// CRC32 (표준)
var _crcTable=(function(){ var t=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[n]=c>>>0; } return t; })();
function xlCrc32(u8){ var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++){ c=(c>>>8)^_crcTable[(c^u8[i])&0xFF]; } return (c^0xFFFFFFFF)>>>0; }

function xlSheetXml(rows){
  var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  for(var r=0;r<rows.length;r++){
    var cells=rows[r]; xml+='<row r="'+(r+1)+'">';
    for(var c=0;c<cells.length;c++){
      var cell=cells[c], ref=xlColName(c)+(r+1);
      if(cell.t==='n'){ xml+='<c r="'+ref+'"><v>'+cell.v+'</v></c>'; }
      else { xml+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xlEsc(cell.v)+'</t></is></c>'; }
    }
    xml+='</row>';
  }
  return xml+'</sheetData></worksheet>';
}

function xlBuild(sheets){
  var enc=new TextEncoder();
  var files=[];
  var ctOverrides='', wbSheets='', wbRels='';
  for(var i=0;i<sheets.length;i++){
    var idx=i+1, p='xl/worksheets/sheet'+idx+'.xml';
    files.push({name:p, data:enc.encode(xlSheetXml(sheets[i].rows))});
    ctOverrides+='<Override PartName="/'+p+'" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    wbSheets+='<sheet name="'+xlEsc(sheets[i].name)+'" sheetId="'+idx+'" r:id="rId'+idx+'"/>';
    wbRels+='<Relationship Id="rId'+idx+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+idx+'.xml"/>';
  }
  var contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    ctOverrides+'</Types>';
  var rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var workbook='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets>'+wbSheets+'</sheets></workbook>';
  var workbookRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+wbRels+'</Relationships>';
  var all=[
    {name:'[Content_Types].xml', data:enc.encode(contentTypes)},
    {name:'_rels/.rels', data:enc.encode(rootRels)},
    {name:'xl/workbook.xml', data:enc.encode(workbook)},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode(workbookRels)}
  ].concat(files);

  // ZIP (stored, 무압축)
  var u16=function(n){return [n&255,(n>>8)&255];};
  var u32=function(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];};
  var chunks=[], offset=0, central=[];
  function push(arr){ var u=(arr instanceof Uint8Array)?arr:Uint8Array.from(arr); chunks.push(u); offset+=u.length; }
  for(var f=0;f<all.length;f++){
    var nameB=enc.encode(all[f].name), data=all[f].data, crc=xlCrc32(data), lo=offset;
    var lh=[].concat(u32(0x04034b50),u16(20),u16(0x800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    push(lh); push(nameB); push(data);
    central.push({nameB:nameB, crc:crc, size:data.length, offset:lo});
  }
  var cdStart=offset;
  for(var g=0;g<central.length;g++){
    var c=central[g];
    var cd=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x800),u16(0),u16(0),u16(0),u32(c.crc),u32(c.size),u32(c.size),u16(c.nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
    push(cd); push(c.nameB);
  }
  var cdSize=offset-cdStart;
  var eocd=[].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(cdSize),u32(cdStart),u16(0));
  push(eocd);
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

var XL_METRIC_HEAD=['비용','노출수','클릭수','전환수','전환가치','매체ROAS(%)','Cafe24RAW매출','RAW ROAS(%)','Cafe24순매출','순ROAS(%)','주문수','유입수','CTR(%)','CVR(%)'];
function xlMetricCells(m){
  return [XN(xlRound(m.cost)),XN(xlRound(m.impr)),XN(xlRound(m.clicks)),XN(xlRound(m.conv,2)),XN(xlRound(m.convValue)),
    XN(xlRound(m.roasGoogle,1)),XN(xlRound(m.orderAmount)),XN(xlRound(m.roasCafeRaw,1)),XN(xlRound(m.netRevenue)),XN(xlRound(m.roasCafe,1)),
    XN(xlRound(m.orderCount)),XN(xlRound(m.inflow)),XN(xlRound(m.ctr,2)),XN(xlRound(m.cvr,2))];
}

function exportExcel(){
  try{
    // 1) 일자별
    var s1=[[XS('날짜')].concat(XL_METRIC_HEAD.map(XS))];
    for(var i=0;i<DATA.dates.length;i++){ var d=DATA.dates[i]; s1.push([XS(d)].concat(xlMetricCells(metrics(DATA.daily[d])))); }

    // 2) 품목별
    var s2=[[XS('품목')].concat(XL_METRIC_HEAD.map(XS))];
    // 3) 캠페인별
    var s3=[[XS('품목'),XS('캠페인'),XS('캠페인유형'),XS('캠페인ID')].concat(XL_METRIC_HEAD.map(XS))];
    // 4) 소재별
    var s4=[[XS('품목'),XS('캠페인'),XS('캠페인유형'),XS('광고그룹'),XS('소재명'),XS('광고ID'),XS('상태')].concat(XL_METRIC_HEAD.map(XS))];
    // 5) 소재별_일자별 (전 데이터)
    var s5=[[XS('날짜'),XS('품목'),XS('캠페인'),XS('캠페인유형'),XS('광고그룹'),XS('소재명'),XS('광고ID'),XS('캠페인ID'),XS('상태')].concat(XL_METRIC_HEAD.map(XS))];

    for(var p=0;p<DATA.byProduct.length;p++){
      var prod=DATA.byProduct[p];
      s2.push([XS(prod.product)].concat(xlMetricCells(metrics(prod.totals))));
      for(var ci=0;ci<prod.campaigns.length;ci++){
        var camp=prod.campaigns[ci];
        var typeLabel=camp.type+(camp.subtype?('/'+camp.subtype):'');
        s3.push([XS(prod.product),XS(camp.name),XS(typeLabel),XS(camp.campaignId)].concat(xlMetricCells(metrics(camp.totals))));
        for(var ai=0;ai<camp.ads.length;ai++){
          var ad=camp.ads[ai];
          s4.push([XS(prod.product),XS(camp.name),XS(typeLabel),XS(ad.adGroup),XS(ad.adName),XS(ad.adId),XS(ad.status)].concat(xlMetricCells(metrics(ad.totals))));
          var dts=Object.keys(ad.byDate).sort();
          for(var di=0;di<dts.length;di++){
            var dd=dts[di];
            s5.push([XS(dd),XS(prod.product),XS(camp.name),XS(typeLabel),XS(ad.adGroup),XS(ad.adName),XS(ad.adId),XS(camp.campaignId),XS(ad.status)].concat(xlMetricCells(metrics(ad.byDate[dd]))));
          }
        }
      }
