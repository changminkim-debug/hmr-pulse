  if (!R || !R.dates.length) { el.style.display = 'none'; return; }
  var first = R.dates[0].d, last = R.dates[R.dates.length - 1].d, p = S.per;
  el.innerHTML = '<span class="fl">기간</span>' +
    '<button class="rng-btn' + (p ? '' : ' active') + '" data-pk="">오늘</button>' +
    perMonths().map(function(m){ return '<button class="rng-btn' + (p && p.key === m ? ' active' : '') + '" data-pk="' + m + '">' + Number(m.slice(5)) + '월</button>'; }).join('') +
    '<input type="date" class="rng-in" id="per-from" min="' + first + '" max="' + last + '" value="' + (p ? p.from : last) + '">' +
    '<span class="muted">~</span>' +
    '<input type="date" class="rng-in" id="per-to" min="' + first + '" max="' + last + '" value="' + (p ? p.to : last) + '">' +
    '<button class="rng-btn' + (p && !p.key ? ' active' : '') + '" id="per-apply">보기</button>';
  if (!el.getAttribute('data-bound')) { el.addEventListener('click', perClick); el.setAttribute('data-bound', '1'); }
}
function perClick(ev){
  var b = ev.target.closest('[data-pk]');
  if (b) {
    var m = b.getAttribute('data-pk');
    S.per = m ? { key:m, from:m + '-01', to:dAdd(dAdd(m + '-01', 32).slice(0,8) + '01', -1) } : null;
  } else if (ev.target.closest('#per-apply')) {
    var f = document.getElementById('per-from').value, t = document.getElementById('per-to').value;
    if (!f || !t) return;
    S.per = f <= t ? { key:'', from:f, to:t } : { key:'', from:t, to:f };
  } else return;
  S.perOpen = {};
  render();
}
// 기간 모드 상단 카드 — 오늘 카드와 같은 틀, 목표 소진은 '하루 목표 × 일수'로 잰다
function renderPerKpi(T, n, p){
  function bar(v, cls){ return '<div class="bar"><i class="' + (cls||'') + '" style="width:' + Math.max(0, Math.min(v, 100)).toFixed(1) + '%"></i></div>'; }
  function lb(l, r){ return '<div class="bar-lb"><span>' + l + '</span><span>' + r + '</span></div>'; }
  function cls(v){ return v >= 100 ? 'good' : v >= 85 ? 'warn' : 'bad'; }
  var roas = T.spend ? T.val / T.spend * 100 : 0, goal = S.tSpend * n;
  var spendPct = goal ? T.spend / goal * 100 : 0, roasPct = S.tRoas ? roas / S.tRoas * 100 : 0;
  var lab = (p.key ? Number(p.key.slice(5)) + '월' : p.from.slice(5) + (p.from === p.to ? '' : ' ~ ' + p.to.slice(5))) + ' · ' + n + '일';
  var cards = [
    ['일예산 합계', won(T.daily) + '원', '일평균 <b>' + won(n ? T.daily / n : 0) + '원</b> · ' + lab +
      bar(T.daily ? T.spend / T.daily * 100 : 0) + lb('소진률 <b>' + pct(T.daily ? T.spend / T.daily * 100 : 0) + '</b>', '')],
    ['광고비', won(T.spend) + '원', '일평균 <b>' + won(n ? T.spend / n : 0) + '원</b>' +
      bar(spendPct, cls(spendPct)) + lb('목표(' + man(S.tSpend) + ' × ' + n + '일) 대비 <b>' + spendPct.toFixed(0) + '%</b>', '')],
    ['C1 ROAS', pct(roas), '전환 <b>' + won(T.purchases) + '건</b> · 전환값 ' + won(T.val) + '원' +
      bar(roasPct, cls(roasPct)) + lb('목표 ' + pct(S.tRoas) + ' 대비 <b>' + roasPct.toFixed(0) + '%</b>', '') +
      '<div><span class="tag ' + (roas >= S.tRoas ? 'up' : 'down') + '">목표 ' + pct(S.tRoas) + (roas >= S.tRoas ? ' 상회' : ' 미달 ' + (roas - S.tRoas).toFixed(0) + '%p') + '</span></div>'],
    ['C1 전환값', won(T.val) + '원', '일평균 <b>' + won(n ? T.val / n : 0) + '원</b> · CPA ' + (T.purchases ? won(T.spend / T.purchases) : '—') + '원' +
      '<br>객단가 ' + (T.purchases ? won(T.val / T.purchases) : '—') + '원 · CTR ' + (T.imp ? (T.clicks / T.imp * 100).toFixed(2) : '0.00') + '% · CVR ' + (T.clicks ? (T.purchases / T.clicks * 100).toFixed(2) : '0.00') + '%']
  ];
  document.getElementById('kpi').innerHTML = cards.map(function(c){
    return '<div class="card"><div class="cl">' + c[0] + '</div><div class="cv">' + c[1] + '</div><div class="cs">' + c[2] + '</div></div>';
  }).join('');
}

    o.daily += c.daily; o.spend += c.spend; o.purchases += c.purchases; o.val += c.val;
  });
  var rows = Object.keys(m).map(function(k){

    return { item:k, daily:o.daily, spend:o.spend, purchases:o.purchases, val:o.val,
             utm:s2.utmAmt, all:s2.allAmt };

function propSummary(w){

/* ── 지표 추이 모달 ──
   반짝이는 CTR/CVR/AOV 를 누르면 최근 며칠이 어떻게 흘러왔는지 보여준다.
   화살표 기호를 지운 대신 "눌러서 확인"으로 바꾼 것. 원지표(노출·클릭·전환)를 같이 보여줘야
   비율이 떨어진 게 분모가 늘어서인지 분자가 줄어서인지 판별된다. */
function pp(a, b, dec){ var d = a - b; return (d > 0 ? '+' : '') + d.toFixed(dec) + '%p'; }
function rel(a, b){ var d = (a - b) / b * 100; return (d > 0 ? '+' : '') + d.toFixed(0) + '%'; }
var MET = {
  ctr: { name:'CTR', fn:ctrOf, fmt:function(v){ return v.toFixed(2)+'%'; },
         dp:function(a,b){ return pp(a,b,2); },
         sub:function(m){ return won(m.clicks)+' / '+won(m.imp)+' 노출'; }, why:'클릭률 — 소재·타겟이 먹히는 정도' },
  cvr: { name:'CVR', fn:cvrOf, fmt:function(v){ return v.toFixed(1)+'%'; },
         dp:function(a,b){ return pp(a,b,1); },
         sub:function(m){ return won(m.purchases)+'건 / '+won(m.clicks)+' 클릭'; }, why:'전환율 — 클릭 후 실제 구매로 이어지는 정도' },
  aov: { name:'AOV', fn:aovOf, fmt:function(v){ return won(v); },
         dp:function(a,b){ return rel(a,b); },          // 원 단위라 %p 가 성립하지 않는다
         sub:function(m){ return won(m.val)+' / '+won(m.purchases)+'건'; }, why:'객단가 — 한 건당 매출' }
};
function openTrend(ev, key, metric, isItem){
  if (ev) ev.stopPropagation();
  S.trend = { key:key, metric:metric, isItem:!!isItem };
  push('t:' + key + ':' + metric);
  render();
}
function closeTrend(){ drop('t:' + S.trend.key + ':' + S.trend.metric); S.trend = null; render(); }

function renderTrend(){ document.getElementById('tmt').innerHTML = trendModal(); }

function trendModal(){
  if (!S.trend || !D.trend) return '';
  var M = MET[S.trend.metric], key = S.trend.key;
  var src = S.trend.isItem ? D.trend.item : D.trend.camp;
  var rec = (src && src[key]) || {};
  // 오늘 값은 화면 데이터에서 다시 만든다 (trend 에는 확정일만 들어 있다)
  var today = null, label = key;
  if (S.trend.isItem) {
    var acc = { imp:0, clicks:0, purchases:0, val:0, spend:0 };
    D.campaigns.filter(function(c){ return c.item === key && (!S.acct || c.account === S.acct); })
      .forEach(function(c){ acc.imp+=c.imp||0; acc.clicks+=c.clicks||0; acc.purchases+=c.purchases; acc.val+=c.val; acc.spend+=c.spend; });
    today = acc;
  } else {
    var c = D.campaigns.filter(function(x){ return x.id === key; })[0];
    if (c) { today = { imp:c.imp||0, clicks:c.clicks||0, purchases:c.purchases, val:c.val, spend:c.spend }; label = c.name; }
  }
  var pts = (D.trend.dates || []).map(function(d){
    return { d:d, m:rec[d], v: rec[d] ? M.fn(rec[d]) : null };
  }).filter(function(x){ return x.v != null; });
  if (today) pts.push({ d:D.dateStr, m:today, v:M.fn(today), today:true });

  var vals = pts.map(function(x){ return x.v; });
  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  var span = (mx - mn) || 1;
  var first = vals[0], last = vals[vals.length-1];
  var tot = first ? (last - first) / first * 100 : 0;
  var totTxt = pts.length > 1 ? M.dp(last, first) : '';

  var rows = pts.map(function(x, i){
    var prev = i ? pts[i-1].v : null;
    var dv = prev ? (x.v - prev) / prev * 100 : null;   // 색 판정은 상대 변화폭으로
    var dtxt = prev ? M.dp(x.v, prev) : null;           // 표기는 %p (AOV 만 %)
    var w = 6 + (x.v - mn) / span * 94;
    var cls = dv == null ? '' : dv <= -5 ? ' dn' : dv >= 5 ? ' up' : '';
    return '<tr' + (x.today ? ' class="tr-today"' : '') + '>' +
      '<td class="left">' + (x.today ? '<b>오늘</b> <span class="muted">' + D.pollTime + ' 기준</span>'
        : '<b>' + x.d.slice(5) + '</b> <span class="dow' + (dowOfStr(x.d) === '토' ? ' dow-sat' : dowOfStr(x.d) === '일' ? ' dow-sun' : '') + '">(' + dowOfStr(x.d) + ')</span>') + '</td>' +
      '<td class="tv">' + M.fmt(x.v) + '</td>' +
      '<td class="tc' + cls + '">' + (dtxt == null ? '<span class="muted">기준</span>' : dtxt) + '</td>' +
      '<td class="tbar"><span style="width:' + w.toFixed(1) + '%"></span></td>' +
      '<td class="left muted small">' + M.sub(x.m) + '</td></tr>';
  }).join('');

  return '<div class="tmodal" onclick="closeTrend()"><div class="tbox" onclick="event.stopPropagation()">' +
    '<button class="tclose" onclick="closeTrend()">×</button>' +
    '<div class="tt">' + esc(label) + '</div>' +
    '<div class="ts">' + M.name + ' 추이 · ' + M.why + '</div>' +
    '<div class="tsum ' + (tot < 0 ? 'dn' : 'up') + '">' + (pts.length > 1 ? M.fmt(first) + ' → ' + M.fmt(last) +
      '  <b>' + totTxt + '</b>' : M.fmt(last)) + '</div>' +
    '<table class="ttbl"><colgroup><col style="width:22%"><col style="width:15%"><col style="width:13%"><col style="width:26%"><col style="width:24%"></colgroup>' +
    '<thead><tr><th class="left">날짜</th><th>' + M.name + '</th><th>전일 대비</th><th></th><th class="left">근거</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="tnote">확정일은 하루 전체, 오늘은 ' + D.pollTime + ' 시점까지의 누적입니다. 오전에는 표본이 얇아 낮게 보일 수 있습니다.</div>' +
    '</div></div>';
}
function dowOfStr(d){ return '일월화수목금토'[new Date(d + 'T00:00:00+09:00').getDay()]; }

function sortRows(arr, s){
  arr.sort(function(a,b){
    var av = a[s.key], bv = b[s.key];
    if (typeof av === 'string' || typeof bv === 'string')
      return s.dir * String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv));
    return s.dir * ((av||0) - (bv||0));
  });
}

/* 화살표를 '일예산 숫자 끝' 과 '소진 숫자 시작' 의 정확한 중앙에 놓는다.
   칸 경계에 두면 두 칸 폭이 같아도 숫자가 우측정렬이라 일예산 쪽에 붙어 보인다. */
function placeArrows(){
  var zoom = parseFloat(getComputedStyle(document.body).zoom) || 1;
  // 칸 안에는 숫자 텍스트만 있는 게 아니라 변경 표식(.chgv) 같은 요소도 섞인다.
  // 화살표 자신은 빼고 나머지 내용의 좌·우 끝을 잡는다.
  function edge(cell, side){
    var ns = [], n;
    for (n = cell.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.className && String(n.className).indexOf('arw') >= 0) continue;
      if (n.nodeType === 3 && !n.textContent.trim()) continue;
      ns.push(n);
    }
    if (!ns.length) return null;
    var r = document.createRange();
    r.setStartBefore(ns[0]); r.setEndAfter(ns[ns.length - 1]);
    var b = r.getBoundingClientRect();
    return side === 'right' ? b.right : b.left;
  }
  var list = document.querySelectorAll('td.key.k2 .arw');
  for (var i = 0; i < list.length; i++) {
    var arw = list[i], td = arw.parentNode, prev = td.previousElementSibling;
    if (!prev) { arw.classList.remove('set'); continue; }
    var end = edge(prev, 'right'), start = edge(td, 'left');
    if (end == null || start == null) { arw.classList.remove('set'); continue; }
    // getBoundingClientRect 는 body zoom 이 반영된 값이라 CSS px 로 되돌려 놓는다
    var mid = ((end + start) / 2 - td.getBoundingClientRect().left) / zoom;
    var w = arw.getBoundingClientRect().width / zoom;
    arw.style.left = (mid - w / 2) + 'px';
    arw.classList.add('set');
  }
}
window.addEventListener('resize', placeArrows);
// 웹폰트가 늦게 뜨면 첫 배치가 몇 px 어긋난다 — 폰트 로드 후 한 번 더 잡는다
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeArrows);

  document.body.style.overflow = ''; render(); }
// ESC 는 한 단계씩만 접는다 — 펼쳐둔 게 있으면 마지막에 편 것부터, 없을 때만 모달을 닫는다.
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (S.stack.length) {
    var last = S.stack.pop();
    if (last.slice(0, 2) === 't:') S.trend = null;
    else if (last.slice(0, 2) === 'h:') delete S.openHist[last.slice(2)];
    else if (last.slice(0, 2) === 'c:') delete S.openCamp[last.slice(2)];
    else delete S.openChg[last.slice(2)];
    render();
    return;
  }
  if (S.ddSet) { ddGo(1); return; }
  if (S.ddCamp) { ddGo(0); return; }
  if (S.modalItem) closeItem();
});

// 품목 드릴다운 — 그 품목만 떼어내 한 화면에 보여준다. 캠페인/광고세트 펼침은 모달 안에서 그대로 동작.
function renderModal(list, cn){
  var ov = document.getElementById('dd-ov'), dd = document.getElementById('dd');
  if (!S.modalItem){ ov.style.display = 'none'; dd.style.display = 'none'; dd.innerHTML = ''; return; }
  var camps = list.filter(function(c){ return c.item === S.modalItem; });
  if (!camps.length){ closeItem(); return; }
  var expect = cn ? cn.cumShare*100 : 0;
  /* 메타 광고관리자처럼 한 단계씩 들어간다 (11/12 "캠페인 누르면 세트·소재가 한 화면에 섞여 보기 불편"):
     품목 → 캠페인 표 · 캠페인 → 광고세트 표 · 세트 → 소재 표. 위 경로를 눌러 되돌아가고 Esc 는 한 단계 뒤로. */
  var camp = S.ddCamp ? camps.filter(function(c){ return c.id === S.ddCamp; })[0] : null;
  if (S.ddCamp && !camp) { S.ddCamp = S.ddSet = null; }
  var aset = camp && S.ddSet ? (camp.adsets || []).filter(function(a){ return a.id === S.ddSet; })[0] : null;
  if (camp && S.ddSet && !aset) {
    var t0 = { spend:0, purchases:0, val:0 };
    Object.keys((D.adsToday && D.adsToday.ads) || {}).forEach(function(k){ var x = D.adsToday.ads[k]; if (x.set === S.ddSet) { t0.spend += x.spend; t0.purchases += x.purchases; t0.val += x.val; } });
    aset = { id: S.ddSet, name: '세트 ' + S.ddSet + ' (지금 보드 목록에 없음 — 꺼졌거나 보관된 세트)', daily: 0, spend: t0.spend, purchases: t0.purchases, val: t0.val };
  }
  var scope = aset ? [aset] : camp ? [camp] : camps;
  var A = agg(scope.map(function(x){ return { daily: x.daily || 0, spend: x.spend || 0, purchases: x.purchases || 0, val: x.val || 0, imp: x.imp, clicks: x.clicks }; }));
  A.pace = A.daily ? A.spend / A.daily * 100 : 0;

  var k = function(l, v){ return '<div class="dd-k"><div class="dd-kl">' + l + '</div><div class="dd-kv">' + v + '</div></div>'; };
  var crumb = '<span class="bc' + (camp ? ' bc-l' : '') + '" onclick="ddGo(0)">' + esc(S.modalItem) + '</span>' +
    (camp ? ' <span class="bc-sep">›</span> <span class="bc' + (aset ? ' bc-l' : '') + '" onclick="ddGo(1)" title="' + esc(camp.name) + '">' + esc(camp.name) + '</span>' : '') +
    (aset ? ' <span class="bc-sep">›</span> <span class="bc" title="' + esc(aset.name) + '">' + esc(aset.name) + '</span>' : '');
  var sub = aset ? '광고세트 · 아래는 이 세트 소재 (최근 7일)'
          : camp ? (camp.adsets || []).length + '개 광고세트 · 행을 누르면 소재로 들어갑니다'
          : camps.length + '개 캠페인 · 행을 누르면 광고세트로 들어갑니다';
  var head = function(first){
    return '<table class="grid"><colgroup>' +
      COLS.map(function(c){ return '<col' + (c.w ? ' style="width:' + c.w + '"' : '') + '>'; }).join('') +
      '</colgroup><thead><tr>' +
      COLS.map(function(c){
        return '<th class="sortable' + (c.left?' left':'') + (KEYCOL[c.k]?' ' + KEYCOL[c.k]:'') + (S.sortDD.key===c.k?' sort-active':'') +
          '" onclick="setSort(\'' + c.k + '\',1)">' + (c.k === 'name' ? first : sortHead(c, S.sortDD)) + '</th>';
      }).join('') + '</tr></thead><tbody>';
  };
  var body = aset ? adTable(camp.id, aset.id)
           : camp ? head('광고세트') + adsetRows(camp) + '</tbody></table>'
           : head(sortHead(COLS[0], S.sortDD)) + campRows(camps, expect) + '</tbody></table>';
  dd.innerHTML =
    '<div class="dd-hd"><div style="min-width:0">' +
      '<div class="dd-t">' + crumb + '</div>' +
      '<div class="dd-s">' + sub + ' · ' + D.dateStr + ' ' + D.pollTime + ' 기준</div>' +
    '</div><div style="display:flex;align-items:center"><button class="dd-todo' + (S.todoOnly ? ' on' : '') + '" onclick="S.todoOnly=!S.todoOnly;render()" title="할 일이 있는 캠페인·세트·소재만 남김">할 일만 보기' + (S.todoOnly ? ' ✓' : '') + '</button>' +
    '<button class="dd-x" onclick="closeItem()" title="닫기 (Esc)">×</button></div></div>' +
    '<div class="dd-kpi">' +
      k('일예산', A.daily ? won(A.daily) : '—') + k('소진', won(A.spend)) +
      '<div class="dd-k' + (A.daily ? slowCls(A.pace, expect) : '') + '"><div class="dd-kl">페이스</div><div class="dd-kv">' + (A.daily ? paceVal(A.pace, expect) : '—') + '</div></div>' +
      k('C1 전환', won(A.purchases) + '건') +
      k('C1 ROAS', roasPill(A.spend ? A.val / A.spend * 100 : 0, A.spend)) +
      (aset ? '' : k('실매출 ROAS', realCell(realAgg(camp ? [camp] : camps)))) +
    '</div>' + body;
  ov.style.display = 'block'; dd.style.display = 'block';
}
// 펼침 순서를 쌓아둔다 — ESC 가 마지막에 편 것부터 되돌리기 위해.

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}
function copyName(ev, id){
  ev.stopPropagation();
  var r = D.campaigns.filter(function(c){ return c.id === id; })[0];
  if (!r) return;
  var done = function(){ toast('복사됨 — ' + r.name.slice(0,40) + (r.name.length>40?'…':'')); };
  var fallback = function(){
    // clipboard API 가 막힌 환경(비-HTTPS 등) 대비
    var ta = document.createElement('textarea');
    ta.value = r.name; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(r.name).then(done).catch(fallback);
  } else fallback();
}

  if (localStorage.getItem('bdg_fold') === '1') fold.open = true;
  fold.addEventListener('toggle', function(){ localStorage.setItem('bdg_fold', fold.open ? '1' : '0'); });
  var fc = document.getElementById('fold-chg');
  if (localStorage.getItem('bdg_foldchg') === '1') fc.open = true;   // 기본 접힘
  fc.addEventListener('toggle', function(){ localStorage.setItem('bdg_foldchg', fc.open ? '1' : '0'); });
})();

/* 데이터가 몇 시 것인지 늘 보이게 한다. 10분 넘게 묵으면 주황으로 바꿔 '갱신 지연'을 알린다.
   화면은 정적 파일이라 시간이 갈수록 낡는데, 그걸 모른 채 실시간으로 착각하는 게 제일 위험하다. */
function dataAgeMin(){
  var p = D.pollTime.split(':');
  var t = Date.parse(D.dateStr + 'T' + p[0] + ':' + p[1] + ':00+09:00');
  return (Date.now() - t) / 60000;
}
function updateStamp(){
  var el = document.getElementById('data-stamp'); if (!el) return;
  if (D.isArchive) { el.textContent = D.dateStr + ' 마감 기록'; return; }
  var m = Math.max(0, Math.round(dataAgeMin()));
  el.textContent = '데이터 기준 ' + D.dateStr.slice(5) + ' ' + D.pollTime + (m >= 1 ? '  (' + m + '분 전)' : '  (방금)');
  el.className = 'hd-gen' + (m > 10 ? ' stale' : '');
  if (m > 10) el.title = '10분마다 자동 갱신인데 그보다 오래됐습니다 — 수집이 밀렸거나 캐시된 화면일 수 있습니다';
}
setInterval(function(){ updateStamp(); render(); }, 30000);

// meta refresh 는 같은 URL 이라 CDN 캐시를 그대로 물 수 있다 — 매번 다른 쿼리로 새로 받는다.
if (!D.isArchive) setTimeout(function(){
  location.replace(location.pathname + '?v=' + Date.now());
}, 600000);

syncInputs(); render(); updateStamp();
</script>
</body>
</html>
