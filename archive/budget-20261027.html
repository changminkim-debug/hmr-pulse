/* ── 디자인 토큰 ──
   리뉴얼 지침(2026-09-21)의 hex 를 기준으로 구성. 라이트 테마 전용.
   액센트는 --ac 하나만 쓴다 — 진행바 / 정렬 활성 / 바인딩 표시. 그 외에는 회색조. */
:root{
  --bg:#F0F2F7;
  --surface:#FFFFFF;
  --line:#EAECF0;
  --line-2:#F2F4F7;
  --ink:#101828;
  --ink-2:#475467;
  --ink-3:#667085;
  --ink-4:#98A2B3;
  --ac:#4C63E6;
  --ac-weak:#EEF1FE;
  --good:#067647;
  --bad:#B42318;
  --warn:#B54708;
  --violet:#9E77ED;
  --chip:#F2F4F7;
  --r:14px;
}

*{margin:0;padding:0;box-sizing:border-box}
/* 100% 배율에서 110%로 본 것처럼 — 1920 같은 넓은 화면에서 아래쪽이 휑해 보여서
   폰트·여백을 따로 손대지 않고 화면 전체를 한 번에 키운다. */
body{
  zoom:1;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}

/* ── 헤더 ── */
/* 헤더·필터바는 배경만 100% 폭으로 깔고, 안쪽 내용물은 본문과 같은 기준선에 맞춘다 */
.hd{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd-in{max-width:1860px;margin:0 auto;padding:5px 14px;display:flex;justify-content:space-between;align-items:center}
.hd-left{display:flex;align-items:center;gap:13px}
.hd-logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center}
.hd-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12px;color:var(--ink-4);margin-top:2px;font-weight:400}
.hd-right{text-align:right}
.hd-date{font-size:14.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;gap:7px}
.hd-time{color:var(--ink-4);font-weight:400}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(6,118,71,.12)}
.hd-gen{font-size:13px;color:var(--ink-3);margin-top:4px;font-weight:600}
/* 갱신이 밀리면 시각을 주황으로 — 옛 화면을 실시간으로 착각하지 않게 */
.hd-gen.stale{color:var(--warn);background:#FFFAEB;border:1px solid #FEDF89;padding:2px 9px;border-radius:7px;display:inline-block}
.hd-refresh{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--ink-3);
  background:var(--line-2);border:1px solid var(--line);padding:4px 11px;border-radius:8px;text-decoration:none}
.hd-refresh:hover{color:var(--ac);border-color:var(--ac);background:#fff}
.basis{font-size:11.5px;color:var(--ink-4);margin-top:6px;line-height:1.5;font-weight:400}
.basis b{color:var(--ink-3);font-weight:600}
.arch-note{font-size:11.5px;font-weight:600;color:var(--warn);background:#FFFAEB;border:1px solid #FEDF89;padding:2px 8px;border-radius:6px}

/* ── 필터바 ── */
.fbar{background:var(--surface);border-bottom:1px solid var(--line)}
.fbar-in{max-width:1860px;margin:0 auto;padding:5px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.seg{display:flex;gap:2px;background:var(--line-2);border-radius:9px;padding:3px}
.seg-btn{border:none;background:transparent;padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;font-family:inherit;white-space:nowrap}

.sel{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink);font-family:inherit;background:var(--surface);cursor:pointer;font-weight:600}
.sel:hover{border-color:var(--ink-4)}

/* ── 레이아웃 ── */
.page-body{max-width:1860px;margin:0 auto;padding:10px 14px 4px;display:flex;flex-direction:column;gap:9px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* 히어로 KPI — 가장 먼저 보는 곳이라 마우스에 반응하게 둔다 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 16px;transition:border-color .15s,box-shadow .15s,transform .15s;cursor:default}
.card:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(76,99,230,.10);transform:translateY(-2px)}

.cl{font-size:12px;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.cv{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.7px;color:var(--ink)}
.cs{font-size:12px;color:var(--ink-4);margin-top:7px;white-space:normal;word-break:keep-all;line-height:1.5;font-weight:400}
.cs b{color:var(--ink-2);font-weight:600}

/* 비교 태그 — 전일 동시각 대비 등 */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-3);margin-top:9px}
.tag.up{background:#ECFDF3;color:var(--good)}
.tag.down{background:#FEF3F2;color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}

.panel-main .sec-title{font-size:15px}
.hint{font-size:12px;color:var(--ink-4);font-weight:400;margin-left:4px}

.fold>summary{padding-top:8px;padding-bottom:8px;cursor:pointer;list-style:none;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'';width:0;height:0;border-left:5px solid var(--ink-4);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--ink)}
.fold-body{margin-top:14px}

/* ── 표 ── */
table{width:100%;border-collapse:collapse;background:var(--surface)}
thead tr{background:transparent}
th{padding:10px 16px;color:var(--ink-3);font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th.left{text-align:left}
td{padding:10px 16px;font-size:14px;font-weight:400;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
td.left{text-align:left}
tfoot td{background:var(--line-2);font-weight:700;color:var(--ink);border-top:1px solid var(--line);border-bottom:none}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sort-active{color:var(--ac)}
.sort-ic{font-size:8px;opacity:.4}

/* ── 3계층 한 표 ──
   품목 / 캠페인 / 광고세트가 같은 colgroup 을 쓰므로 세로선이 항상 맞는다.
   깊이는 배경 농도와 왼쪽 들여쓰기로만 구분한다. */
table.grid{table-layout:fixed;width:100%}
/* 가장 많이 보는 두 값(일예산·소진)만 살짝 띄워 준다.
   색을 더 쓰지 않고 배경 한 톤 + 글자 굵기로만 — 요란해지지 않게. */
th.key,td.key{background:#F7F9FD}
tr.lv1 td.key,tr.lv2 td.key,tr.lv3 td.key,tfoot td.key{background:#F4F7FD}

/* 일예산 → 소진 흐름을 한눈에. 절대배치라 숫자 정렬은 그대로 */

.chip-abo::before{background:var(--violet)}
.chip-off{color:var(--ink-4)}
.det{display:inline-block;font-size:10.5px;font-weight:600;color:var(--warn);background:#FFFAEB;padding:1px 5px;border-radius:5px;margin-left:3px}
.attr{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--chip);padding:2px 7px;border-radius:6px;white-space:nowrap}
.attr-c1{color:var(--ac);background:var(--ac-weak)}
.bid{font-size:13px;white-space:nowrap}
.bid-k{font-weight:600;color:var(--ink-3)}
.bid-v{font-weight:600;color:var(--ink);margin-left:4px}
.bid-none{color:var(--ink-4);font-weight:400}

td.nmcell{text-align:left;user-select:text}
/* 캠페인명은 절대 자르지 않는다 — 잘리면 비슷한 이름끼리 구분이 안 된다(2026-09-22 피드백).
   대신 글자를 줄이고 줄바꿈을 허용해 전체를 보여준다. 버튼은 첫 줄 오른쪽에 고정. */
.nm{color:var(--ink-2);font-size:11.5px;line-height:1.4;letter-spacing:-.3px;
    flex:1 1 auto;min-width:0;white-space:normal;word-break:break-all;overflow-wrap:anywhere}
.nmwrap{display:flex;align-items:flex-start;gap:3px;min-width:0;max-width:100%}
.nmwrap .arrow,.nmwrap .iconbtn{flex:0 0 auto;margin-top:1px}
table.grid td.nmcell{white-space:normal;vertical-align:middle}
table.grid td.itemname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-wrap .nm{font-size:12.5px}
.iconbtn{border:none;background:transparent;cursor:pointer;font-size:11px;padding:0 2px;border-radius:5px;opacity:.4;line-height:1;vertical-align:middle}
.iconbtn:hover{opacity:1;background:var(--line-2)}

/* ROAS — 배경 없이 글자색만 */
td.roas{font-weight:600}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:-.1px}
.pill-hi{background:#E6F4EC;color:#067647}
.pill-mid{background:#EEF1F6;color:#344054}
.pill-lo{background:#FDECEA;color:#B42318}
.pill-na{background:var(--line-2);color:var(--ink-4);font-weight:600}
.pill-tight{padding:3px 6px;font-size:11.5px;letter-spacing:-.3px}
tr.lv1 .pill{font-size:13px;padding:3px 12px}
.r-hi3,.r-hi2,.r-hi1{color:var(--good)}
.r-lo1,.r-lo2,.r-lo3{color:var(--bad)}
.r-mid{color:var(--ink)}
.r-na{color:var(--ink-4);font-weight:400}
.p-lo{color:var(--warn)}
.p-hi{color:var(--ac)}
.muted{color:var(--ink-4)}
.na{color:var(--ink-4);font-size:13px}

/* 진행 바 */
.bar{height:5px;border-radius:999px;background:var(--line-2);margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--ac);transition:width .3s}
.bar>i.warn{background:var(--warn)}
.bar>i.bad{background:var(--bad)}
.bar>i.good{background:var(--good)}
.bar-lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-4);margin-top:6px;font-weight:400}
.bar-lb b{color:var(--ink-2);font-weight:600}

/* 예상 (마감 시점 추정) */
.proj{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.proj-cell{padding:14px 16px;border-right:1px solid var(--line);background:var(--surface)}
.proj-cell:last-child{border-right:none}
.proj-l{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.proj-v{font-size:21px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.4px}
.proj-s{font-size:12px;margin-top:6px;font-weight:400;color:var(--ink-4)}

/* ── 품목 드릴다운 모달 (dashboard.html 소재 드릴다운과 같은 방식) ── */
#dd-ov{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:200}
#dd{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(1700px,86vw);max-height:92vh;overflow-y:auto;background:var(--surface);
    border-radius:16px;padding:26px 28px;z-index:201;box-shadow:0 24px 64px rgba(16,24,40,.22)}
/* zoom 1.1 이 걸려 있어 vw 가 실제 화면보다 크게 잡힌다 — 86vw 로 여유를 둔다 */
.dd-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.dd-t{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.dd-s{font-size:12.5px;color:var(--ink-4);margin-top:4px}
.dd-x{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:8px;
      font-size:16px;line-height:1;color:var(--ink-3);cursor:pointer;flex:none;font-family:inherit}
.dd-x:hover{border-color:var(--ink-4);color:var(--ink)}
.dd-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.dd-k{border:1px solid var(--line);border-radius:10px;padding:14px 18px;background:#FCFCFD}
.dd-kl{font-size:11.5px;color:var(--ink-4);font-weight:600;margin-bottom:5px}
.dd-kv{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.4px}

/* 페이스 경고 — 느린 캠페인은 눈에 걸리게 */
/* 페이스가 크게 밀린 칸은 칸 전체가 은은하게 숨 쉬게 한다 — 아이콘보다 눈에 잘 걸리고
   숫자 정렬도 안 건드린다. */
td.pace{position:relative}
/* 칸 전체가 반짝이면 너무 요란해서 숫자와 기호만 묶어 반짝인다 */
.pw{display:inline-flex;align-items:center;gap:3px;padding:2px 5px;border-radius:7px;
  font-weight:600;color:#B54708;animation:slowpulse 1.1s ease-in-out infinite}
.pw::before{content:'⚠';font-size:12px;line-height:1}
.dd-k.slow .dd-kv{color:#B54708}
@keyframes slowpulse{0%,100%{background-color:rgba(254,240,199,.15)}50%{background-color:rgba(254,240,199,1)}}
.dd-k.slow .dd-kv{color:#B54708}
@media (prefers-reduced-motion:reduce){ .pw{animation:none;background-color:rgba(254,240,199,.75)} }

/* ── 퍼널 추세 (CTR·CVR·AOV) ──
   전일보다 떨어지면 노란 숨쉬기, 3일 연속이면 빨간 숨쉬기 + 막대 아이콘.
   페이스 경고(.pw)와 같은 리듬을 쓰되 색으로 구분한다 — 한 화면에 둘이 같이 떠도
   "느린 건 노랑, 꺾이는 건 빨강"으로 읽히게. */
.fw{display:inline-flex;align-items:center;padding:2px 6px;border-radius:6px;font-weight:700;white-space:nowrap}
.fw.d1:hover,.fw.d3:hover{outline:1.5px solid currentColor;outline-offset:1px}
.fw.d1{color:#B54708;animation:slowpulse 1.1s ease-in-out infinite}
.fw.d1{cursor:pointer}
.fw.d3{color:#B42318;animation:droppulse 0.85s ease-in-out infinite}
.fw.d3{cursor:pointer}
@keyframes droppulse{0%,100%{background-color:rgba(253,236,234,.2)}50%{background-color:rgba(253,236,234,1)}}
@media (prefers-reduced-motion:reduce){
  .fw.d1{animation:none;background-color:rgba(254,240,199,.75)}
  .fw.d3{animation:none;background-color:rgba(253,236,234,.85)}
}
td.fnl{color:var(--ink-2)}
th.fnl{color:var(--ink-3)}

/* 지표 추이 모달 — 드릴다운보다 가볍게, 표 위에 겹쳐 띄운다 */
.tmodal{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:9000;display:flex;align-items:center;justify-content:center;padding:24px}
.tbox{background:var(--surface);border-radius:16px;width:min(640px,100%);padding:24px 26px 20px;position:relative;
  box-shadow:0 20px 48px rgba(16,24,40,.24);max-height:88vh;overflow:auto}
.tclose{position:absolute;top:14px;right:14px;border:0;background:var(--line-2);color:var(--ink-3);
  width:30px;height:30px;border-radius:9px;font-size:18px;cursor:pointer;line-height:1}
.tclose:hover{background:var(--line);color:var(--ink)}
.tt{font-size:16px;font-weight:700;padding-right:36px;word-break:break-all;line-height:1.35}
.ts{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.tsum{font-size:19px;font-weight:700;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.tsum.dn{color:#B42318}.tsum.up{color:#067647}
table.ttbl{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:10px}
table.ttbl th{font-size:11px;color:var(--ink-4);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
table.ttbl td{font-size:13.5px;padding:10px 8px;text-align:right;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
table.ttbl th.left,table.ttbl td.left{text-align:left}
table.ttbl td.tv{font-weight:700}
table.ttbl td.tc{font-weight:700;color:var(--ink-4)}
table.ttbl td.tc.dn{color:#B42318}table.ttbl td.tc.up{color:#067647}
table.ttbl td.small{font-size:11.5px}
td.tbar{padding:10px 8px}
td.tbar span{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,#BBD3F0,#5B86C8)}
tr.tr-today td{background:#F4F7FC}
tr.tr-today td.tbar span{background:linear-gradient(90deg,#9FBEE8,#1D3A6E)}
.tnote{font-size:11.5px;color:var(--ink-4);margin-top:12px;line-height:1.6}

/* 지금 볼 것 — 표 위에 얹는 얇은 줄. 클릭하면 해당 품목 드릴다운이 열린다. */
#watch{background:var(--surface);border:1px solid #E4E7EC;border-radius:12px;padding:0 14px;
  box-shadow:0 1px 2px rgba(16,24,40,.05)}
#wt-d>summary{list-style:none;cursor:pointer}
#wt-d>summary::-webkit-details-marker{display:none}
#wt-d>summary::before{content:'\25B8';font-size:10px;color:var(--ink-4);transition:transform .15s;display:inline-block}
#wt-d[open]>summary::before{transform:rotate(90deg)}
.wt-brief{font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--line-2);padding:2px 9px;border-radius:99px}
.wt-h{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:7px;padding:9px 0}
.wt-n{background:var(--ac);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.wt-sub{font-size:11px;font-weight:600;color:var(--ink-4);margin-left:auto}
.wt-list{display:flex;flex-direction:column;padding-bottom:6px}
.wt-i{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
.wt-i:hover{background:var(--line-2)}
.wt-b{flex:0 0 84px;font-size:11.5px;font-weight:700;padding:3px 0;border-radius:6px;text-align:center}
.wt-i.up .wt-b{background:#E6F4EC;color:#067647}
.wt-i.down .wt-b{background:#EEF1F6;color:#475467}
.wt-i.warn .wt-b{background:#FEF0C7;color:#B54708}
.wt-nm{flex:0 0 32%;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-w{flex:1 1 auto;color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-a{flex:0 0 auto;color:var(--ink-2);font-size:12.5px;font-weight:600}
@media(max-width:1200px){.wt-i{flex-wrap:wrap}.wt-nm,.wt-w{flex:1 1 100%}}

.folds{display:flex;gap:9px}
.folds>.panel{padding:4px 14px}
.folds>.panel{flex:1 1 50%;min-width:0}
.ft-more{color:var(--ink-3);border-bottom:1px dotted var(--ink-4);cursor:help;margin-left:4px}
@media(max-width:1100px){.folds{flex-direction:column}}

.sbox{margin-top:26px;background:var(--surface);border:1px solid #DCD5EC;border-radius:13px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.05);position:relative}
/* 위 두 박스와 성격이 달라(전일 확정 데이터) 구분선을 하나 둔다 */
.sbox::before{content:'';position:absolute;top:-14px;left:0;right:0;height:1px;background:var(--line)}
.pbt-sales{background:#F3F0FA;color:#5B4B9A}
.pbt-sub{font-weight:600;color:var(--ink-4);margin-left:8px;font-size:10.5px}
.sbox td.sv{color:var(--ink-2)}
.sbox td.sr{font-weight:700;color:var(--ink-3)}
.sbox td.sr.r-hi{color:#067647;background:#F4FBF7}
.sbox td.sr.r-lo{color:#B54708;background:#FFFBF2}
.sbox td.sc{font-weight:600;color:var(--ink-3)}
.snote{font-size:11.5px;color:var(--ink-4);line-height:1.7;padding:9px 14px 11px;border-top:1px solid var(--line-2)}

/* 당월 누적 — 필터바 오른쪽 끝에 붙여 오늘 지표와 나란히 둔다 */
#mbox{margin-left:6px}
.fbar-in #fresh-note{margin-left:auto}
#m-d>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 13px}
#m-d>summary::-webkit-details-marker{display:none}
#m-d>summary:hover{border-color:var(--ac)}
.m-mm{font-size:12.5px;font-weight:800;color:var(--ac);background:var(--ac-weak);padding:2px 9px;border-radius:7px}
.m-kv{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.m-kv i{font-style:normal;font-size:10.5px;color:var(--ink-4);font-weight:600}
.m-kv b{font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.m-kv b.m-hi{color:#067647}
.m-sub{font-size:10.5px;color:var(--ink-4);font-weight:600}
.m-body{position:absolute;right:14px;margin-top:8px;z-index:60;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(16,24,40,.16);
  padding:12px 14px;min-width:620px}
table.m-tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.m-tbl th{font-size:11px;color:var(--ink-4);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.m-tbl td{font-size:13px;text-align:right;padding:8px;border-bottom:1px solid var(--line-2)}
table.m-tbl th.left,table.m-tbl td.left{text-align:left;font-weight:600}
table.m-tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}

#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:9999}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.ft{text-align:center;padding:1px 20px 3px;font-size:10.5px;color:var(--ink-4);line-height:1.5;font-weight:400}
@media(max-width:1200px){.cards{grid-template-columns:repeat(2,1fr)}.proj{grid-template-columns:repeat(2,1fr)}}
/* 아주 넓은 화면에서는 살짝 키워 여백을 덜 남긴다 */
@media(min-width:2200px){body{zoom:1.12}}
/* 기간 합계 — 날짜 구간을 찍으면 그 사이 전체를 더해 보여준다(일자 스냅샷 기반) */
.rng{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 12px;margin-bottom:14px}
.rng-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rng-t{font-size:15px;font-weight:700;color:var(--ink);margin-right:6px;white-space:nowrap}
.rng-tog{display:flex;align-items:center;gap:7px;border:none;background:none;padding:2px 4px 2px 0;cursor:pointer;font-family:inherit}
.rng-tog:hover .rng-t{color:var(--ac)}
.rng-chev{width:0;height:0;border-left:5px solid var(--ink-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transform:rotate(90deg);transition:transform .15s}
.rng-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rng-mini{display:none;font-size:13px;color:var(--ink-3);white-space:nowrap}
.rng-mini b{color:var(--ink);font-weight:700}
.rng.folded .rng-chev{transform:none}
.rng.folded .rng-ctl,.rng.folded .rng-body{display:none}
.rng.folded .rng-mini{display:inline}
.rng-btn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer;font-family:inherit;white-space:nowrap}
.rng-btn:hover{border-color:var(--ac);color:var(--ac)}
.rng-btn.active{background:var(--ac);border-color:var(--ac);color:#fff}
.rng-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.rng-in{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);font-family:inherit;background:var(--surface)}
.rng-badge{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.rng-badge b{color:var(--ac)}
.rng-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.rng-c{background:var(--line-2);border-radius:10px;padding:10px 14px}
.rng-c .cl{margin-bottom:4px}
.rng-c .cv{font-size:20px}
.rng-c .cs{margin-top:4px}
.rng-note{font-size:11.5px;color:var(--ink-4);margin-top:8px}
.rng details{margin-top:10px}
.rng summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);list-style:none;user-select:none}
.rng summary::-webkit-details-marker{display:none}
.rng summary::before{content:'▸ ';color:var(--ink-4)}
.rng details[open] summary::before{content:'▾ '}
.rng-tbls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.rng-tbls table{width:100%;border-collapse:collapse}
.rng-tbls td,.rng-tbls th{padding:7px 10px;font-size:13px}
.rng-tbls td.left,.rng-tbls th.left{text-align:left}
.rng-live{font-size:11px;font-weight:700;color:var(--warn);margin-left:4px}
@media(max-width:1400px){.rng-cards{grid-template-columns:repeat(3,1fr)}.rng-tbls{grid-template-columns:1fr}}
.rng-tbls>div{overflow-x:auto;min-width:0}
@media(max-width:700px){.rng-cards{grid-template-columns:repeat(2,1fr)}.rng-badge{margin-left:0}.rng-c .cv{font-size:16px}.rng{padding:12px}}


/* 비밀번호 게이트 */
#pw-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999}
#pw-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:330px}
#pw-logo{font-size:17px;font-weight:700;color:var(--ink)}
#pw-sub{font-size:12.5px;color:var(--ink-4);margin-top:-10px;font-weight:400}
#pw-input{width:100%;padding:11px 16px;border-radius:9px;border:1px solid var(--line);font-size:14.5px;outline:none;text-align:center;letter-spacing:3px;font-family:inherit}
#pw-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-weak)}
#pw-btn{width:100%;padding:11px;border-radius:9px;background:var(--ac);color:#fff;font-size:13.5px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
#pw-btn:hover{filter:brightness(.95)}
#pw-err{font-size:12px;color:var(--bad);height:16px;font-weight:400}
</style>
</head>
<body>
<div id="pw-overlay">
  <div id="pw-box">
    <div id="pw-logo">HMR 일예산 보드</div>

/* ── 유틸 ── */
function won(v){ return Math.round(v || 0).toLocaleString('ko-KR'); }
function pct(v){ return (v || 0).toFixed(0) + '%'; }
function man(v){ return Math.round((v||0)/10000).toLocaleString('ko-KR') + '만'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// 목표선 대비 상대 위치로만 색을 준다 — 절대 임계값을 박으면 목표가 바뀔 때 색이 안 따라온다.
// ROAS 는 pill 로 — 표에서 제일 먼저 읽는 값이라 덩어리로 보이게 한다
function roasPill(r, spend){
  if (!spend) return '<span class="pill pill-na">—</span>';
  var t = S.tRoas;
  // 낮은 쪽을 빨갛게 칠하면 표가 온통 붉어져 오히려 안 읽힌다.
  // 목표 이상만 초록으로 집고 나머지는 중립으로 둔다.
  var c = r >= t ? 'pill-hi' : 'pill-mid';
  // 네 자리 %(소진이 아주 적은 캠페인)는 기본 pill 폭을 넘겨 잘린다 — 좁은 변형을 쓴다
  var tight = r >= 1000 ? ' pill-tight' : '';
  return '<span class="pill ' + c + tight + '">' + pct(r) + '</span>';
}
// 페이스 경고 — 이 시각 평년 소진비중의 60% 미만이면 "예산이 안 나가고 있다"는 신호
// 잔여 예산 = 일예산 - 소진. 예산을 넘겨 쓴 경우(-)도 그대로 보여준다.
function remainCell(daily, spend){
  if (!daily) return '<span class="na">—</span>';
  var v = daily - spend;
  return v < 0 ? '<span class="over">' + won(v) + '</span>' : won(v);
}

function isSlow(p, expect){ return !!(expect && p < expect * 0.6); }
function slowCls(p, expect){ return isSlow(p, expect) ? ' slow' : ''; }
// 반짝임은 칸이 아니라 값에만 건다 — 넓은 칸이 통째로 깜빡이면 너무 요란하다
function paceVal(p, expect){
  return isSlow(p, expect) ? '<span class="pw">' + pct(p) + '</span>' : pct(p);
}
function slowTitle(p, expect){
  return (expect && p < expect * 0.6)
    ? ' title="이 시각 평년 페이스(' + expect.toFixed(0) + '%)의 60% 미만 — 소진이 크게 밀림"' : '';
}
// 목표 미달 행 표시용 (소진이 있어야 판정)



/* ── 퍼널 지표 ──
   CTR = 클릭 ÷ 노출, CVR = 전환 ÷ 클릭, AOV = 전환값 ÷ 전환.
   비율은 합계를 먼저 내고 나눠야 맞다(품목 롤업에서 평균의 평균을 내면 틀린다). */
function ctrOf(m){ return m && m.imp ? m.clicks / m.imp * 100 : null; }
function cvrOf(m){ return m && m.clicks ? m.purchases / m.clicks * 100 : null; }
function aovOf(m){ return m && m.purchases ? m.val / m.purchases : null; }

/* 오늘 값이 어제보다 낮은가, 며칠째 낮아지는가.
   비교 대상은 '확정된 전일 전체'다 — 캠페인별 시간대 데이터는 저장하지 않아
   어제 같은 시각 값을 만들 수 없다. 그래서 오전에는 표본이 얇아 과민하게 뜰 수 있다. */
function trendOf(key, isItem, fn, todayVal){
  if (todayVal == null || !D.trend) return '';
  var src = isItem ? D.trend.item : D.trend.camp;
  var rec = src && src[key];
  if (!rec) return '';
  var ds = (D.trend.dates || []).slice();          // 오래된 → 최근
  var vals = ds.map(function(d){ return fn(rec[d]); }).filter(function(v){ return v != null; });
  if (!vals.length) return '';
  var prev = vals[vals.length - 1];
  if (!(todayVal < prev)) return '';
  // 3일 연속 = 오늘 < 전일 < 전전일 < 3일전
  var seq = vals.concat([todayVal]);
  var down = seq.length >= 4;
  if (down) for (var i = seq.length - 1; i > seq.length - 4; i--) if (!(seq[i] < seq[i-1])) { down = false; break; }
  return down ? 'd3' : 'd1';
}

function fnlCell(txt, cls, tip, key, metric, isItem){
  if (!cls) return txt;
  var click = key ? ' onclick="openTrend(event,\'' + esc(key) + '\',\'' + metric + '\',' + (isItem ? 1 : 0) + ')"' : '';
  return '<span class="fw ' + cls + '"' + (tip ? ' title="' + esc(tip) + ' · 눌러서 추이 보기"' : '') + click + '>' + txt + '</span>';
}
function pct1(v){ return v == null ? '<span class="na">—</span>' : v.toFixed(2) + '%'; }
function pct0(v){ return v == null ? '<span class="na">—</span>' : v.toFixed(1) + '%'; }

/* 오른쪽 박스용 — CTR·CVR·AOV 세 칸만 */
function fnlTrio(m, key, isItem){
  var c = ctrOf(m), v = cvrOf(m), a = aovOf(m);
  var t1 = trendOf(key, isItem, ctrOf, c), t2 = trendOf(key, isItem, cvrOf, v), t3 = trendOf(key, isItem, aovOf, a);
  var lbl = function(x){ return x === 'd3' ? '3일 연속 하락' : x === 'd1' ? '전일 대비 하락' : ''; };
  return '<td class="fnl">' + fnlCell(pct1(c), t1, lbl(t1) + ' — CTR', key, 'ctr', isItem) + '</td>' +
    '<td class="fnl">' + fnlCell(pct0(v), t2, lbl(t2) + ' — CVR', key, 'cvr', isItem) + '</td>' +
    '<td class="fnl">' + fnlCell(a == null ? '<span class="na">—</span>' : won(a), t3, lbl(t3) + ' — AOV', key, 'aov', isItem) + '</td>';
}

/* 드릴다운용 — 노출부터 AOV 까지 7칸 */
function funnelCells(m, key, isItem){
  var ctr = ctrOf(m), cvr = cvrOf(m), aov = aovOf(m);
  var t1 = trendOf(key, isItem, ctrOf, ctr);
  var t2 = trendOf(key, isItem, cvrOf, cvr);
  var t3 = trendOf(key, isItem, aovOf, aov);
  var lbl = function(c){ return c === 'd3' ? '3일 연속 하락' : c === 'd1' ? '전일 대비 하락' : ''; };
  return '<td class="fnl">' + won(m.imp) + '</td>' +
    '<td class="fnl">' + won(m.clicks) + '</td>' +
    '<td class="fnl">' + fnlCell(pct1(ctr), t1, lbl(t1) + ' — CTR', key, 'ctr', isItem) + '</td>' +
    '<td>' + won(m.purchases) + '</td>' +
    '<td class="fnl">' + fnlCell(pct0(cvr), t2, lbl(t2) + ' — CVR', key, 'cvr', isItem) + '</td>' +
    '<td>' + won(m.val) + '</td>' +
    '<td class="fnl">' + fnlCell(aov == null ? '<span class="na">—</span>' : won(aov), t3, lbl(t3) + ' — AOV', key, 'aov', isItem) + '</td>';
}

/* 공정 페이스 — 1.00 기준으로 위아래를 색으로 가른다.
   0.8 미만이면 예산이 안 나가는 중, 1.2 초과면 예산선에 먼저 닿을 전망. */
function fairCell(f){
  if (f == null) return '<td class="fair"><span class="na">—</span></td>';
  var c = f < 0.8 ? ' fl' : f > 1.2 ? ' fh' : '';
  var tip = f < 0.8 ? '예산 대비 소진이 밀리는 중' : f > 1.2 ? '이 속도면 예산이 먼저 동남' : '예산대로 소진 중';
  return '<td class="fair' + c + '" title="' + tip + ' (1.00 = 예산대로)">' + f.toFixed(2) + '</td>';
}

function roasCls(r, spend){

/* ── 변경 표식 ──
   값이 최근 바뀐 셀에만 붙는다. 오늘 바뀐 건 알약 배지(▲2 / ▼1), 그 이전은 옅은 삼각형.
   숫자 자체를 누르면 이력 행이 열린다 — 그 전까지는 표식만 보인다. */
function kstStamp(iso){
  var d = new Date(iso);
  var k = new Date(d.getTime() + 9*3600000);
  var p = function(n){ return String(n).padStart(2,'0'); };
  return { date: k.getUTCFullYear()+'-'+p(k.getUTCMonth()+1)+'-'+p(k.getUTCDate()),
           time: p(k.getUTCHours())+':'+p(k.getUTCMinutes()) };
}
function chgMark(list){
  if (!list || !list.length) return '';
  var today = list.filter(function(x){ return kstStamp(x.at).date === D.dateStr; });
  var use = today.length ? today : list;
  var last = use[0];
  var dir = (typeof last.to === 'number' && typeof last.from === 'number')
    ? (last.to > last.from ? 'up' : 'dn') : 'up';
  var arrow = dir === 'up' ? '▲' : '▼';
  return today.length
    ? '<span class="chgd today ' + dir + '">' + arrow + (today.length > 1 ? today.length : '') + '</span>'
    : '<span class="chgd old ' + dir + '">' + arrow + '</span>';
}
// 값 + 표식. 표식이 있을 때만 클릭 가능하게 한다.
// 우측정렬(숫자) 셀은 표식을 값 '앞'에 둔다 — 뒤에 붙이면 표식 폭만큼 숫자가 왼쪽으로
// 밀려 표식 없는 행과 자릿수가 어긋난다. 좌측정렬(캡값 등) 셀만 뒤에 붙인다.
function chgVal(html, list, key, after){
  if (!list || !list.length) return html;
  var v = '<span class="chgv" onclick="toggleChg(event,\'' + key + '\')">' + html + '</span>';
  return after ? (v + chgMark(list)) : (chgMark(list) + v);
}
function fmtCapVal(kind, v){

/* ── 캠페인명 ──
   축약하면 비슷한 이름끼리 구분이 안 돼 비교가 어렵다는 피드백(2026-09-21)에 따라
   표에 풀네임을 그대로 쓴다. 대신 이름 칸을 넓히고 줄바꿈을 허용한다. */
function shortName(name){ return String(name); }
function shortAdset(name){ return String(name); }

/* ── 상태 ── */
var S = {
  acct: '',
  tSpend: Number(localStorage.getItem('bdg_tspend')) || DEFAULT_SPEND,
  tRoas:  Number(localStorage.getItem('bdg_troas'))  || DEFAULT_ROAS,
  sort:   { key: 'spend', dir: -1 , trend: null, watchOpen: false, monthOpen: false},   // 메인 품목 표
  sortDD: { key: 'daily', dir: -1 },   // 드릴다운 — 일예산 내림차순이 기본
  modalItem: null, openCamp: {}, openHist: {}, openChg: {}, stack: [],
  showCmp: localStorage.getItem('bdg_cmp') === '1'
};

function rows(){ return S.acct ? D.campaigns.filter(function(r){ return r.account === S.acct; }) : D.campaigns; }
function agg(list){
  var o = { daily:0, spend:0, purchases:0, val:0, imp:0, clicks:0, n:list.length, room:0, offSpend:0 };
  list.forEach(function(r){ o.daily+=r.daily; o.spend+=r.spend; o.purchases+=r.purchases; o.val+=r.val;
    o.imp+=(r.imp||0); o.clicks+=(r.clicks||0);
    // 남은 예산은 켜진 캠페인별로 센다 — 꺼진 캠페인의 오늘 소진이 켜진 예산을 깎아 보이면 안 된다 (2026-10-20)
    if (r.off) o.offSpend += r.spend; else o.room += Math.max(r.daily - r.spend, 0); });
  o.pace = o.daily ? o.spend/o.daily*100 : 0;
  o.roas = o.spend ? o.val/o.spend*100 : 0;
  return o;
}

/* ── 일중 곡선: 지금 시각의 소진 비중과 마감 환산 계수 ── */
function curveNow(){
  if (!D.curve) return null;
  var p = D.pollTime.split(':'), hh = Number(p[0]), mm = Number(p[1]);
  var B = D.curve.byHour, cur = B[hh];
  if (!cur) return null;
  var prev = hh > 0 && B[hh-1] ? B[hh-1].cumShare : 0;
  var f = mm / 60;
  var share = cur.share != null ? cur.share : (cur.cumShare - prev);
  var rPrev = hh > 0 && B[hh-1] ? B[hh-1].ratio : cur.ratio;
  return { hh: hh, mm: mm, cumShare: Math.max(prev + f * share, 0.001), ratio: rPrev + f * (cur.ratio - rPrev) };
}

// 계정 탭에 맞춘 오늘 시간대별 소진
function hourlyRows(){
  var src = (D.hourly || []).filter(function(r){ return S.acct ? r.account === S.acct : true; });
  var m = {};
  src.forEach(function(r){
    var o = m[r.hour] || (m[r.hour] = { hour:r.hour, spend:0, purchases:0, val:0 });
    o.spend += r.spend; o.purchases += r.purchases; o.val += r.val;
  });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return a.hour - b.hour; });
}

/* ── 마감 추정 두 가지 ──
   둘 다 같은 식이다:  예상 = 현재소진 + k × (남은 곡선비중)
   다른 건 k(= '오늘 하루 총액'의 추정치)를 어느 구간으로 재느냐 뿐.

     평년곡선  k = 오늘 누적소진 ÷ 지금까지의 곡선비중   (아침부터 전부)
     최근속도  k = 최근 완결 N시간 소진 ÷ 그 구간 곡선비중 (최근만)

   장중에 예산·캡을 건드리면 아침 구간이 그 변화를 모르므로 평년곡선 쪽은 한동안
   계속 과소평가한다. 최근속도 쪽은 바뀐 속도를 바로 반영하는 대신 표본이 얇아 출렁인다. */
/* ── 관측 → 확정 환산 ──
   곡선의 ratio 는 확정된 시간대별 값으로 만든 계수다. 실시간 관측 누적에 그대로 곱하면
   아직 안 들어온 전환만큼 과소평가된다. C1 은 클릭 시점에 귀속되므로 방금 지난 시간대일수록
   비어 있다. learn-lag.js 실측(브리핑 20일): 진행 중 ×3.77 / 직전 시간대 ×1.31 / 그 이전 ×1.00.
   → 최근 두 시간만 부풀려 "확정 기준 누적"을 만든 뒤 곡선 계수를 곱한다. */
/* ── 예상 C1 ROAS ──
   곡선 ratio 는 "확정된" 시간대 값으로 만든 계수다. 실시간 관측 누적에 그대로 곱하면
   아직 안 들어온 전환만큼 깎여 과소평가된다.
   learn-lag.js 실측(브리핑 20일): 진행 중 ×3.77 / 직전 시간대 ×1.31 / 2시간 경과부터 ×1.00.
   → C1 은 2시간이면 사실상 다 찬다.

   처음엔 최근 두 시간에 그 배수를 곱해 보정했는데, 배수가 "정시 이후 몇 분 지났는가"에
   민감해 정시 경계에서 값이 크게 튀었다(11:56 284% → 12:03 235%).
   그래서 보정을 버리고 2시간 이상 지난 완전확정 구간만 쓴다. 반응이 조금 늦는 대신
   값이 안 흔들린다. 실측: 07시 239% → 08시 242% → 09시 243% → 10시 250%. */
function settledRoas(cn){
  if (!cn || !D.curve) return null;
  var hrs = hourlyRows();
  if (!hrs.length) return null;
  var end = cn.hh - 2;                                 // 이 시각까지가 완전확정
  if (end < 3 || !D.curve.byHour[end]) return null;    // 새벽엔 표본이 얇아 의미 없음
  var s = 0, v = 0;
  hrs.forEach(function(r){ if (r.hour <= end) { s += r.spend; v += r.val; } });
  if (!s) return null;
  var roas = v / s * 100, ratio = D.curve.byHour[end].ratio;
  return { roas: roas, ratio: ratio, end: end, land: roas * ratio };
}

var RECENT_HOURS = 2;
function projections(A, cn){
  if (!cn) return null;
  var B = D.curve.byHour;
  // 장중에 예산을 줄이거나 끄면 아침 속도로 환산한 값이 남은 예산을 넘는다 — 그 한도로 자른다
  var cap = A.spend + A.room;
  var landCurve = Math.min(A.spend / cn.cumShare, cap);

  // 진행 중인 시간대는 불완전하므로 완결된 시간대만 쓴다.
  var lastDone = cn.hh - 1;
  var hrs = hourlyRows();
  var win = [], shareWin = 0, spendWin = 0;
  for (var h = lastDone; h > lastDone - RECENT_HOURS && h >= 0; h--) {
    if (!B[h]) continue;
    var row = hrs.filter(function(x){ return x.hour === h; })[0];
    win.unshift(h);
    shareWin += B[h].share;
    spendWin += row ? row.spend : 0;
  }
  var reactive = null;
  if (win.length && shareWin > 0.005 && spendWin > 0) {
    var k = spendWin / shareWin;
    reactive = {
      land: Math.min(A.spend + k * Math.max(1 - cn.cumShare, 0), cap),
      hours: win, spendWin: spendWin, shareWin: shareWin,
      // 1 이면 평년 속도, 1.3 이면 평년보다 30% 빠름
      index: k / landCurve,
    };
  }
  return { landCurve: landCurve, reactive: reactive };
}

      (A.offSpend > 0 && !D.isArchive ? '<br>꺼진 캠페인 오늘 소진 ' + won(A.offSpend) + '원 (일예산 밖)' : '') +
      bar(A.daily ? A.spend / A.daily * 100 : 0) +
      lb('소진률 <b>' + pct(A.pace) + '</b>', '목표 ' + man(S.tSpend)),
      prev ? tag('어제 일예산 ' + man(prev.finalSpend ? prev.finalSpend : 0) + ' 소진', 'flat') : ''],

    ['소진', won(A.spend) + '원',
      (D.isArchive ? '그날 최종' :
        '페이스 <b>' + pct(A.pace) + '</b>' + (expect ? ' · 이 시각 평년 ' + expect.toFixed(0) + '%' : '')) +
      bar(spendPct, cls(spendPct)) +
      lb('목표 대비 <b>' + spendPct.toFixed(0) + '%</b>', D.isArchive ? '' : '예상 ' + (landSpend != null ? man(landSpend) : '—')),
      spendCmp ? tag(prevLabel + spendCmp.txt, spendCmp.dir) : ''],

    ['C1 ROAS', pct(A.roas),
      '전환 <b>' + won(A.purchases) + '건</b> · 전환값 ' + won(A.val) + '원' +
      bar(roasPct, cls(roasPct)) +

      : ['예상', landSpend != null ? won(landSpend) + '원' : '—',
          'C1 ROAS <b>' + (landRoas != null ? pct(landRoas) : '—') + '</b> 예상' +
          bar(landPct, cls(landPct)) +

          // 왜 그 값인지 바로 검증되게 계산식을 적어 둔다
          '<div class="basis">데이터 기준 <b>' + D.pollTime + '</b>' +
            (sr ? ' · 확정구간(~' + String(sr.end).padStart(2,'0') + '시) ROAS <b>' + pct(sr.roas) + '</b> × 평년곡선 <b>' + sr.ratio.toFixed(3) + '</b>'
                : (cn ? ' · 현재 ROAS <b>' + pct(A.roas) + '</b> × 평년곡선 <b>' + cn.ratio.toFixed(3) + '</b>' : '')) +
            ' · 소진은 현재 ÷ 이 시각 소진비중 <b>' + (cn ? (cn.cumShare*100).toFixed(1) + '%' : '—') + '</b></div>',
          landRoas != null ? tag(landRoas >= S.tRoas ? '목표 ' + pct(S.tRoas) + ' 상회 전망' : '목표 ' + (landRoas - S.tRoas).toFixed(0) + '%p 전망',
                                 landRoas >= S.tRoas ? 'up' : 'down') : '']
  ];
  document.getElementById('kpi').innerHTML = cards.map(function(c){
    return '<div class="card"><div class="cl">' + c[0] + '</div><div class="cv">' + c[1] + '</div>' +
           '<div class="cs">' + c[2] + '</div>' + (c[3] || '') + '</div>';
  }).join('');
}

function renderProj(A, cn){
  var el = document.getElementById('proj');
  if (D.isArchive){
    // 끝난 날에 '예상'은 의미가 없다 — 그날 결과를 그대로 보여준다.
    function fcell(l,v,sub){ return '<div class="proj-cell"><div class="proj-l">' + l + '</div><div class="proj-v">' + v + '</div><div class="proj-s">' + sub + '</div></div>'; }
    el.innerHTML =
      fcell('최종 소진', won(A.spend) + '원', '일예산 ' + won(A.daily) + '원 · 소진률 ' + pct(A.pace)) +
      fcell('최종 C1 ROAS', pct(A.roas), '목표 ' + pct(S.tRoas) + ' · 차이 ' + (A.roas>=S.tRoas?'+':'') + (A.roas-S.tRoas).toFixed(0) + '%p') +
      fcell('C1 전환', won(A.purchases) + '건', '전환값 ' + won(A.val) + '원') +
      fcell('미소진 예산', won(Math.max(A.daily - A.spend, 0)) + '원', '일예산 대비 ' + pct(A.daily ? (A.daily-A.spend)/A.daily*100 : 0));
    return;
  }
  if (!cn){ el.innerHTML = '<div class="proj-cell"><div class="proj-s">일중 곡선(data/learn/intraday-curve.json)이 없어 예측을 낼 수 없습니다.</div></div>'; return; }
  var P = projections(A, cn);
  var landCurve = P.landCurve, re = P.reactive;
  var sr = settledRoas(cn);
  var landRoas = sr ? sr.land : A.roas * cn.ratio;
  function cell(l,v,s){ return '<div class="proj-cell"><div class="proj-l">' + l + '</div><div class="proj-v">' + v + '</div><div class="proj-s">' + s + '</div></div>'; }
  var hlabel = re ? re.hours.map(function(h){ return String(h).padStart(2,'0') + '시'; }).join('+') : '';
  el.innerHTML =
    cell('예상 소진 · 평년곡선', won(landCurve) + '원',
      '목표 대비 ' + (landCurve>=S.tSpend?'+':'') + won(landCurve-S.tSpend) + ' · 오늘 누적 전체로 환산') +
    cell('예상 소진 · 최근속도', re ? won(re.land) + '원' : '—',
      re ? (hlabel + ' 실제속도 기준 · 평년의 <b>' + (re.index*100).toFixed(0) + '%</b> 속도')
         : '완결된 시간대가 없어 산출 불가') +
    cell('예상 C1 ROAS', pct(landRoas),
      '목표 ' + pct(S.tRoas) + ' · 차이 ' + (landRoas>=S.tRoas?'+':'') + (landRoas-S.tRoas).toFixed(0) + '%p' +
      (sr ? '<br>확정구간(~' + String(sr.end).padStart(2,'0') + '시) ' + pct(sr.roas) + ' × 곡선 ' + sr.ratio.toFixed(3)
          : '<br>확정구간 표본 부족 — 관측값 기준')) +
    // 미소진 예산에는 "앞으로 나갈 돈"과 "그냥 안 쓰고 끝날 돈"이 섞여 있다 — 둘로 쪼개 보여준다.
    cell('미소진 예산', won(A.room) + '원',
      '마감까지 나갈 전망 ' + won(Math.max(landCurve - A.spend, 0)) + '원 · 남길 전망 ' + won(Math.max(A.room - (landCurve - A.spend), 0)) + '원');
}

/* 오늘 바뀐 것 전부 — 예산과 캡을 한 표에 모아 시간순으로 본다.
   캠페인 행 안의 이력과 같은 소스(메타 activities)지만, 여기선 "오늘 뭘 만졌나"를
   한눈에 훑는 용도라 캠페인을 가로지르며 시간순으로 세운다. */
function todayChanges(){
  var out = [], seen = {};
  (S.acct ? D.campaigns.filter(function(c){ return c.account === S.acct; }) : D.campaigns)
    .forEach(function(c){
      [].concat(c.chgBudget || [], c.chgCap || []).forEach(function(x){
        if (kstStamp(x.at).date !== D.dateStr) return;
        // 캠페인 행에는 자식 광고세트 이벤트도 얹혀 있어 같은 건이 두 번 들어올 수 있다
        var k = x.at + x.objectId + x.kind + x.from + x.to;
        if (seen[k]) return; seen[k] = 1;
        out.push({ x: x, camp: c });
      });
    });
  return out.sort(function(a, b){ return b.x.at.localeCompare(a.x.at); });
}

function renderChg(){
  var el = document.getElementById('chg-panel'), cnt = document.getElementById('chg-count');
  var rows = todayChanges();
  cnt.textContent = rows.length + '건';
  cnt.className = 'chgcnt' + (rows.length ? '' : ' zero');
  if (!rows.length){ el.innerHTML = '<div class="muted" style="font-size:14px">오늘 변경된 일예산·캡값이 없습니다.</div>'; return; }

  // 같은 캠페인에서 같은 분에 같은 값으로 바뀐 건은 하나로 묶는다.
  // ABO 7개 세트를 한 번에 조정하면 이벤트가 7건 오는데, 표에는 "×7"로 한 줄이면 충분하다.
  var groups = {}, order = [];
  rows.forEach(function(r){
    var st = kstStamp(r.x.at);
    var k = [st.date, st.time, r.camp.id, r.x.kind, r.x.capKind || '', r.x.from, r.x.to].join('|');
    if (!groups[k]) { groups[k] = { st: st, camp: r.camp, x: r.x, n: 0, targets: [] }; order.push(k); }
    groups[k].n++;
    groups[k].targets.push(r.x.via ? shortAdset(r.x.via) : '캠페인');
  });
  var list = order.map(function(k){ return groups[k]; });

  function fmt(x, v){
    if (typeof v !== 'number') return esc(String(v));
    if (x.kind === 'cap') return x.capKind === 'troas' ? v.toLocaleString('ko-KR') + '%' : won(v) + '원';
    return won(v) + '원';
  }
  function delta(x){
    if (typeof x.from !== 'number' || typeof x.to !== 'number') return '—';
    var d = x.to - x.from, sign = d > 0 ? '+' : '';
    if (x.kind === 'cap' && x.capKind === 'troas') return sign + d.toFixed(0) + '%p';
    return sign + won(d);
  }
  // 대상은 종류만 — 광고세트명까지 넣으면 표가 박스를 넘는다.
  // 어느 세트인지는 캠페인 행에서 펼쳐 보면 된다.
  function targetLabel(g){
    var allCamp = g.targets.every(function(t){ return t === '캠페인'; });
    if (allCamp) return '캠페인';
    return '광고세트' + (g.n > 1 ? ' <b>' + g.n + '</b>' : '');
  }

  function table(title, arr){
    if (!arr.length) return '';
    return '<div class="chg-grp">' + title + ' · ' + arr.reduce(function(s,g){ return s+g.n; },0) + '건' +
        (arr.length !== arr.reduce(function(s,g){ return s+g.n; },0) ? ' <span class="muted" style="font-weight:600">(' + arr.length + '회 조작)</span>' : '') + '</div>' +
      '<table class="chgtbl"><colgroup><col style="width:7%"><col style="width:9%"><col style="width:38%">' +
      '<col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%"></colgroup>' +
      '<thead><tr><th class="left">시각</th><th class="left">품목</th><th class="left">캠페인</th>' +
      '<th class="left">대상</th><th>이전</th><th>이후</th><th>변화</th><th class="left">변경자</th></tr></thead><tbody>' +
      arr.map(function(g){
        var x = g.x, num = typeof x.from === 'number' && typeof x.to === 'number';
        return '<tr><td class="left"><b>' + g.st.time + '</b></td>' +
          '<td class="left">' + esc(g.camp.item) + '</td>' +
          '<td class="left nmcell"><span class="nm" title="' + esc(g.camp.name) + '">' + esc(shortName(g.camp.name, g.camp.item)) + '</span>' +
            '<button class="iconbtn" title="캠페인명 전체 복사" onclick="copyName(event,\'' + g.camp.id + '\')">📋</button></td>' +
          '<td class="left muted">' + targetLabel(g) + '</td>' +
          '<td>' + fmt(x, x.from) + '</td><td><b>' + fmt(x, x.to) + '</b></td>' +
          '<td class="' + (num ? (x.to > x.from ? 'p-hi' : 'p-lo') : '') + '">' + delta(x) + '</td>' +
          '<td class="left muted" style="font-size:13px">' + esc(x.actor || '—') +
          (x.detected ? ' <span class="det" title="메타 변경 로그가 누락해 구조 비교로 찾아낸 건 — 시각은 감지 시점입니다">감지</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  var bud = list.filter(function(g){ return g.x.kind === 'budget'; });
  var cap = list.filter(function(g){ return g.x.kind === 'cap'; });
  var net = rows.filter(function(r){ return r.x.kind === 'budget' && r.x.scope === 'campaign'; })
                .reduce(function(s, r){ return s + (r.x.to - r.x.from); }, 0);

  el.innerHTML =
    '<div class="muted" style="font-size:13px;margin-bottom:10px">캠페인 일예산 순증 ' +
      '<b style="color:' + (net >= 0 ? '#31508f' : '#96612a') + '">' + (net >= 0 ? '+' : '') + won(net) + '원</b>' +
      ' · 같은 시각에 여러 광고세트를 한꺼번에 바꾼 건은 한 줄로 묶었습니다</div>' +
    table('일예산', bud) + table('입찰 캡값', cap);
}

/* 시간대별 실제 소진 vs 평년 기대 — 개입 효과가 어느 시각부터 붙는지 눈으로 보려고 둔다.
   평년 비교 두 열(기대 소진·속도 지수)은 평소엔 군더더기라 접을 수 있게 해둔다. */
function renderHourly(A, cn){
  var el = document.getElementById('hourly');
  if (!cn || !D.curve){ el.innerHTML = ''; return; }
  var B = D.curve.byHour, hrs = hourlyRows();
  if (!hrs.length){ el.innerHTML = ''; return; }
  var landCurve = A.spend / cn.cumShare;
  var showCmp = S.showCmp;
  var cum = 0, cumVal = 0;

  el.innerHTML =
    '<div class="sub-title" style="display:flex;align-items:center;gap:8px">시간대별 소진' +
      '<button class="colbtn" onclick="toggleCmp()">' + (showCmp ? '평년 비교 숨기기' : '평년 비교 보기') + '</button></div>' +
    '<table><thead><tr><th class="left">시각</th><th>소진</th><th>누적 소진</th>' +
      (showCmp ? '<th>평년 기대 소진</th><th>속도 지수</th>' : '') +
      '<th>구간 C1 ROAS</th><th>누적 C1 ROAS</th></tr></thead><tbody>' +
    hrs.map(function(r){
      cum += r.spend; cumVal += r.val;
      var share = B[r.hour] ? B[r.hour].share : null;
      // 진행 중인 시간대는 분 비율만큼만 기대치를 잡아야 공정하다
      var partial = r.hour === cn.hh ? cn.mm/60 : 1;
      var expect = share != null ? landCurve * share * partial : null;
      var idx = expect ? r.spend / expect * 100 : null;
      var roas = r.spend ? r.val/r.spend*100 : 0;
      var cumRoas = cum ? cumVal/cum*100 : 0;
      return '<tr' + (r.hour === cn.hh ? ' style="font-weight:700"' : '') + '>' +
        '<td class="left">' + String(r.hour).padStart(2,'0') + '시' + (r.hour === cn.hh ? ' <span class="muted" style="font-weight:600">진행중</span>' : '') + '</td>' +
        '<td>' + won(r.spend) + '</td><td class="muted">' + won(cum) + '</td>' +
        (showCmp
          ? '<td class="muted">' + (expect != null ? won(expect) : '—') + '</td>' +
            '<td class="' + (idx == null ? '' : idx < 80 ? 'p-lo' : idx > 120 ? 'p-hi' : '') + '">' + (idx != null ? pct(idx) : '—') + '</td>'
          : '') +
        '<td class="roas ' + roasCls(roas, r.spend) + '">' + (r.spend ? pct(roas) : '<span class="na">—</span>') + '</td>' +
        '<td class="roas ' + roasCls(cumRoas, cum) + '">' + (cum ? pct(cumRoas) : '<span class="na">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function renderCkpt(){

    hs.map(function(h){

/* 정렬 표시 아이콘 위치.
   숫자 컬럼은 우측정렬이라 아이콘을 라벨 뒤에 두면 라벨이 왼쪽으로 밀려 아래 숫자와 어긋난다.
   그래서 우측정렬 컬럼은 아이콘을 라벨 '앞'에 붙여 라벨의 오른쪽 끝을 숫자와 맞춘다. */
function sortHead(c, st){
  var ic = '<span class="sort-ic">' + (st.key === c.k ? (st.dir < 0 ? '▼' : '▲') : '◆') + '</span>';
  return c.left ? (c.h + ic) : (ic + c.h);
}

/* ── 메인 3단 드릴다운 ── */
// 캠페인명 앞머리의 두 자리 코드(01_통살, 07_크리스피 …)를 품목 코드로 쓴다.
// 같은 품목이면 대개 코드가 같고, 섞여 있으면 가장 많은 쪽을 택한다.
function itemCode(it){
  var cnt = {};
  it.camps.forEach(function(c){
    var m = String(c.name).match(/^(\d{2})/);
    if (m) cnt[m[1]] = (cnt[m[1]] || 0) + 1;
  });
  var best = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; })[0];
  return best ? '<span class="icode">' + best + '</span>' : '';
}
// 품목 옆 상품코드 (사용자 요청 2026-10-21) — 캠페인명의 "(3108)"·"(3112+2525)"·"_3341_" 에서 뽑아 많이 쓰인 순
function prodCodes(it){
  var cnt = {};
  it.camps.forEach(function(c){
    var nm = String(c.name), m, re = /\((\d{4}(?:\+\d{4})*)\)|_(\d{4})_/g;
    while ((m = re.exec(nm))) (m[1] || m[2]).split('+').forEach(function(k){ if (k >= '2000') cnt[k] = (cnt[k] || 0) + 1; });   // (1010) 같은 날짜 표기 제외
  });
  var ks = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a] || a.localeCompare(b); });
  return ks.length ? '<span class="pcode">' + ks.join('·') + '</span>' : '';
}

/* ── 메인 표 ──
   품목·캠페인·광고세트를 하나의 <table> 에 담는다.
   예전에는 품목 표 안의 colspan 칸에 캠페인 표를 따로 넣었는데, 표가 둘이라 컬럼이
   서로 다른 자리에 떨어져 "합계와 항목이 안 맞는" 것처럼 보였다(2026-09-21 피드백).
   같은 colgroup 을 공유하면 어느 깊이든 같은 세로선 위에 놓인다. */
var COLS = [
  { k:'name',      h:'캠페인',     left:true,  w:'16%' },
  { k:'mode',      h:'체계',       left:true,  w:'4%' },
  { k:'attr',      h:'기여',       left:true,  w:'3.5%' },
  { k:'strategy',  h:'입찰 · 캡값', left:true,  w:'7%' },
  { k:'daily',     h:'일예산',                 w:'7%'  },
  { k:'spend',     h:'소진',                   w:'5.5%' },
  { k:'remain',    h:'잔여',                   w:'5.5%' },
  { k:'pace',      h:'페이스',                 w:'5.5%'  },
  { k:'imp',       h:'노출수',     fnl:true,   w:'5.5%'  },
  { k:'clicks',    h:'클릭수',     fnl:true,   w:'4.5%'  },
  { k:'ctr',       h:'CTR',        fnl:true,   w:'5%'  },
  { k:'purchases', h:'전환수',                 w:'4%' },
  { k:'cvr',       h:'CVR',        fnl:true,   w:'4.5%' },
  { k:'val',       h:'전환값',                 w:'6%'  },
  { k:'aov',       h:'AOV',        fnl:true,   w:'5.5%'  },
  { k:'roas',      h:'ROAS',                   w:'4.5%'  },
  { k:'cpa',       h:'CPA',                    w:'6.5%'  }
];
var NCOL = COLS.length;

// 일예산·소진은 이 보드에서 가장 자주 읽는 두 값이라 따로 표시한다
var KEYCOL = { daily:'key k1', spend:'key k2', remain:'rem' };

/* 메인 표는 품목 롤업만 보여준다 — 체계·기여·캡값은 캠페인 단위 속성이라
   품목 줄에선 늘 비어 있었다. 빼고 그만큼 숫자 칸을 넉넉히 쓴다. */
/* 품목 표는 두 박스로 나눈다.
   왼쪽 = 돈(예산·소진·잔여·페이스·전환수·전환값·ROAS·예상), 오른쪽 = 퍼널(노출·클릭·CTR·CVR·AOV).
   성격이 다른 지표를 한 표에 늘어놓으니 구분이 안 된다는 피드백(2026-09-30).
   두 표는 같은 순서로 그리고 행 높이를 고정해 좌우가 같은 줄에 오게 한다. */
var ITEM_COLS = [
  { k:'item',      h:'품목',   left:true, w:'17%', w0:'20%' },
  { k:'daily',     h:'일예산',            w:'9.5%', w0:'12%' },
  { k:'spend',     h:'소진',              w:'11%', w0:'13%' },
  { k:'remain',    h:'잔여',              w:'8.5%', w0:'9.5%' },
  { k:'pace',      h:'페이스',            w:'6.5%', w0:'7%'  },
  { k:'purchases', h:'전환수',            w:'5%',  w0:'7%' },
  { k:'val',       h:'전환값',            w:'10.5%', w0:'12.5%' },
  { k:'roas',      h:'ROAS',              w:'7%',  w0:'8.5%' },
  { k:'cpa',       h:'CPA',               w:'7%',  w0:'10%' }
];

// 오른쪽 박스 — 퍼널
var FNL_COLS = [
  { k:'item',   h:'품목',   left:true, w:'30%' },
  { k:'imp',    h:'노출수', fnl:true,  w:'17%' },
  { k:'clicks', h:'클릭수', fnl:true,  w:'12%' },
  { k:'ctr',    h:'CTR',    fnl:true,  w:'14%' },
  { k:'cvr',    h:'CVR',    fnl:true,  w:'12%' },
  { k:'aov',    h:'AOV',    fnl:true,  w:'15%' }
];

/* 품목별 예상 두 칸. 끝난 날엔 '예상'이 의미 없으므로 빼고,
   그만큼 나머지 칸이 원래 폭(w0)으로 돌아간다. */
var LAND_COLS = [
  { k:'landSpend', h:'예상 광고비', est:true, w:'11.5%',
    tip:'지금 소진 ÷ 이 시각 평년 누적 소진비중. 품목 합계는 상단 예상 소진과 일치한다.' },
  { k:'landRoas',  h:'예상 ROAS',   est:true, w:'8%',
    tip:'품목별 시간대 데이터는 저장하지 않아 품목마다 감쇠를 따로 잴 수 없다. 전체가 지금→마감에 걸친 감쇠율을 품목에도 동일하게 적용한 값이다.' }
];

function itemCols(){
  if (D.isArchive || !D.curve)
    return ITEM_COLS.map(function(c){
      var o = {}; for (var k in c) o[k] = c[k];
      o.w = c.w0; return o;
    });
  return ITEM_COLS.concat(LAND_COLS);
}

/* 예상 광고비 — 추정값이라 흐리게 쓴다. 일예산을 넘길 전망이면 표식을 붙인다:
   메타는 예산선에서 멈추므로 "넘긴다"가 아니라 "예산이 꽉 찬다"는 신호다. */
function landSpendCell(it){
  if (it.landSpend == null) return '<span class="na">—</span>';
  var over = it.daily && it.landSpend > it.daily;
  // 뱃지를 숫자 뒤에 두면 그 줄만 숫자가 왼쪽으로 밀려 우측정렬이 깨진다 → 앞에 붙인다
  return '<span class="estv"' + (over ? ' title="이 속도면 예상 광고비가 이 품목 일예산을 넘는다 — 실제로는 예산선에서 멈추므로 여기까지 못 간다"' : '') + '>' +
    (over ? '<span class="estcap">초과</span>' : '') + won(it.landSpend) + '</span>';
}

// 현재 ROAS pill 과 구분되게 테두리만 있는 변형을 쓴다 — 확정값과 예상값이 같아 보이면 안 된다
function landRoasCell(v, spend){
  if (v == null || !spend) return '<span class="pill pill-na">—</span>';
  return '<span class="pill pill-est' + (v >= S.tRoas ? ' pill-est-hi' : '') +
    (v >= 1000 ? ' pill-tight' : '') + '">' + pct(v) + '</span>';
}

function renderMain(list, cn){
  var expect = cn ? cn.cumShare*100 : 0;

  var byItem = {};
  list.forEach(function(r){
    var o = byItem[r.item] || (byItem[r.item] = { item:r.item, daily:0, spend:0, purchases:0, val:0, imp:0, clicks:0, camps:[] });
    o.daily+=r.daily; o.spend+=r.spend; o.purchases+=r.purchases; o.val+=r.val;
    o.imp+=(r.imp||0); o.clicks+=(r.clicks||0); o.camps.push(r);
  });
  var T = agg(list);
  (function(){ var ex = 0, ok = false;
    list.forEach(function(c){ if (c.fairExp != null) { ex += c.fairExp; ok = true; } });
    T.fair = ok && ex > 0 ? T.spend / ex : null; })();

  /* 품목별 예상 — 상단 카드와 같은 근거를 쓴다.
     광고비: 품목 소진 ÷ 지금까지의 곡선 비중. 분모가 같으니 품목 합 = 전체 예상 소진.
     ROAS  : k = 전체 예상 ROAS ÷ 전체 현재 ROAS 를 품목에 똑같이 곱한다.
             이렇게 두면 품목 예상의 소진가중 평균이 상단 카드 값과 정확히 맞는다. */
  var land = null;
  if (cn && !D.isArchive && D.curve) {
    var srI = settledRoas(cn);
    var lrT = srI ? srI.land : T.roas * cn.ratio;
    land = { cum: cn.cumShare, k: T.roas ? lrT / T.roas : cn.ratio, total: lrT };
  }

  var items = Object.keys(byItem).map(function(k){
    var o = byItem[k];
    o.pace = o.daily ? o.spend/o.daily*100 : 0;
    o.roas = o.spend ? o.val/o.spend*100 : 0;
    o.landSpend = land ? o.spend / land.cum : null;
    o.landRoas  = land && o.spend ? o.roas * land.k : null;
    return o;
  });
  sortRows(items, S.sort);

  // 정렬 키가 양쪽에 걸쳐 있으므로 한 번 정렬한 순서를 두 표가 그대로 쓴다
  items.forEach(function(o){
    o.ctr = o.imp ? o.clicks/o.imp*100 : null;
    o.cvr = o.clicks ? o.purchases/o.clicks*100 : null;
    o.aov = o.purchases ? o.val/o.purchases : null;
    o.cpa = o.purchases ? o.spend/o.purchases : null;
    // 품목 공정페이스 = 소속 캠페인 기대소진 합으로 나눈다 (평균의 평균이 아니라 합쳐서 나눠야 맞다)
    var ex = 0, ok = false;
    o.camps.forEach(function(c){ if (c.fairExp != null) { ex += c.fairExp; ok = true; } });
    o.fair = ok && ex > 0 ? o.spend / ex : null;
  });

  var CS = itemCols();
  function head(cols){
    return '<colgroup>' + cols.map(function(c){ return '<col style="width:' + c.w + '">'; }).join('') +
      '</colgroup><thead><tr>' + cols.map(function(c){
        var key = c.k === 'item' ? 'name' : c.k;
        return '<th class="sortable' + (c.left?' left':'') + (c.est?' est':'') + (c.fnl?' fnl':'') +
          (c.k==='landSpend'?' estfirst':'') + (KEYCOL[key]?' ' + KEYCOL[key]:'') +
          (S.sort.key===key?' sort-active':'') + '"' + (c.tip ? ' title="' + esc(c.tip) + '"' : '') +
          ' onclick="setSort(\'' + key + '\')">' + sortHead({ k:key, h:c.h, left:c.left }, S.sort) + '</th>';
      }).join('') + '</tr></thead>';
  }
  function nameCell(it){
    return '<td class="left tog itemname" onclick="openItem(\'' + esc(it.item) + '\')">' +
      '<span class="arrow">▸</span> ' + itemCode(it) + esc(it.item) + prodCodes(it) +
      ' <span class="cnt">' + it.camps.length + '개</span></td>';
  }
  var acctLabel = S.acct ? D.accounts.filter(function(a){ return a.id===S.acct; })[0].label : '전체';

  // ── 왼쪽: 예산 · 소진 · 결과
  var L = '<table class="grid itemgrid">' + head(CS) + '<tbody>';
  items.forEach(function(it, i){
    L += '<tr class="lv1 item-row" data-i="' + i + '">' + nameCell(it) +
      '<td class="key k1">' + won(it.daily) + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(it.spend) + '</td>' +
      '<td class="rem">' + remainCell(it.daily, it.spend) + '</td>' +
      '<td class="pace ' + paceCls(it.pace, expect) + slowCls(it.pace, expect) + '"' + slowTitle(it.pace, expect) + '>' + paceVal(it.pace, expect) + '</td>' +
      '<td>' + won(it.purchases) + '</td><td>' + won(it.val) + '</td>' +
      '<td class="roas">' + roasPill(it.roas, it.spend) + '</td>' +
      '<td>' + (it.purchases ? won(it.spend / it.purchases) : '<span class="na">—</span>') + '</td>' +
      (land ? '<td class="est estfirst">' + landSpendCell(it) + '</td>' +
              '<td class="est roas">' + landRoasCell(it.landRoas, it.spend) + '</td>' : '') + '</tr>';
  });
  L += '</tbody><tfoot><tr><td class="left">' + acctLabel + '</td>' +
    '<td class="key k1">' + won(T.daily) + '</td>' +
    '<td class="key k2"><span class="arw">→</span>' + won(T.spend) + '</td>' +
    '<td class="rem">' + remainCell(T.daily, T.spend) + '</td><td>' + pct(T.pace) + '</td>' +
    '<td>' + won(T.purchases) + '</td><td>' + won(T.val) + '</td>' +
    '<td class="roas">' + roasPill(T.roas, T.spend) + '</td>' +
    '<td>' + (T.purchases ? won(T.spend / T.purchases) : '<span class="na">—</span>') + '</td>' +
    (land ? '<td class="est estfirst">' + landSpendCell({ landSpend: T.spend / land.cum, daily: T.daily }) + '</td>' +
            '<td class="est roas">' + landRoasCell(land.total, T.spend) + '</td>' : '') +
    '</tr></tfoot></table>';

  // ── 오른쪽: 퍼널
  var R = '<table class="grid itemgrid fnlgrid">' + head(FNL_COLS) + '<tbody>';
  items.forEach(function(it, i){
    R += '<tr class="lv1 item-row" data-i="' + i + '">' + nameCell(it) +
      '<td class="fnl">' + won(it.imp) + '</td><td class="fnl">' + won(it.clicks) + '</td>' +
      fnlTrio(it, it.item, true) + '</tr>';
  });
  R += '</tbody><tfoot><tr><td class="left">' + acctLabel + '</td>' +
    '<td class="fnl">' + won(T.imp) + '</td><td class="fnl">' + won(T.clicks) + '</td>' +
    fnlTrio({ imp:T.imp, clicks:T.clicks, purchases:T.purchases, val:T.val }, null, true) +
    '</tr></tfoot></table>';

  document.getElementById('main-tbl').innerHTML =
    '<div class="split">' +
      '<div class="pbox"><div class="pbt pbt-money">예산 · 소진 · 결과</div>' + L + '</div>' +
      '<div class="pbox"><div class="pbt pbt-fnl">노출 · 클릭 · 효율</div>' + R + '</div>' +
    '</div>';
  syncRowHover();
}

/* 좌우는 물리적으로 다른 표라 한쪽에 마우스를 올려도 반대쪽이 안 밝아진다.
   같은 줄임을 눈으로 확인할 수 있게 data-i 로 짝을 맞춰 같이 칠한다. */
function syncRowHover(){
  var rows = document.querySelectorAll('#main-tbl tr.item-row');
  Array.prototype.forEach.call(rows, function(tr){
    tr.addEventListener('mouseenter', function(){
      var m = document.querySelectorAll('#main-tbl tr.item-row[data-i="' + tr.getAttribute('data-i') + '"]');
      Array.prototype.forEach.call(m, function(x){ x.classList.add('rowhi'); });
    });
    tr.addEventListener('mouseleave', function(){
      var m = document.querySelectorAll('#main-tbl tr.rowhi');
      Array.prototype.forEach.call(m, function(x){ x.classList.remove('rowhi'); });
    });
  });
}

function campRows(camps, expect){
  var rows = camps.map(function(r){
    var o = {}; for (var k in r) o[k] = r[k];
    o.pace = r.daily ? r.spend/r.daily*100 : 0;
    o.roas = r.spend ? r.val/r.spend*100 : 0;
    return o;
  });
  sortRows(rows, S.sortDD);

  var h = '';
  rows.forEach(function(r){
    var open = !!S.openCamp[r.id];
    h += '<tr class="lv2 camp-row' + (open?' open':'') + '">' +
      '<td class="left nmcell tog" onclick="toggleCamp(\'' + r.id + '\')">' +
        '<span class="nmwrap"><span class="arrow">▸</span><span class="nm" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
        '<button class="iconbtn" title="캠페인명 전체 복사" onclick="copyName(event,\'' + r.id + '\')">📋</button>' +
        '<button class="iconbtn" title="기준선 — 최근 3일 + 동요일" onclick="toggleHist(event,\'' + r.id + '\')">📊</button></span></td>' +
      '<td class="left">' + modeChip(r) + '</td>' +
      '<td class="left">' + attrCell(r.attr) + '</td>' +
      '<td class="left">' + chgVal(bidCell(r.strategy, r.capText), r.chgCap, 'c:' + r.id, true) + '</td>' +
      '<td class="key k1">' + (r.daily ? chgVal(won(r.daily), r.chgBudget, 'b:' + r.id) : '<span class="na">—</span>') + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(r.spend) + '</td><td class="rem">' + remainCell(r.daily, r.spend) + '</td>' +
      '<td class="pace ' + paceCls(r.pace, expect) + slowCls(r.pace, expect) + '"' + slowTitle(r.pace, expect) + '>' + paceVal(r.pace, expect) + '</td>' +
      funnelCells(r, r.id, false) +
      '<td class="roas">' + roasPill(r.roas, r.spend) + '</td>' +
      '<td>' + (r.purchases ? won(r.spend / r.purchases) : '<span class="na">—</span>') + '</td></tr>';

    if (S.openChg['b:' + r.id]) h += subRow(chgTable('일예산 변경 이력', r.chgBudget));
    if (S.openChg['c:' + r.id]) h += subRow(chgTable('입찰 캡값 변경 이력', r.chgCap));
    if (S.openHist[r.id])       h += subRow(histTable(r));
    if (open)                   h += adsetRows(r);
  });
  return h;
}

function subRow(inner){
  return '<tr class="sub-row"><td colspan="' + NCOL + '">' + inner + '</td></tr>';
}

// 광고세트도 같은 컬럼 위에 올린다 — 캠페인 행과 세로선이 맞아야 비교가 된다
function adsetRows(r){
  if (!r.adsets || !r.adsets.length)
    return '<tr class="lv3"><td class="left nmcell" colspan="' + NCOL + '"><span class="muted">광고세트 없음</span></td></tr>';
  var budgeted = r.mode === 'ABO';
  var h = '';
  r.adsets.forEach(function(a){
    var roas = a.spend ? a.val/a.spend*100 : 0;
    var share = r.spend ? a.spend/r.spend*100 : 0;
    h += '<tr class="lv3' + '">' +
      '<td class="left nmcell"><span class="nmwrap"><span class="nm" title="' + esc(a.name) + '">' + esc(a.name) + '</span></span></td>' +
      '<td></td>' +
      '<td class="left">' + attrCell(a.attr) + '</td>' +
      '<td class="left">' + chgVal(bidCell(a.strategy, a.capText), a.chgCap, 'c:' + a.id, true) + '</td>' +
      '<td class="key k1">' + (budgeted && a.daily ? chgVal(won(a.daily), a.chgBudget, 'b:' + a.id)
                 : '<span class="na" title="' + (budgeted ? '' : 'CBO — 캠페인 예산을 메타가 배분') + '">—</span>') + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(a.spend) + '</td><td class="rem">' + (budgeted ? remainCell(a.daily, a.spend) : '<span class="na">—</span>') + '</td>' +
      '<td class="muted">' + (budgeted && a.daily ? pct(a.spend/a.daily*100) : pct(share) + ' 배분') + '</td>' +
      funnelCells(a, a.id, false) +
      '<td class="roas">' + roasPill(roas, a.spend) + '</td>' +
      '<td>' + (a.purchases ? won(a.spend / a.purchases) : '<span class="na">—</span>') + '</td></tr>';
    if (S.openChg['b:' + a.id]) h += subRow(chgTable('광고세트 일예산 변경 이력', a.chgBudget));
    if (S.openChg['c:' + a.id]) h += subRow(chgTable('광고세트 캡값 변경 이력', a.chgCap));
  });
  return h;
}

function histTable(r){
  if (!r.history || !r.history.length)
    return '<div class="sub-wrap"><div class="sub-title">기준선 — 최근 3일 + 동요일</div>' +
      '<table><tbody><tr><td class="left muted" style="padding:10px 12px">해당 기간 데이터 없음 (최근 생성된 캠페인)</td></tr></tbody></table></div>';
  /* 오늘 표와 같은 퍼널 순서로 맞춘다 — 위아래를 눈으로 바로 비교할 수 있어야 한다.
     오늘 행(맨 위)을 같이 얹어 '기준선 대비 오늘'을 한 표에서 읽게 했다. */
  var tdy = { spend:r.spend, imp:r.imp, clicks:r.clicks, purchases:r.purchases, val:r.val,
              roas: r.spend ? r.val/r.spend*100 : 0 };
  function line(x, isToday){
    var ctr = x.imp ? x.clicks/x.imp*100 : null, cvr = x.clicks ? x.purchases/x.clicks*100 : null,
        aov = x.purchases ? x.val/x.purchases : null;
    return '<tr' + (isToday ? ' class="hist-today"' : '') + '><td class="left"><b>' + (isToday ? '오늘' : x.tag) + '</b> ' +
      (isToday ? '<span class="muted">' + D.dateStr.slice(5) + ' ' + D.pollTime + ' 기준</span>'
               : '<span class="muted">' + x.date.slice(5) + ' </span><span class="dow' + (x.dow === '토' ? ' dow-sat' : x.dow === '일' ? ' dow-sun' : '') + '">(' + x.dow + ')</span>') + '</td>' +
      '<td>' + won(x.spend) + '</td>' +
      '<td>' + won(x.imp) + '</td><td>' + won(x.clicks) + '</td>' +
      '<td>' + (ctr == null ? '<span class="na">—</span>' : ctr.toFixed(2) + '%') + '</td>' +
      '<td>' + won(x.purchases) + '</td>' +
      '<td>' + (cvr == null ? '<span class="na">—</span>' : cvr.toFixed(1) + '%') + '</td>' +
      '<td>' + won(x.val) + '</td>' +
      '<td>' + (aov == null ? '<span class="na">—</span>' : won(aov)) + '</td>' +
      '<td class="roas ' + roasCls(x.roas, x.spend) + '">' + (x.spend ? pct(x.roas) : '<span class="na">—</span>') + '</td>' +
      '<td>' + (x.purchases ? won(x.spend / x.purchases) : '<span class="na">—</span>') + '</td></tr>';
  }
  return '<div class="sub-wrap"><div class="sub-title">기준선 — 최근 3일 + 동요일 (완결일 기준, C1)</div>' +
    '<table class="histtbl"><colgroup><col style="width:15%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:7.5%">' +
    '<col style="width:7.5%"><col style="width:7.5%"><col style="width:7.5%"><col style="width:10%"><col style="width:9%">' +
    '<col style="width:8%"><col style="width:9%"></colgroup>' +
    '<thead><tr><th class="left">날짜</th><th>광고비</th><th>노출수</th><th>클릭수</th><th>CTR</th>' +
    '<th>C1 전환수</th><th>CVR</th><th>C1 매출</th><th>AOV</th><th>C1 ROAS</th><th>CPA</th></tr></thead><tbody>' +
    line(tdy, true) +
    r.history.map(function(x){ return line(x, false); }).join('') + '</tbody></table></div>';
}



/* ── 오늘 볼 것 ──
   매일 손으로 훑던 판단(증액할 것 / 묶인 것 / 꺾인 것)을 규칙으로 뽑는다.
   10분마다 보드가 다시 그려질 때 같이 다시 계산되므로 항상 지금 기준이다.
   규칙은 전부 화면에 보이는 값만 쓴다 — 왜 떴는지 사용자가 검증할 수 있어야 한다. */
function watchList(list, cn){
  if (D.isArchive || !cn) return [];
  var A = agg(list), avg = A.spend ? A.val/A.spend*100 : 0;
  var rest = D.restShare != null ? D.restShare : 0;
  var out = [];
  list.forEach(function(c){
    if (!c.daily || c.daily < 200000) return;
    var roas = c.spend ? c.val/c.spend*100 : 0;
    var f = c.fair;
    if (f == null) return;
    var land = c.spend + f * c.daily * rest;

    // ① 증액 — 예산을 다 쓰고도 남을 속도 + 효율이 평균 위
    if (f >= 1.15 && roas >= avg && c.spend > 50000)
      out.push({ t:'up', score: (roas/avg) * f, camp:c,
        why: '공정페이스 ' + f.toFixed(2) + ' · ROAS ' + roas.toFixed(0) + '% (전체 ' + avg.toFixed(0) + '%)',
        act: '이 속도면 예산 ' + won(c.daily) + '원이 먼저 동납니다' });

    /* ② 감액 — 예산이 남아돌 전망.
       단, 기구매자 타겟 TCPA 는 모수가 한정적이라 일부러 작게 두는 캠페인이다(2026-09-29 확인).
       소진이 덜 되는 게 정상이므로 제안 대상에서 뺀다. */
    var repTcpa = /기구매자|기구매/.test(c.name) &&
      (/TCPA/i.test(c.name) || (c.adsets||[]).some(function(a){ return /원$/.test(a.capText||''); }));
    var idle = Math.max(c.daily - land, 0);
    if (!repTcpa && f < 0.7 && idle >= 300000)
      out.push({ t:'down', score: idle, camp:c,
        why: '공정페이스 ' + f.toFixed(2) + ' · ROAS ' + roas.toFixed(0) + '%',
        act: '오늘 안 나갈 전망 ' + won(idle) + '원' });

    // ③ 점검 — 퍼널이 꺾였는데 돈은 빠르게 나감
    if (c.spend >= 100000 && f >= 1.0) {
      var m = { imp:c.imp||0, clicks:c.clicks||0, purchases:c.purchases, val:c.val };
      var hits = [];
      [['ctr',ctrOf,'CTR'],['cvr',cvrOf,'CVR'],['aov',aovOf,'AOV']].forEach(function(x){
        var t = trendOf(c.id, false, x[1], x[1](m));
        if (t === 'd3') hits.push(x[2] + ' 3일 연속 하락');
        else if (t === 'd1' && roas < avg) hits.push(x[2] + ' 하락');
      });
      if (hits.length)
        out.push({ t:'warn', score: (avg - roas) + hits.length * 40, camp:c,
          why: hits.join(' · '), act: 'ROAS ' + roas.toFixed(0) + '% · 공정페이스 ' + f.toFixed(2) + '로 소진은 빠름' });
    }
  });
  // 같은 캠페인이 여러 갈래로 잡히면 가장 센 것만. 점검 > 증액 > 감액 순으로 우선.
  var rank = { warn:0, up:1, down:2 };
  var seen = {}, keep = [];
  out.sort(function(a,b){ return rank[a.t] - rank[b.t] || b.score - a.score; }).forEach(function(x){
    if (seen[x.camp.id]) return; seen[x.camp.id] = 1; keep.push(x);
  });
  /* 갈래마다 점수 단위가 달라(감액은 '원', 증액은 배수) 한 줄로 세우면 감액만 남는다.
     갈래별로 상위 2개씩 뽑아 균형을 맞춘다. */
  var res = [];
  ['warn','up','down'].forEach(function(t){
    keep.filter(function(x){ return x.t === t; })
      .sort(function(a,b){ return b.score - a.score; }).slice(0, 2)
      .forEach(function(x){ res.push(x); });
  });
  return res;
}

var WT = { up:{ i:'↑', l:'증액 검토' }, down:{ i:'↓', l:'감액 검토' }, warn:{ i:'!', l:'점검' } };

/* ── 상품 판매 현황 ──
   메타가 주장하는 매출(C1)과 Cafe24 에 실제로 찍힌 매출을 품목별로 나란히 둔다.
     전환값        메타 C1 (1일 클릭 기여)
     UTM 전환값     Cafe24 facebook 유입으로 찍힌 그 품목 상품들의 매출
     상품 전체 전환값 채널 무관 그 상품들의 총 판매금액
   품목 ↔ 상품코드는 소재명의 prod_NNNN 으로 잇는다(data/product-map.json).
   Cafe24 는 하루가 끝나야 값이 굳으므로 지난 날짜 페이지에만 뜬다. */

/* ── 당월 누적 ──
   오늘 페이스 옆에 "이번 달이 어디로 가고 있나"를 같이 둔다.
   눌러서 펼치면 품목별로 쪼개진다. */
function renderMonth(){
  var el = document.getElementById('mbox');
  if (!el) return;
  if (!D.month || !D.month.items) { el.style.display = 'none'; return; }
  el.style.display = '';
  var M = D.month, it = M.items;
  var T = Object.keys(it).reduce(function(a,k){
    a.spend += it[k].spend; a.val += it[k].val; a.purchases += it[k].purchases; return a;
  }, { spend:0, val:0, purchases:0 });
  var roas = T.spend ? T.val/T.spend*100 : 0;
  var mm = Number(M.until.slice(5,7));
  var avg = M.days ? T.spend / M.days : 0;

  var rows = Object.keys(it).map(function(k){
    var o = it[k];
    return { item:k, spend:o.spend, val:o.val, purchases:o.purchases,
             roas: o.spend ? o.val/o.spend*100 : 0,
             cpa: o.purchases ? o.spend/o.purchases : null };
  }).filter(function(r){ return r.spend > 0; }).sort(function(a,b){ return b.spend - a.spend; });

  el.innerHTML = '<details id="m-d"' + (S.monthOpen ? ' open' : '') + ' ontoggle="S.monthOpen=this.open">' +
    '<summary class="m-sum">' +
      '<span class="m-mm">' + mm + '월</span>' +
      '<span class="m-kv"><i>광고비</i><b>' + man(T.spend) + '</b></span>' +
      '<span class="m-kv"><i>C1 전환값</i><b>' + man(T.val) + '</b></span>' +
      '<span class="m-kv"><i>C1 ROAS</i><b class="' + (roas >= S.tRoas ? 'm-hi' : '') + '">' + pct(roas) + '</b></span>' +
      '<span class="m-sub">' + M.from.slice(5) + '~' + M.until.slice(5) + ' · ' + M.days + '일 · 일평균 ' + man(avg) + '</span>' +
    '</summary>' +
    '<div class="m-body"><table class="m-tbl">' +
    '<colgroup><col style="width:22%"><col style="width:17%"><col style="width:11%"><col style="width:20%"><col style="width:15%"><col style="width:15%"></colgroup>' +
    '<thead><tr><th class="left">품목</th><th>광고비</th><th>전환수</th><th>C1 전환값</th><th>C1 ROAS</th><th>CPA</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td class="left">' + esc(r.item) + '</td>' +
        '<td>' + won(r.spend) + '</td><td>' + won(r.purchases) + '</td><td>' + won(r.val) + '</td>' +
        '<td class="roas">' + roasPill(r.roas, r.spend) + '</td>' +
        '<td>' + (r.cpa == null ? '<span class="na">—</span>' : won(r.cpa)) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr><td class="left">전체</td><td>' + won(T.spend) + '</td><td>' + won(T.purchases) + '</td>' +
    '<td>' + won(T.val) + '</td><td class="roas">' + roasPill(roas, T.spend) + '</td>' +
    '<td>' + (T.purchases ? won(T.spend/T.purchases) : '—') + '</td></tr></tfoot></table></div></details>';
}

/* ── 기간 합계 ──
   날짜 구간을 찍으면 그 사이 일자 스냅샷을 전부 더한다. 지난 날짜는 확정값, 오늘은 지금까지 관측값.
   계정 탭(S.acct)을 그대로 따른다. 선택은 브라우저에 기억해 둔다. */
var RNG_PRESETS = [['yday','어제'],['d7','최근 7일'],['d14','최근 14일'],['tm','이번 달'],['lm','지난달'],['all','전체']];
function dAdd(d, n){ var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); }
function rngPreset(key){
  var R = D.range, last = D.dateStr, y = dAdd(last, -1), first = R.dates.length ? R.dates[0].d : last;
  var mFirst = last.slice(0,8) + '01', lmLast = dAdd(mFirst, -1), lmFirst = lmLast.slice(0,8) + '01';
  var m = { yday:[y,y], d7:[dAdd(y,-6),y], d14:[dAdd(y,-13),y], tm:[mFirst,last], lm:[lmFirst,lmLast], all:[first,last] }[key];
  // 기록 시작일 앞으로 잘라내지 않는다 — 그래야 '30일 중 15일만 합산' 안내가 뜬다
  return m ? { key:key, from: m[0], to: m[1] } : null;
}
function rngState(){
  if (S.rng) return S.rng;
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('bdg_rng') || 'null'); } catch(e) {}
  S.rng = (saved && saved.key && saved.key !== 'custom') ? rngPreset(saved.key)
        : (saved && saved.from && saved.to ? saved : null);
  if (!S.rng) S.rng = rngPreset('d7');
  return S.rng;
}
function rngSet(r){
  if (!r) return;
  if (r.from > r.to) { var t = r.from; r.from = r.to; r.to = t; }
  S.rng = r;
  try { localStorage.setItem('bdg_rng', JSON.stringify(r)); } catch(e) {}
  renderRange();
}
function rngClick(ev){
  if (ev.target.closest('.rng-tog')) {
    S.rngFold = !S.rngFold;
    try { localStorage.setItem('bdg_rng_fold', S.rngFold ? '1' : '0'); } catch(e) {}
    document.getElementById('rng').classList.toggle('folded', S.rngFold);
    return;
  }
  var b = ev.target.closest('[data-rk]');
  if (b) { rngSet(rngPreset(b.getAttribute('data-rk'))); return; }
  if (ev.target.closest('#rng-apply')) {
    var f = document.getElementById('rng-from').value, t = document.getElementById('rng-to').value;
    if (f && t) rngSet({ key:'custom', from:f, to:t });
  }
}
function renderRange(){
  var el = document.getElementById('rng');
  if (!el) return;
  var R = D.range;
  if (!R || !R.dates.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  var st = rngState(), first = R.dates[0].d, last = R.dates[R.dates.length - 1].d;

  var T = { spend:0, imp:0, clicks:0, purchases:0, val:0, daily:0 }, byItem = {}, byDay = {};
  var inDays = R.dates.map(function(x, i){ return { i:i, x:x }; })
                .filter(function(o){ return o.x.d >= st.from && o.x.d <= st.to; });
  var want = {}; inDays.forEach(function(o){ want[o.i] = 1; });
  R.rows.forEach(function(r){
    if (!want[r[0]]) return;
    if (S.acct && r[1] !== S.acct) return;
    var it = R.items[r[2]];
    var a = byItem[it] || (byItem[it] = { spend:0, purchases:0, val:0 });
    var dd = byDay[r[0]] || (byDay[r[0]] = { spend:0, purchases:0, val:0, daily:0 });
    T.spend += r[3]; T.imp += r[4]; T.clicks += r[5]; T.purchases += r[6]; T.val += r[7]; T.daily += r[8];
    a.spend += r[3]; a.purchases += r[6]; a.val += r[7];
    dd.spend += r[3]; dd.purchases += r[6]; dd.val += r[7]; dd.daily += r[8];
  });
  var n = inDays.length;
  var span = Math.round((new Date(st.to + 'T00:00:00Z') - new Date(st.from + 'T00:00:00Z')) / 86400000) + 1;
  var live = inDays.filter(function(o){ return !o.x.fin; });
  var roas = T.spend ? T.val / T.spend * 100 : 0;

  function card(l, v, sub){ return '<div class="rng-c"><div class="cl">' + l + '</div><div class="cv">' + v + '</div><div class="cs">' + sub + '</div></div>'; }
  var cards =
    card('광고비', won(T.spend) + '원', '일평균 <b>' + won(n ? T.spend / n : 0) + '원</b>') +
    card('일예산 합계', won(T.daily) + '원', '소진률 <b>' + pct(T.daily ? T.spend / T.daily * 100 : 0) + '</b>') +
    card('C1 전환', won(T.purchases) + '건', 'CPA <b>' + (T.purchases ? won(T.spend / T.purchases) + '원' : '—') + '</b>') +
    card('C1 전환값', won(T.val) + '원', '일평균 <b>' + won(n ? T.val / n : 0) + '원</b>') +
    card('C1 ROAS', pct(roas), '목표 ' + pct(S.tRoas) + ' 대비 <b>' + (roas >= S.tRoas ? '+' : '') + (roas - S.tRoas).toFixed(0) + '%p</b>') +
    card('CTR · CVR', (T.imp ? (T.clicks / T.imp * 100).toFixed(2) : '0.00') + '%',
      'CVR <b>' + (T.clicks ? (T.purchases / T.clicks * 100).toFixed(2) + '%' : '—') + '</b> · 클릭 ' + won(T.clicks));

  var items = Object.keys(byItem).map(function(k){ var o = byItem[k]; return { k:k, spend:o.spend, purchases:o.purchases, val:o.val }; })
    .filter(function(o){ return o.spend > 0; }).sort(function(a,b){ return b.spend - a.spend; });
  var itemTbl = '<table><thead><tr><th class="left">품목</th><th>광고비</th><th>비중</th><th>전환</th><th>C1 전환값</th><th>C1 ROAS</th><th>CPA</th></tr></thead><tbody>' +
    items.map(function(o){
      return '<tr><td class="left">' + esc(o.k) + '</td><td>' + won(o.spend) + '</td><td>' + pct(T.spend ? o.spend / T.spend * 100 : 0) + '</td>' +
        '<td>' + won(o.purchases) + '</td><td>' + won(o.val) + '</td><td class="roas">' + roasPill(o.spend ? o.val / o.spend * 100 : 0, o.spend) + '</td>' +
        '<td>' + (o.purchases ? won(o.spend / o.purchases) : '—') + '</td></tr>';
    }).join('') + '</tbody></table>';
  var dayTbl = '<table><thead><tr><th class="left">일자</th><th>일예산</th><th>광고비</th><th>소진률</th><th>전환</th><th>C1 ROAS</th></tr></thead><tbody>' +
    inDays.slice().reverse().map(function(o){
      var d = byDay[o.i] || { spend:0, purchases:0, val:0, daily:0 };
      var dow = '일월화수목금토'.charAt(new Date(o.x.d + 'T00:00:00Z').getUTCDay());
      return '<tr><td class="left">' + o.x.d.slice(5) + ' (' + dow + ')' + (o.x.fin ? '' : '<span class="rng-live">진행 중 ' + (o.x.poll || '') + '</span>') + '</td>' +
        '<td>' + won(d.daily) + '</td><td>' + won(d.spend) + '</td><td>' + pct(d.daily ? d.spend / d.daily * 100 : 0) + '</td>' +
        '<td>' + won(d.purchases) + '</td><td class="roas">' + roasPill(d.spend ? d.val / d.spend * 100 : 0, d.spend) + '</td></tr>';
    }).join('') + '</tbody></table>';

  var notes = [];
  if (n < span) notes.push('선택 구간 ' + span + '일 중 데이터가 있는 ' + n + '일만 합산 (보드 기록은 ' + first + '부터)');
  if (live.length) notes.push('진행 중인 날(' + live.map(function(o){ return o.x.d.slice(5); }).join(', ') + ')은 지금까지 관측값이라 마감 후 더 늘어납니다');
  notes.push('C1 = 1일 클릭 기여 · 지난 날짜는 확정값');

  var acctLabel = S.acct ? ((D.accounts.filter(function(a){ return a.id === S.acct; })[0] || {}).label || '') : '전체 계정';
  el.innerHTML =
    '<div class="rng-hd"><button class="rng-tog" title="접기/펼치기"><span class="rng-chev"></span><span class="rng-t">기간 합계</span></button>' +
      '<span class="rng-mini">광고비 <b>' + man(T.spend) + '</b> · C1 ROAS <b>' + pct(roas) + '</b> · 전환 <b>' + won(T.purchases) + '건</b></span>' +
      '<span class="rng-ctl">' +
      RNG_PRESETS.map(function(p){ return '<button class="rng-btn' + (st.key === p[0] ? ' active' : '') + '" data-rk="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
      '<span class="rng-sep"></span>' +
      '<input type="date" class="rng-in" id="rng-from" min="' + first + '" max="' + last + '" value="' + st.from + '">' +
      '<span class="muted">~</span>' +
      '<input type="date" class="rng-in" id="rng-to" min="' + first + '" max="' + last + '" value="' + st.to + '">' +
      '<button class="rng-btn' + (st.key === 'custom' ? ' active' : '') + '" id="rng-apply">적용</button></span>' +
      '<span class="rng-badge"><b>' + st.from.slice(5) + ' ~ ' + st.to.slice(5) + '</b> · ' + n + '일 · ' + esc(acctLabel) + '</span>' +
    '</div>' +
    '<div class="rng-body"><div class="rng-cards">' + cards + '</div>' +
    '<details' + (S.rngOpen ? ' open' : '') + ' ontoggle="S.rngOpen=this.open"><summary>품목별 · 일자별 보기</summary>' +
      '<div class="rng-tbls"><div>' + itemTbl + '</div><div>' + dayTbl + '</div></div></details>' +
    '<div class="rng-note">' + notes.join(' · ') + '</div></div>';
  if (S.rngFold == null) { try { S.rngFold = localStorage.getItem('bdg_rng_fold') === '1'; } catch(e) { S.rngFold = false; } }
  el.classList.toggle('folded', S.rngFold);
  if (!el.getAttribute('data-bound')) { el.addEventListener('click', rngClick); el.setAttribute('data-bound', '1'); }
}

function renderSales(){
  var el = document.getElementById('sales');
  if (!el) return;
  if (!D.sales || !D.sales.byItem) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  var S2 = D.sales.byItem, U = D.sales.unmapped || { utmAmt:0, allAmt:0, top:[] };

  var list = (S.acct ? D.campaigns.filter(function(c){ return c.account === S.acct; }) : D.campaigns);
  var m = {};
  list.forEach(function(c){
    var o = m[c.item] || (m[c.item] = { daily:0, spend:0, purchases:0, val:0 });
    o.daily += c.daily; o.spend += c.spend; o.purchases += c.purchases; o.val += c.val;
  });
  var rows = Object.keys(m).map(function(k){
    var s2 = S2[k] || { utmAmt:0, allAmt:0 };
    var o = m[k];
    return { item:k, daily:o.daily, spend:o.spend, purchases:o.purchases, val:o.val,
             utm:s2.utmAmt, all:s2.allAmt };
  }).filter(function(r){ return r.spend > 0 || r.utm > 0; })
    .sort(function(a,b){ return b.spend - a.spend; });

  var T = rows.reduce(function(a,r){
    a.daily+=r.daily; a.spend+=r.spend; a.purchases+=r.purchases; a.val+=r.val; a.utm+=r.utm; a.all+=r.all; return a;
  }, { daily:0, spend:0, purchases:0, val:0, utm:0, all:0 });

  // 메타 대비 UTM 비율 — 메타 숫자를 얼마나 할인해서 볼지
  function ratio(r){ return r.val ? r.utm / r.val : null; }
  function rcls(v){ return v == null ? '' : v >= 0.65 ? ' r-hi' : v >= 0.45 ? '' : ' r-lo'; }
  // 광고 기여도 — 그 상품 총매출 중 facebook 유입 비중
