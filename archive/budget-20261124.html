    }).join('') + '</tbody></table>';
}

/* 정렬 표시 아이콘 위치.
   숫자 컬럼은 우측정렬이라 아이콘을 라벨 뒤에 두면 라벨이 왼쪽으로 밀려 아래 숫자와 어긋난다.
   그래서 우측정렬 컬럼은 아이콘을 라벨 '앞'에 붙여 라벨의 오른쪽 끝을 숫자와 맞춘다. */
function sortHead(c, st){
  var ic = '<span class="sort-ic">' + (st.key === c.k ? (st.dir < 0 ? '▼' : '▲') : '◆') + '</span>';
  return c.left ? (c.h + ic) : (ic + c.h);
}

/* ── 메인 3단 드릴다운 ── */
// 캠페인명 앞머리의 두 자리 코드(01_통살, 07_크리스피 …)를 품목 코드로 쓴다.
// 같은 품목이면 대개 코드가 같고, 섞여 있으면 가장 많은 쪽을 택한다.
function itemCode(it){
  var cnt = {};
  it.camps.forEach(function(c){
    var m = String(c.name).match(/^(\d{2})/);
    if (m) cnt[m[1]] = (cnt[m[1]] || 0) + 1;
  });
  var best = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; })[0];
  return best ? '<span class="icode">' + best + '</span>' : '';
}
// 품목 옆 상품코드 (사용자 요청 2026-10-21) — 캠페인명의 "(3108)"·"(3112+2525)"·"_3341_" 에서 뽑아 많이 쓰인 순
function prodCodes(it){
  var cnt = {};
  it.camps.forEach(function(c){
    var nm = String(c.name), m, re = /\((\d{4}(?:\+\d{4})*)\)|_(\d{4})_/g;
    while ((m = re.exec(nm))) (m[1] || m[2]).split('+').forEach(function(k){ if (k >= '2000') cnt[k] = (cnt[k] || 0) + 1; });   // (1010) 같은 날짜 표기 제외
  });
  var ks = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a] || a.localeCompare(b); });
  return ks.length ? '<span class="pcode">' + ks.join('·') + '</span>' : '';
}

/* ── 메인 표 ──
   품목·캠페인·광고세트를 하나의 <table> 에 담는다.
   예전에는 품목 표 안의 colspan 칸에 캠페인 표를 따로 넣었는데, 표가 둘이라 컬럼이
   서로 다른 자리에 떨어져 "합계와 항목이 안 맞는" 것처럼 보였다(2026-09-21 피드백).
   같은 colgroup 을 공유하면 어느 깊이든 같은 세로선 위에 놓인다. */
var COLS = [
  { k:'name',      h:'캠페인',     left:true,  w:'18%' },
  { k:'mode',      h:'체계',       left:true,  w:'4%' },
  { k:'attr',      h:'기여',       left:true,  w:'3.5%' },
  { k:'strategy',  h:'입찰 · 캡값', left:true,  w:'6%' },
  { k:'daily',     h:'일예산',                 w:'6%'  },
  { k:'spend',     h:'소진',                   w:'5.5%' },
  { k:'remain',    h:'잔여',                   w:'4.5%' },
  { k:'pace',      h:'페이스',                 w:'4.5%'  },
  { k:'imp',       h:'노출수',     fnl:true,   w:'4%'  },
  { k:'clicks',    h:'클릭수',     fnl:true,   w:'3.5%'  },
  { k:'ctr',       h:'CTR',        fnl:true,   w:'4%'  },
  { k:'purchases', h:'전환수',                 w:'3.5%' },
  { k:'cvr',       h:'CVR',        fnl:true,   w:'3.5%' },
  { k:'val',       h:'전환값',                 w:'5%'  },
  { k:'aov',       h:'AOV',        fnl:true,   w:'4%'  },
  { k:'roas',      h:'ROAS',                   w:'4.5%'  },
  { k:'cpa',       h:'CPA',                    w:'4.5%'  },
  { k:'realEst',   h:'실매출 ROAS',            w:'5.5%'  },
  { k:'flowIdx',   h:'오늘 흐름',              w:'5%'  },
  { k:'todoN',     h:'할 일',      left:true,  w:'7%'  }
];
var NCOL = COLS.length;

// 일예산·소진은 이 보드에서 가장 자주 읽는 두 값이라 따로 표시한다
var KEYCOL = { daily:'key k1', spend:'key k2', remain:'rem' };

/* 메인 표는 품목 롤업만 보여준다 — 체계·기여·캡값은 캠페인 단위 속성이라
   품목 줄에선 늘 비어 있었다. 빼고 그만큼 숫자 칸을 넉넉히 쓴다. */
/* 품목 표는 두 박스로 나눈다.
   왼쪽 = 돈(예산·소진·잔여·페이스·전환수·전환값·ROAS·예상), 오른쪽 = 퍼널(노출·클릭·CTR·CVR·AOV).
   성격이 다른 지표를 한 표에 늘어놓으니 구분이 안 된다는 피드백(2026-09-30).
   두 표는 같은 순서로 그리고 행 높이를 고정해 좌우가 같은 줄에 오게 한다. */
var ITEM_COLS = [
  { k:'item',      h:'품목',   left:true, w:'17%', w0:'19%' },
  { k:'daily',     h:'일예산',            w:'8.5%', w0:'11%' },
  { k:'spend',     h:'소진',              w:'9%', w0:'11%' },
  { k:'remain',    h:'잔여',              w:'7.5%', w0:'8.5%' },
  { k:'pace',      h:'페이스',            w:'6.5%', w0:'7%'  },
  { k:'purchases', h:'전환수',            w:'5%',  w0:'6%' },
  { k:'val',       h:'전환값',            w:'8.5%', w0:'10%' },
  { k:'roas',      h:'ROAS',              w:'7%',  w0:'8%' },
  { k:'cpa',       h:'CPA',               w:'6%',  w0:'9%' },
  { k:'realEst',   h:'실매출 ROAS',       w:'7.5%', w0:'10.5%',
    tip:'오늘 C1 × (7일 실매출 ÷ 7일 C1) — 추정. 아래 작은 글씨가 어제까지 7일 확정 실매출 ROAS (메타 UTM + GA 로 찾은 빈칸 + 시크릿 빈칸, 다른 매체 제외)' }
];

// 오른쪽 박스 — 퍼널
var FNL_COLS = [
  { k:'item',   h:'품목',   left:true, w:'30%' },
  { k:'imp',    h:'노출수', fnl:true,  w:'17%' },
  { k:'clicks', h:'클릭수', fnl:true,  w:'12%' },
  { k:'ctr',    h:'CTR',    fnl:true,  w:'14%' },
  { k:'cvr',    h:'CVR',    fnl:true,  w:'12%' },
  { k:'aov',    h:'AOV',    fnl:true,  w:'15%' }
];

/* 품목별 예상 두 칸. 끝난 날엔 '예상'이 의미 없으므로 빼고,
   그만큼 나머지 칸이 원래 폭(w0)으로 돌아간다. */
var LAND_COLS = [
  { k:'landSpend', h:'예상 광고비', est:true, w:'11.5%',
    tip:'캠페인별 지금 소진 ÷ 이 시각 평년 누적 소진비중, 단 지금 일예산까지(꺼진 캠페인은 지금 소진까지). 품목 합계는 상단 예상 소진과 일치한다.' },
  { k:'landRoas',  h:'예상 ROAS',   est:true, w:'8%',
    tip:'품목별 시간대 데이터는 저장하지 않아 품목마다 감쇠를 따로 잴 수 없다. 전체가 지금→마감에 걸친 감쇠율을 품목에도 동일하게 적용한 값이다.' }
];

function itemCols(){
  if (D.isArchive || !D.curve)
    return ITEM_COLS.map(function(c){
      var o = {}; for (var k in c) o[k] = c[k];
      o.w = c.w0; return o;
    });
  return ITEM_COLS.concat(LAND_COLS);
}

/* 예상 광고비 — 추정값이라 흐리게 쓴다. 일예산을 넘길 전망이면 표식을 붙인다:
   메타는 예산선에서 멈추므로 "넘긴다"가 아니라 "예산이 꽉 찬다"는 신호다. */
function landSpendCell(it){
  if (it.landSpend == null) return '<span class="na">—</span>';
  var over = it.daily && it.landSpend > it.daily;
  // 뱃지를 숫자 뒤에 두면 그 줄만 숫자가 왼쪽으로 밀려 우측정렬이 깨진다 → 앞에 붙인다
  return '<span class="estv"' + (over ? ' title="이 속도면 예상 광고비가 이 품목 일예산을 넘는다 — 실제로는 예산선에서 멈추므로 여기까지 못 간다"' : '') + '>' +
    (over ? '<span class="estcap">초과</span>' : '') + won(it.landSpend) + '</span>';
}

// 현재 ROAS pill 과 구분되게 테두리만 있는 변형을 쓴다 — 확정값과 예상값이 같아 보이면 안 된다
function landRoasCell(v, spend){
  if (v == null || !spend) return '<span class="pill pill-na">—</span>';
  return '<span class="pill pill-est' + (v >= S.tRoas ? ' pill-est-hi' : '') +
    (v >= 1000 ? ' pill-tight' : '') + '">' + pct(v) + '</span>';
}

function renderMain(list, cn){
  var expect = cn ? cn.cumShare*100 : 0;

  var byItem = {};
  list.forEach(function(r){
    var o = byItem[r.item] || (byItem[r.item] = { item:r.item, daily:0, spend:0, purchases:0, val:0, imp:0, clicks:0, camps:[] });
    o.daily+=r.daily; o.spend+=r.spend; o.purchases+=r.purchases; o.val+=r.val;
    o.imp+=(r.imp||0); o.clicks+=(r.clicks||0); o.camps.push(r);
  });
  var T = agg(list);
  (function(){ var ex = 0, ok = false;
    list.forEach(function(c){ if (c.fairExp != null) { ex += c.fairExp; ok = true; } });
    T.fair = ok && ex > 0 ? T.spend / ex : null; })();

  /* 품목별 예상 — 상단 카드와 같은 근거를 쓴다.
     광고비: 품목 소진 ÷ 지금까지의 곡선 비중. 분모가 같으니 품목 합 = 전체 예상 소진.
     ROAS  : k = 전체 예상 ROAS ÷ 전체 현재 ROAS 를 품목에 똑같이 곱한다.
             이렇게 두면 품목 예상의 소진가중 평균이 상단 카드 값과 정확히 맞는다. */
  var land = null;
  if (cn && !D.isArchive && D.curve) {
    var srI = settledRoas(cn);
    var lrT = srI ? srI.land : T.roas * cn.ratio;
    land = { cum: cn.cumShare, k: T.roas ? lrT / T.roas : cn.ratio, total: lrT };
  }

  var items = Object.keys(byItem).map(function(k){
    var o = byItem[k];
    o.pace = o.daily ? o.spend/o.daily*100 : 0;
    o.roas = o.spend ? o.val/o.spend*100 : 0;
    o.landSpend = land ? landSum(o.camps, land.cum) : null;
    o.landRoas  = land && o.spend ? o.roas * land.k : null;
    o.realR = realAgg(o.camps); o.realEst = o.realR ? o.realR.est : null;
    return o;
  });
  sortRows(items, S.sort);

  // 정렬 키가 양쪽에 걸쳐 있으므로 한 번 정렬한 순서를 두 표가 그대로 쓴다
  items.forEach(function(o){
    o.ctr = o.imp ? o.clicks/o.imp*100 : null;
    o.cvr = o.clicks ? o.purchases/o.clicks*100 : null;
    o.aov = o.purchases ? o.val/o.purchases : null;
    o.cpa = o.purchases ? o.spend/o.purchases : null;
    // 품목 공정페이스 = 소속 캠페인 기대소진 합으로 나눈다 (평균의 평균이 아니라 합쳐서 나눠야 맞다)
    var ex = 0, ok = false;
    o.camps.forEach(function(c){ if (c.fairExp != null) { ex += c.fairExp; ok = true; } });
    o.fair = ok && ex > 0 ? o.spend / ex : null;
  });

  var CS = itemCols();
  function head(cols){
    return '<colgroup>' + cols.map(function(c){ return '<col style="width:' + c.w + '">'; }).join('') +
      '</colgroup><thead><tr>' + cols.map(function(c){
        var key = c.k === 'item' ? 'name' : c.k;
        return '<th class="sortable' + (c.left?' left':'') + (c.est?' est':'') + (c.fnl?' fnl':'') +
          (c.k==='landSpend'?' estfirst':'') + (KEYCOL[key]?' ' + KEYCOL[key]:'') +
          (S.sort.key===key?' sort-active':'') + '"' + (c.tip ? ' title="' + esc(c.tip) + '"' : '') +
          ' onclick="setSort(\'' + key + '\')">' + sortHead({ k:key, h:c.h, left:c.left }, S.sort) + '</th>';
      }).join('') + '</tr></thead>';
  }
  function nameCell(it){
    return '<td class="left tog itemname" onclick="openItem(\'' + esc(it.item) + '\')">' +
      '<span class="arrow">▸</span> ' + itemCode(it) + esc(it.item) + prodCodes(it) +
      ' <span class="cnt">' + it.camps.length + '개</span>' + itemTodo(it.item) + '</td>';
  }
  var acctLabel = S.acct ? D.accounts.filter(function(a){ return a.id===S.acct; })[0].label : '전체';

  // ── 왼쪽: 예산 · 소진 · 결과
  var L = '<table class="grid itemgrid">' + head(CS) + '<tbody>';
  items.forEach(function(it, i){
    L += '<tr class="lv1 item-row" data-i="' + i + '">' + nameCell(it) +
      '<td class="key k1">' + won(it.daily) + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(it.spend) + '</td>' +
      '<td class="rem">' + remainCell(it.daily, it.spend) + '</td>' +
      '<td class="pace ' + paceCls(it.pace, expect) + slowCls(it.pace, expect) + '"' + slowTitle(it.pace, expect) + '>' + paceVal(it.pace, expect) + '</td>' +
      '<td>' + won(it.purchases) + '</td><td>' + won(it.val) + '</td>' +
      '<td class="roas">' + roasPill(it.roas, it.spend) + '</td>' +
      '<td>' + (it.purchases ? won(it.spend / it.purchases) : '<span class="na">—</span>') + '</td>' +
      '<td>' + realCell(it.realR) + '</td>' +
      (land ? '<td class="est estfirst">' + landSpendCell(it) + '</td>' +
              '<td class="est roas">' + landRoasCell(it.landRoas, it.spend) + '</td>' : '') + '</tr>';
  });
  L += '</tbody><tfoot><tr><td class="left">' + acctLabel + '</td>' +
    '<td class="key k1">' + won(T.daily) + '</td>' +
    '<td class="key k2"><span class="arw">→</span>' + won(T.spend) + '</td>' +
    '<td class="rem">' + remainCell(T.daily, T.spend) + '</td><td>' + pct(T.pace) + '</td>' +
    '<td>' + won(T.purchases) + '</td><td>' + won(T.val) + '</td>' +
    '<td class="roas">' + roasPill(T.roas, T.spend) + '</td>' +
    '<td>' + (T.purchases ? won(T.spend / T.purchases) : '<span class="na">—</span>') + '</td>' +
    '<td>' + realCell(realAgg(list)) + '</td>' +
    (land ? '<td class="est estfirst">' + landSpendCell({ landSpend: landSum(list, land.cum), daily: T.daily }) + '</td>' +
            '<td class="est roas">' + landRoasCell(land.total, T.spend) + '</td>' : '') +
    '</tr></tfoot></table>';

  // ── 오른쪽: 퍼널
  var R = '<table class="grid itemgrid fnlgrid">' + head(FNL_COLS) + '<tbody>';
  items.forEach(function(it, i){
    R += '<tr class="lv1 item-row" data-i="' + i + '">' + nameCell(it) +
      '<td class="fnl">' + won(it.imp) + '</td><td class="fnl">' + won(it.clicks) + '</td>' +
      fnlTrio(it, it.item, true) + '</tr>';
  });
  R += '</tbody><tfoot><tr><td class="left">' + acctLabel + '</td>' +
    '<td class="fnl">' + won(T.imp) + '</td><td class="fnl">' + won(T.clicks) + '</td>' +
    fnlTrio({ imp:T.imp, clicks:T.clicks, purchases:T.purchases, val:T.val }, null, true) +
    '</tr></tfoot></table>';

  document.getElementById('main-tbl').innerHTML =
    '<div class="split">' +
      '<div class="pbox"><div class="pbt pbt-money">예산 · 소진 · 결과</div>' + L + '</div>' +
      '<div class="pbox"><div class="pbt pbt-fnl">노출 · 클릭 · 효율</div>' + R + '</div>' +
    '</div>';
  syncRowHover();
}

/* 좌우는 물리적으로 다른 표라 한쪽에 마우스를 올려도 반대쪽이 안 밝아진다.
   같은 줄임을 눈으로 확인할 수 있게 data-i 로 짝을 맞춰 같이 칠한다. */
function syncRowHover(){
  var rows = document.querySelectorAll('#main-tbl tr.item-row');
  Array.prototype.forEach.call(rows, function(tr){
    tr.addEventListener('mouseenter', function(){
      var m = document.querySelectorAll('#main-tbl tr.item-row[data-i="' + tr.getAttribute('data-i') + '"]');
      Array.prototype.forEach.call(m, function(x){ x.classList.add('rowhi'); });
    });
    tr.addEventListener('mouseleave', function(){
      var m = document.querySelectorAll('#main-tbl tr.rowhi');
      Array.prototype.forEach.call(m, function(x){ x.classList.remove('rowhi'); });
    });
  });
}

/* ── 실매출 · 오늘 흐름 · 제안 표시 (11/12) — 계산은 budget-logic.js (realAgg·flowIdx·adList·proposeAll) ── */
var FLOW = { low:['낮음','bad'], good:['좋음','good'], mid:['평소','flat'], hold:['보류','na'] };
function realCell(r){
  if (!r || r.est == null) return '<span class="na" title="7일 실매출 기준 없음 (새 캠페인·상품번호 없는 광고)">—</span>';
  // 11/24: 두 줄 유지(좌우 표 줄 맞춤) — 아래 줄에 7일 실매출 · 순수(CRM 푸시 쿠폰·공구 상품 뺀 것)
  var pure = r.pure7 != null ? ' · 순수 ' + pct(r.pure7) : '';
  return '<b>' + pct(r.est) + '</b><div class="muted" style="font-size:10px;white-space:nowrap" title="7일 실매출 ROAS · 순수 = CRM 푸시 쿠폰 주문 ' + (r.crmPct||0).toFixed(1) + '% · 공구 상품 ' + (r.ggPct||0).toFixed(1) + '% 를 뺀 값">7일 ' + pct(r.r7) + pure + '</div>';
}
function flowCell(f){
  if (!f) return '<span class="na">—</span>';
  return '<span class="fl fl-' + FLOW[f.v][1] + '" title="오늘 이 대상 효율 ÷ 오늘 전체, 그걸 7일 같은 비율과 비교 — 0.7 미만 낮음, 1.3 이상 좋음">' +
    (f.idx != null ? Math.round(f.idx*100) + '% ' : '') + FLOW[f.v][0] + (f.v === 'hold' ? '<span class="muted" style="font-weight:400"> 구매&lt;5</span>' : '') + '</span>';
}
// 운영 제안을 행마다 붙이기 — render() 가 PROPS 를 채운다 (캠페인 id · 'set:'+세트 id · 소재 id)
var PROPS = {};
function propMap(list){ var m = {}; list.forEach(function(x){ var k = x.key || x.camp.id; (m[k] = m[k] || []).push(x); }); return m; }
// 메타 학습 상태 (광고세트 learning_stage_info) — 학습 중엔 끄기 제안 안 함 (budget-logic.js)
function learnChip(a){
  var l = a.learn || {};
  if (l.s === 'LEARNING') return '<span class="lchip lchip-l" title="학습 중 — 전환 ' + (l.n || 0) + '/50 · 이 동안 숫자로 끄지 않음">학습 ' + (l.n || 0) + '/50</span>';
  if (l.s === 'FAIL') return '<span class="lchip lchip-f" title="학습 제한 — 주 50전환을 못 채움">학습 제한</span>';
  return '';
}
/* ── 할 일 (11/12 "오늘 흐름 옆에 진짜 해야 되는 것만 — 소재 ON/OFF, 예산 증감") ──
   행마다 자기 할 일 + 그 아래(세트·소재) 할 일 개수. 계산은 운영 제안(budget-logic.js proposeAll) 그대로 */
var ACT_T = { cut:1, up:1, off:1, setOff:1, adOff:1 };
function actOne(x){
  var m = x.m || {};
  if (x.t === 'cut' || x.t === 'up') return { cls: x.t === 'up' ? 'good' : 'bad', txt: '예산 ' + man(m.daily) + ' → ' + man(m.to) };
  return { cls:'bad', txt: { off:'캠페인 OFF', setOff:'세트 OFF', adOff:'소재 OFF' }[x.t] };
}
function itemTodo(item){
  var n = 0; Object.keys(PROPS).forEach(function(k){ PROPS[k].forEach(function(x){ if (ACT_T[x.t] && x.camp.item === item) n++; }); });
  return n ? '<span class="todo-b" title="이 품목 안 할 일 (캠페인·세트·소재) — 누르면 들어가서 확인">할 일 ' + n + '</span>' : '';
}
function todoOf(level, id){
  var own = (PROPS[level === 'set' ? 'set:' + id : id] || []).filter(function(x){ return ACT_T[x.t]; });
  var sets = 0, ads = 0;
  Object.keys(PROPS).forEach(function(k){ PROPS[k].forEach(function(x){
    if (level === 'camp' && x.camp.id === id) { if (x.t === 'setOff') sets++; if (x.t === 'adOff') ads++; }
    if (level === 'set' && x.t === 'adOff' && x.setId === id) ads++;
  }); });
  return { own: own, sets: sets, ads: ads, n: own.length + sets + ads };
}
function todoCell(td, link){
  if (!td || !td.n) return '<span class="na">—</span>';
  var h = td.own.map(function(x){ var a = actOne(x);
    return '<div><span class="fl fl-' + a.cls + '" title="' + esc(x.why + ' — ' + x.act) + '">' + a.txt + '</span></div>'; }).join('');
  var sub = []; if (td.sets) sub.push('세트 ' + td.sets + '개 OFF'); if (td.ads) sub.push('소재 ' + td.ads + '개 OFF');
  if (sub.length) h += '<div class="tdsub">' + sub.join(' · ') + ' ›</div>';
  return h + (link || '');
}
// 메타 광고관리자 그 항목 수정 화면 — 11/12 확인: /manage/ads/edit 가 ON·OFF 스위치 있는 수정 화면으로 바로 열림 (로그인한 브라우저 기준)
function metaLink(level, act, c, s2, a){
  var q = 'act=' + act + '&selected_campaign_ids=' + c + (s2 ? '&selected_adset_ids=' + s2 : '') + (a ? '&selected_ad_ids=' + a : '');
  return '<a class="mlink" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="메타 광고관리자에서 바로 열기 (수정 화면)" href="https://adsmanager.facebook.com/adsmanager/manage/' + level + '/edit?' + q + '">메타에서 열기 ↗</a>';
}
function histBtn(id){ return '<button class="iconbtn" title="기준선 — 최근 3일 + 동요일" onclick="toggleHist(event,\'' + id + '\')">📊</button>'; }

// 소재 표 — 세트까지 들어갔을 때 보인다 (11/12 메타식 드릴다운). 오늘 값은 30분마다 받는 소재 단위 C1 (D.adsToday)
function adTable(campId, setId){
  var L0 = acctList(), A0 = agg(L0), R0 = realAgg(L0);
  var camp = D.campaigns.filter(function(c){ return c.id === campId; })[0] || {};
  var ads = adList(campId, setId, A0, R0);
  var all = ads.length;
  if (S.todoOnly) ads = ads.filter(function(x){ return (PROPS[x.a.id] || []).length; });
  if (!ads.length) return '<div class="muted" style="padding:14px">' + (all ? '이 세트 소재엔 할 일이 없습니다 ("할 일만 보기"를 끄면 전체)' : '어제 집행했고 7일 3만 원 이상 쓴 소재가 없습니다') + '</div>';
  var at = D.adsToday ? D.adsToday.time : null;
  var h = '<div class="sub-title" style="margin:4px 0 8px">소재 — 오늘 ' + (at ? at + ' 기준 (30분마다)' : '없음') + ' · 7일 ' + D.real.from.slice(5) + '~' + D.real.to.slice(5) + ' (어제 집행·7일 3만 원+) · 비중은 캠페인 안 · 실매출 = 소재 UTM × 캠페인 실매출 배율 · 끄기 판단은 같은 캠페인과 비교</div>' +
    '<table class="grid"><colgroup><col style="width:23%"><col style="width:7%"><col style="width:6.5%"><col style="width:8%"><col style="width:7%"><col style="width:5%"><col style="width:6.5%"><col style="width:7.5%"><col style="width:10%"><col style="width:19.5%"></colgroup>' +
    '<thead><tr><th class="left">소재</th><th>오늘 광고비</th><th>오늘 C1 ROAS</th><th>오늘 흐름</th><th>7일 광고비</th><th>비중</th><th>7일 C1 ROAS</th><th>실매출 ROAS</th><th class="left">할 일</th><th class="left">근거</th></tr></thead><tbody>';
  ads.forEach(function(x){
    var t = x.today || { spend:0, imp:0, clicks:0, purchases:0, val:0 };
    var pr = (PROPS[x.a.id] || [])[0];
    h += '<tr' + (S.ddFocus === x.a.id ? ' class="ddfocus"' : '') + '><td class="left"><span class="nmwrap"><span class="nm" title="' + esc(x.a.name) + '">' + esc(x.a.name) + '</span>' + histBtn(x.a.id) + '</span></td>' +
      '<td>' + won(t.spend) + '</td><td>' + (t.spend ? roasPill(t.val / t.spend * 100, t.spend) : '<span class="na">—</span>') + '</td><td>' + flowCell(x.fl) + '</td>' +
      '<td>' + won(x.a.sp) + '</td><td>' + (x.share == null ? '—' : pct(x.share*100)) + '</td>' +
      '<td>' + pct(x.c1r) + '</td><td>' + (x.rr == null ? '<span class="na">—</span>' : '<b>' + (x.estToday != null ? pct(x.estToday) : '—') + '</b><div class="muted" style="font-size:10px">7일 ' + pct(x.rr) + '</div>') + '</td>' +
      '<td class="left">' + (pr ? todoCell({ own:[pr], sets:0, ads:0, n:1 }, metaLink('ads', camp.account, campId, x.a.set, x.a.id))
                                : x.young ? '<span class="fl fl-na">새 소재 · 2주 보류</span>' : '<span class="na">—</span>') + '</td>' +
      '<td class="left muted" style="white-space:normal;line-height:1.5;font-size:11px">' + (pr ? esc(pr.why) : x.young ? '첫 집행 ' + x.a.d0.slice(5) + ' — 2주 안 된 소재는 숫자로 끄지 않음' : '') + '</td></tr>';
    if (S.openHist[x.a.id])
      h += '<tr class="sub-row"><td colspan="10">' + histTable({ spend:t.spend, imp:t.imp, clicks:t.clicks, purchases:t.purchases, val:t.val, asOf: at,
             history: D.real.hist && D.real.hist.ad[x.a.id] || [] }) + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function campRows(camps, expect){
  var L0 = acctList(), A0 = agg(L0), R0 = realAgg(L0);   // 아래 var rows 가 전역 rows() 를 가려서 따로 부름
  var rows = camps.map(function(r){
    var o = {}; for (var k in r) o[k] = r[k];
    o.pace = r.daily ? r.spend/r.daily*100 : 0;
    o.roas = r.spend ? r.val/r.spend*100 : 0;
    o.realR = realAgg([r]); o.realEst = o.realR ? o.realR.est : null;
    o.flow = flowOf(r, A0, R0); o.flowIdx = o.flow && o.flow.idx != null ? o.flow.idx : (o.flow ? -1 : null);
    o.todo = todoOf('camp', r.id); o.todoN = o.todo.n;
    return o;
  }).filter(function(o){ return !S.todoOnly || o.todoN; });
  sortRows(rows, S.sortDD);

  var h = '';
  rows.forEach(function(r){
    var open = !!S.openCamp[r.id];
    h += '<tr class="lv2 camp-row' + (open?' open':'') + '">' +
      '<td class="left nmcell tog" onclick="ddIn(\'c\',\'' + r.id + '\')" title="눌러서 광고세트로 들어가기">' +
        '<span class="nmwrap"><span class="arrow">›</span><span class="nm" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
        '<button class="iconbtn" title="캠페인명 전체 복사" onclick="copyName(event,\'' + r.id + '\')">📋</button>' +
        '<button class="iconbtn" title="기준선 — 최근 3일 + 동요일" onclick="toggleHist(event,\'' + r.id + '\')">📊</button></span></td>' +
      '<td class="left">' + modeChip(r) + '</td>' +
      '<td class="left">' + attrCell(r.attr) + '</td>' +
      '<td class="left">' + chgVal(bidCell(r.strategy, r.capText), r.chgCap, 'c:' + r.id, true) + '</td>' +
      '<td class="key k1">' + (r.daily ? chgVal(won(r.daily), r.chgBudget, 'b:' + r.id) : '<span class="na">—</span>') + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(r.spend) + '</td><td class="rem">' + remainCell(r.daily, r.spend) + '</td>' +
      '<td class="pace ' + paceCls(r.pace, expect) + slowCls(r.pace, expect) + '"' + slowTitle(r.pace, expect) + '>' + paceVal(r.pace, expect) + '</td>' +
      funnelCells(r, r.id, false) +
      '<td class="roas">' + roasPill(r.roas, r.spend) + '</td>' +
      '<td>' + (r.purchases ? won(r.spend / r.purchases) : '<span class="na">—</span>') + '</td>' +
      '<td>' + realCell(r.realR) + '</td><td>' + flowCell(r.flow) + '</td>' +
      '<td class="left">' + todoCell(r.todo, r.todo.n ? metaLink('campaigns', r.account, r.id) : '') + '</td></tr>';

    if (S.openChg['b:' + r.id]) h += subRow(chgTable('일예산 변경 이력', r.chgBudget));
    if (S.openChg['c:' + r.id]) h += subRow(chgTable('입찰 캡값 변경 이력', r.chgCap));
    if (S.openHist[r.id])       h += subRow(histTable(r));
  });
  return h;
}

function subRow(inner){
  return '<tr class="sub-row"><td colspan="' + NCOL + '">' + inner + '</td></tr>';
}

// 광고세트도 같은 컬럼 위에 올린다 — 캠페인 행과 세로선이 맞아야 비교가 된다
function adsetRows(r){
  if (!r.adsets || !r.adsets.length)
    return '<tr class="lv3"><td class="left nmcell" colspan="' + NCOL + '"><span class="muted">광고세트 없음</span></td></tr>';
  var budgeted = r.mode === 'ABO';
  var L0 = acctList(), A0 = agg(L0), R0 = realAgg(L0);
  var h = '';
  r.adsets.forEach(function(a){
    var td = todoOf('set', a.id);
    if (S.todoOnly && !td.n) return;
    var roas = a.spend ? a.val/a.spend*100 : 0;
    var share = r.spend ? a.spend/r.spend*100 : 0;
    h += '<tr class="lv3' + '">' +
      '<td class="left nmcell tog" onclick="ddIn(\'s\',\'' + a.id + '\')" title="눌러서 소재로 들어가기"><span class="nmwrap"><span class="arrow">›</span><span class="nmcol"><span class="nm" title="' + esc(a.name) + '">' + esc(a.name) + '</span>' + learnChip(a) + '</span>' + histBtn(a.id) + '</span></td>' +
      '<td></td>' +
      '<td class="left">' + attrCell(a.attr) + '</td>' +
      '<td class="left">' + chgVal(bidCell(a.strategy, a.capText), a.chgCap, 'c:' + a.id, true) + '</td>' +
      '<td class="key k1">' + (budgeted && a.daily ? chgVal(won(a.daily), a.chgBudget, 'b:' + a.id)
                 : '<span class="na" title="' + (budgeted ? '' : 'CBO — 캠페인 예산을 메타가 배분') + '">—</span>') + '</td>' +
      '<td class="key k2"><span class="arw">→</span>' + won(a.spend) + '</td><td class="rem">' + (budgeted ? remainCell(a.daily, a.spend) : '<span class="na">—</span>') + '</td>' +
      '<td class="muted">' + (budgeted && a.daily ? pct(a.spend/a.daily*100) : pct(share) + ' 배분') + '</td>' +
      funnelCells(a, a.id, false) +
      '<td class="roas">' + roasPill(roas, a.spend) + '</td>' +
      '<td>' + (a.purchases ? won(a.spend / a.purchases) : '<span class="na">—</span>') + '</td>' +
      '<td>' + realCell(setReal(a)) + '</td><td>' + flowCell(flowIdx(a, setBase(a.id), A0, R0)) + '</td>' +
      '<td class="left">' + todoCell(td, td.n ? metaLink('adsets', r.account, r.id, a.id) : '') + '</td></tr>';
    if (S.openHist[a.id])       h += subRow(histTable({ spend:a.spend, imp:a.imp, clicks:a.clicks, purchases:a.purchases, val:a.val, history: D.real && D.real.hist && D.real.hist.set[a.id] || [] }));
    if (S.openChg['b:' + a.id]) h += subRow(chgTable('광고세트 일예산 변경 이력', a.chgBudget));
    if (S.openChg['c:' + a.id]) h += subRow(chgTable('광고세트 캡값 변경 이력', a.chgCap));
  });
  return h;
}

function histTable(r){
  if (!r.history || !r.history.length)
    return '<div class="sub-wrap"><div class="sub-title">기준선 — 최근 3일 + 동요일</div>' +
      '<table><tbody><tr><td class="left muted" style="padding:10px 12px">해당 기간 데이터 없음 (최근 생성된 캠페인)</td></tr></tbody></table></div>';
  /* 오늘 표와 같은 퍼널 순서로 맞춘다 — 위아래를 눈으로 바로 비교할 수 있어야 한다.
     오늘 행(맨 위)을 같이 얹어 '기준선 대비 오늘'을 한 표에서 읽게 했다. */
  var tdy = { spend:r.spend, imp:r.imp, clicks:r.clicks, purchases:r.purchases, val:r.val,
              roas: r.spend ? r.val/r.spend*100 : 0 };
  function line(x, isToday){
    var ctr = x.imp ? x.clicks/x.imp*100 : null, cvr = x.clicks ? x.purchases/x.clicks*100 : null,
        aov = x.purchases ? x.val/x.purchases : null;
    var xr = x.roas != null ? x.roas : x.spend ? x.val/x.spend*100 : 0;   // 세트·소재 기준선(BQ)엔 roas 필드가 없다
    return '<tr' + (isToday ? ' class="hist-today"' : '') + '><td class="left"><b>' + (isToday ? '오늘' : x.tag) + '</b> ' +
      (isToday ? '<span class="muted">' + D.dateStr.slice(5) + ' ' + (r.asOf || D.pollTime) + ' 기준</span>'
               : '<span class="muted">' + x.date.slice(5) + ' </span><span class="dow' + (x.dow === '토' ? ' dow-sat' : x.dow === '일' ? ' dow-sun' : '') + '">(' + x.dow + ')</span>') + '</td>' +
      '<td>' + won(x.spend) + '</td>' +
      '<td>' + won(x.imp) + '</td><td>' + won(x.clicks) + '</td>' +
      '<td>' + (ctr == null ? '<span class="na">—</span>' : ctr.toFixed(2) + '%') + '</td>' +
      '<td>' + won(x.purchases) + '</td>' +
      '<td>' + (cvr == null ? '<span class="na">—</span>' : cvr.toFixed(1) + '%') + '</td>' +
      '<td>' + won(x.val) + '</td>' +
      '<td>' + (aov == null ? '<span class="na">—</span>' : won(aov)) + '</td>' +
      '<td class="roas ' + roasCls(xr, x.spend) + '">' + (x.spend ? pct(xr) : '<span class="na">—</span>') + '</td>' +
      '<td>' + (x.purchases ? won(x.spend / x.purchases) : '<span class="na">—</span>') + '</td></tr>';
  }
  return '<div class="sub-wrap"><div class="sub-title">기준선 — 최근 3일 + 동요일 (완결일 기준, C1)</div>' +
    '<table class="histtbl"><colgroup><col style="width:15%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:7.5%">' +
    '<col style="width:7.5%"><col style="width:7.5%"><col style="width:7.5%"><col style="width:10%"><col style="width:9%">' +
    '<col style="width:8%"><col style="width:9%"></colgroup>' +
    '<thead><tr><th class="left">날짜</th><th>광고비</th><th>노출수</th><th>클릭수</th><th>CTR</th>' +
    '<th>C1 전환수</th><th>CVR</th><th>C1 매출</th><th>AOV</th><th>C1 ROAS</th><th>CPA</th></tr></thead><tbody>' +
    line(tdy, true) +
    r.history.map(function(x){ return line(x, false); }).join('') + '</tbody></table></div>';
}



/* ── 오늘 볼 것 ──
   매일 손으로 훑던 판단(증액할 것 / 묶인 것 / 꺾인 것)을 규칙으로 뽑는다.
   10분마다 보드가 다시 그려질 때 같이 다시 계산되므로 항상 지금 기준이다.
   규칙은 전부 화면에 보이는 값만 쓴다 — 왜 떴는지 사용자가 검증할 수 있어야 한다. */
function watchList(list, cn){
  if (D.isArchive || !cn) return [];
  var A = agg(list), avg = A.spend ? A.val/A.spend*100 : 0;
  var rest = D.restShare != null ? D.restShare : 0;
  var out = proposeAll(list);   // 소재·세트·캠페인 끄기 · 예산 하향·증액 (budget-logic.js)
  list.forEach(function(c){
    if (!c.daily || c.daily < 200000) return;
    var roas = c.spend ? c.val/c.spend*100 : 0;
    var f = c.fair;
    if (f == null) return;
    var land = c.spend + f * c.daily * rest;

    /* ② 감액 — 예산이 남아돌 전망.
       단, 기구매자 타겟 TCPA 는 모수가 한정적이라 일부러 작게 두는 캠페인이다(2026-09-29 확인).
       소진이 덜 되는 게 정상이므로 제안 대상에서 뺀다. */
    var repTcpa = /기구매자|기구매/.test(c.name) &&
      (/TCPA/i.test(c.name) || (c.adsets||[]).some(function(a){ return /원$/.test(a.capText||''); }));
    var idle = Math.max(c.daily - land, 0);
    if (!repTcpa && f < 0.7 && idle >= 300000)
      out.push({ t:'idle', score: idle, camp:c,
        why: '공정페이스 ' + f.toFixed(2) + ' · ROAS ' + roas.toFixed(0) + '%',
        act: '오늘 안 나갈 전망 ' + won(idle) + '원' });

    // ③ 점검 — 퍼널이 꺾였는데 돈은 빠르게 나감
    if (c.spend >= 100000 && f >= 1.0) {
      var m = { imp:c.imp||0, clicks:c.clicks||0, purchases:c.purchases, val:c.val };
      var hits = [];
      [['ctr',ctrOf,'CTR'],['cvr',cvrOf,'CVR'],['aov',aovOf,'AOV']].forEach(function(x){
        var t = trendOf(c.id, false, x[1], x[1](m));
        if (t === 'd3') hits.push(x[2] + ' 3일 연속 하락');
        else if (t === 'd1' && roas < avg) hits.push(x[2] + ' 하락');
      });
      if (hits.length)
        out.push({ t:'warn', score: (avg - roas) + hits.length * 40, camp:c,
          why: hits.join(' · '), act: 'ROAS ' + roas.toFixed(0) + '% · 공정페이스 ' + f.toFixed(2) + '로 소진은 빠름' });
    }
  });
  // 같은 캠페인이 여러 갈래로 잡히면 가장 센 것만. 점검 > 증액 > 감액 순으로 우선.
  var rank = { adOff:0, off:1, setOff:2, cut:3, up:4, warn:5, idle:6 };
  var seen = {}, keep = [];
  out.sort(function(a,b){ return rank[a.t] - rank[b.t] || b.score - a.score; }).forEach(function(x){
    var k = x.key || x.camp.id;   // 소재는 소재 단위로 (같은 캠페인 다른 소재·캠페인 판정과 겹쳐도 됨)
    if (seen[k]) return; seen[k] = 1; keep.push(x);
  });
  /* 갈래마다 점수 단위가 달라(감액은 '원', 증액은 배수) 한 줄로 세우면 감액만 남는다.
     갈래별로 상위 2개씩 뽑아 균형을 맞춘다. */
  var res = [];
  ['adOff','off','setOff','cut','up','warn','idle'].forEach(function(t){
    keep.filter(function(x){ return x.t === t; })
      .sort(function(a,b){ return b.score - a.score; }).slice(0, t === 'adOff' ? 6 : t === 'warn' || t === 'idle' ? 2 : 4)
      .forEach(function(x){ res.push(x); });
  });
  return res;
}

var WT = { adOff:{ i:'✂', l:'소재 끄기' }, off:{ i:'■', l:'캠페인 끄기' }, setOff:{ i:'■', l:'세트 끄기' }, cut:{ i:'↓', l:'예산 하향' }, up:{ i:'↑', l:'예산 증액' }, warn:{ i:'!', l:'점검' }, idle:{ i:'·', l:'예산 남음' } };

/* ── 상품 판매 현황 ──
   메타가 주장하는 매출(C1)과 Cafe24 에 실제로 찍힌 매출을 품목별로 나란히 둔다.
     전환값        메타 C1 (1일 클릭 기여)
     UTM 전환값     Cafe24 facebook 유입으로 찍힌 그 품목 상품들의 매출
     상품 전체 전환값 채널 무관 그 상품들의 총 판매금액
   품목 ↔ 상품코드는 소재명의 prod_NNNN 으로 잇는다(data/product-map.json).
   Cafe24 는 하루가 끝나야 값이 굳으므로 지난 날짜 페이지에만 뜬다. */

/* ── 당월 누적 ──
   오늘 페이스 옆에 "이번 달이 어디로 가고 있나"를 같이 둔다.
   눌러서 펼치면 품목별로 쪼개진다. */
function renderMonth(){
  var el = document.getElementById('mbox');
  if (!el) return;
  if (!D.month || !D.month.items) { el.style.display = 'none'; return; }
  el.style.display = '';
  var M = D.month, it = M.items;
  var T = Object.keys(it).reduce(function(a,k){
    a.spend += it[k].spend; a.val += it[k].val; a.purchases += it[k].purchases; return a;
  }, { spend:0, val:0, purchases:0 });
  var roas = T.spend ? T.val/T.spend*100 : 0;
  var mm = Number(M.until.slice(5,7));
  var avg = M.days ? T.spend / M.days : 0;

  var rows = Object.keys(it).map(function(k){
    var o = it[k];
    return { item:k, spend:o.spend, val:o.val, purchases:o.purchases,
             roas: o.spend ? o.val/o.spend*100 : 0,
             cpa: o.purchases ? o.spend/o.purchases : null };
  }).filter(function(r){ return r.spend > 0; }).sort(function(a,b){ return b.spend - a.spend; });

  el.innerHTML = '<details id="m-d"' + (S.monthOpen ? ' open' : '') + ' ontoggle="S.monthOpen=this.open">' +
    '<summary class="m-sum">' +
      '<span class="m-mm">' + mm + '월</span>' +
      '<span class="m-kv"><i>광고비</i><b>' + man(T.spend) + '</b></span>' +
      '<span class="m-kv"><i>C1 전환값</i><b>' + man(T.val) + '</b></span>' +
      '<span class="m-kv"><i>C1 ROAS</i><b class="' + (roas >= S.tRoas ? 'm-hi' : '') + '">' + pct(roas) + '</b></span>' +
      '<span class="m-sub">' + M.from.slice(5) + '~' + M.until.slice(5) + ' · ' + M.days + '일 · 일평균 ' + man(avg) + '</span>' +
    '</summary>' +
    '<div class="m-body"><table class="m-tbl">' +
    '<colgroup><col style="width:22%"><col style="width:17%"><col style="width:11%"><col style="width:20%"><col style="width:15%"><col style="width:15%"></colgroup>' +
    '<thead><tr><th class="left">품목</th><th>광고비</th><th>전환수</th><th>C1 전환값</th><th>C1 ROAS</th><th>CPA</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td class="left">' + esc(r.item) + '</td>' +
        '<td>' + won(r.spend) + '</td><td>' + won(r.purchases) + '</td><td>' + won(r.val) + '</td>' +
        '<td class="roas">' + roasPill(r.roas, r.spend) + '</td>' +
        '<td>' + (r.cpa == null ? '<span class="na">—</span>' : won(r.cpa)) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr><td class="left">전체</td><td>' + won(T.spend) + '</td><td>' + won(T.purchases) + '</td>' +
    '<td>' + won(T.val) + '</td><td class="roas">' + roasPill(roas, T.spend) + '</td>' +
    '<td>' + (T.purchases ? won(T.spend/T.purchases) : '—') + '</td></tr></tfoot></table></div></details>';
}

/* ── 기간 보기 (2026-11-05, 기간 합계 박스 대체) ──
   상단 날짜 옆 월 버튼·날짜 지정 → 품목별 현황 표를 그 기간 합계로 바꾼다. '오늘'로 돌아오면 원래 표.
   일자 스냅샷 합산: 지난 날짜는 확정값, 오늘은 지금까지 관측값. 계정 탭 연동. 새로 열면 항상 오늘. */
function dAdd(d, n){ var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); }
function perMonths(){ var m = {}; D.range.dates.forEach(function(x){ m[x.d.slice(0,7)] = 1; }); return Object.keys(m).sort(); }
function renderPerBar(){
  var el = document.getElementById('per-bar');
  if (!el) return;
  var R = D.range;
  if (!R || !R.dates.length) { el.style.display = 'none'; return; }
  var first = R.dates[0].d, last = R.dates[R.dates.length - 1].d, p = S.per;
  el.innerHTML = '<span class="fl">기간</span>' +
    '<button class="rng-btn' + (p ? '' : ' active') + '" data-pk="">오늘</button>' +
    perMonths().map(function(m){ return '<button class="rng-btn' + (p && p.key === m ? ' active' : '') + '" data-pk="' + m + '">' + Number(m.slice(5)) + '월</button>'; }).join('') +
    '<input type="date" class="rng-in" id="per-from" min="' + first + '" max="' + last + '" value="' + (p ? p.from : last) + '">' +
    '<span class="muted">~</span>' +
    '<input type="date" class="rng-in" id="per-to" min="' + first + '" max="' + last + '" value="' + (p ? p.to : last) + '">' +
    '<button class="rng-btn' + (p && !p.key ? ' active' : '') + '" id="per-apply">보기</button>';
  if (!el.getAttribute('data-bound')) { el.addEventListener('click', perClick); el.setAttribute('data-bound', '1'); }
}
function perClick(ev){
  var b = ev.target.closest('[data-pk]');
  if (b) {
    var m = b.getAttribute('data-pk');
    S.per = m ? { key:m, from:m + '-01', to:dAdd(dAdd(m + '-01', 32).slice(0,8) + '01', -1) } : null;
  } else if (ev.target.closest('#per-apply')) {
    var f = document.getElementById('per-from').value, t = document.getElementById('per-to').value;
    if (!f || !t) return;
    S.per = f <= t ? { key:'', from:f, to:t } : { key:'', from:t, to:f };
  } else return;
  S.perOpen = {};
  render();
}
// 기간 모드 상단 카드 — 오늘 카드와 같은 틀, 목표 소진은 '하루 목표 × 일수'로 잰다
function renderPerKpi(T, n, p){
  function bar(v, cls){ return '<div class="bar"><i class="' + (cls||'') + '" style="width:' + Math.max(0, Math.min(v, 100)).toFixed(1) + '%"></i></div>'; }
  function lb(l, r){ return '<div class="bar-lb"><span>' + l + '</span><span>' + r + '</span></div>'; }
  function cls(v){ return v >= 100 ? 'good' : v >= 85 ? 'warn' : 'bad'; }
  var roas = T.spend ? T.val / T.spend * 100 : 0, goal = S.tSpend * n;
  var spendPct = goal ? T.spend / goal * 100 : 0, roasPct = S.tRoas ? roas / S.tRoas * 100 : 0;
  var lab = (p.key ? Number(p.key.slice(5)) + '월' : p.from.slice(5) + (p.from === p.to ? '' : ' ~ ' + p.to.slice(5))) + ' · ' + n + '일';
  var cards = [
    ['일예산 합계', won(T.daily) + '원', '일평균 <b>' + won(n ? T.daily / n : 0) + '원</b> · ' + lab +
      bar(T.daily ? T.spend / T.daily * 100 : 0) + lb('소진률 <b>' + pct(T.daily ? T.spend / T.daily * 100 : 0) + '</b>', '')],
    ['광고비', won(T.spend) + '원', '일평균 <b>' + won(n ? T.spend / n : 0) + '원</b>' +
      bar(spendPct, cls(spendPct)) + lb('목표(' + man(S.tSpend) + ' × ' + n + '일) 대비 <b>' + spendPct.toFixed(0) + '%</b>', '')],
    ['C1 ROAS', pct(roas), '전환 <b>' + won(T.purchases) + '건</b> · 전환값 ' + won(T.val) + '원' +
      bar(roasPct, cls(roasPct)) + lb('목표 ' + pct(S.tRoas) + ' 대비 <b>' + roasPct.toFixed(0) + '%</b>', '') +
      '<div><span class="tag ' + (roas >= S.tRoas ? 'up' : 'down') + '">목표 ' + pct(S.tRoas) + (roas >= S.tRoas ? ' 상회' : ' 미달 ' + (roas - S.tRoas).toFixed(0) + '%p') + '</span></div>'],
    ['C1 전환값', won(T.val) + '원', '일평균 <b>' + won(n ? T.val / n : 0) + '원</b> · CPA ' + (T.purchases ? won(T.spend / T.purchases) : '—') + '원' +
      '<br>객단가 ' + (T.purchases ? won(T.val / T.purchases) : '—') + '원 · CTR ' + (T.imp ? (T.clicks / T.imp * 100).toFixed(2) : '0.00') + '% · CVR ' + (T.clicks ? (T.purchases / T.clicks * 100).toFixed(2) : '0.00') + '%']
  ];
  document.getElementById('kpi').innerHTML = cards.map(function(c){
    return '<div class="card"><div class="cl">' + c[0] + '</div><div class="cv">' + c[1] + '</div><div class="cs">' + c[2] + '</div></div>';
  }).join('');
}
// 기간 모드에선 오늘 전용(예상·수정사항·볼 것·매출 대조)을 숨기고 제목을 바꾼다
function perToggle(){
  var f = document.querySelector('.folds'); if (f) f.style.display = S.per ? 'none' : '';
  ['watch', 'sales'].forEach(function(id){ var e = document.getElementById(id); if (e) e.style.display = S.per ? 'none' : ''; });
  document.getElementById('main-title').textContent = S.per ? '품목별 기간 합계' : '품목별 현황';
  document.getElementById('main-hint').textContent = S.per ? '품목 행을 누르면 캠페인별로 펼쳐집니다 · 상단 [오늘]로 돌아가기'
    : '행을 누르면 캠페인 → 광고세트로 펼쳐집니다 · 📊 기준선 · 📋 이름 복사';
}
function renderPer(){
  var R = D.range, p = S.per, want = {}, days = [];
  R.dates.forEach(function(x, i){ if (x.d >= p.from && x.d <= p.to) { want[i] = 1; days.push(x); } });
  function z(){ return { spend:0, imp:0, clicks:0, purchases:0, val:0, daily:0 }; }
  function add(o, r){ o.spend += r[3]; o.imp += r[4]; o.clicks += r[5]; o.purchases += r[6]; o.val += r[7]; o.daily += r[8]; }
  var T = z(), byItem = {};
  R.rows.forEach(function(r){
    if (!want[r[0]] || (S.acct && r[1] !== S.acct)) return;
    var it = R.items[r[2]], o = byItem[it] || (byItem[it] = Object.assign(z(), { item:it, camps:{} }));
    var cn = R.camps && r[9] != null ? R.camps[r[9]] : '(캠페인명 없음)';
    var c = o.camps[cn] || (o.camps[cn] = Object.assign(z(), { item:cn }));
    add(T, r); add(o, r); add(c, r);
  });
  function bySpend(a, b){ return b.spend - a.spend; }
  var items = Object.keys(byItem).map(function(k){ return byItem[k]; }).filter(function(o){ return o.spend > 0; }).sort(bySpend);

  function cells(o, nm, cls, extra){
    var roas = o.spend ? o.val / o.spend * 100 : 0;
    return '<tr class="' + cls + '"' + (extra || '') + '><td class="left">' + nm + '</td>' +
      '<td class="key k1">' + won(o.daily) + '</td><td class="key k2"><span class="arw">→</span>' + won(o.spend) + '</td>' +
      '<td>' + pct(o.daily ? o.spend / o.daily * 100 : 0) + '</td><td>' + pct(T.spend ? o.spend / T.spend * 100 : 0) + '</td>' +
      '<td>' + won(o.purchases) + '</td><td>' + won(o.val) + '</td><td class="roas">' + roasPill(roas, o.spend) + '</td>' +
      '<td>' + (o.purchases ? won(o.spend / o.purchases) : '<span class="na">—</span>') + '</td>' +
      '<td>' + won(o.imp) + '</td><td>' + won(o.clicks) + '</td>' +
      '<td>' + pct1(o.imp ? o.clicks / o.imp * 100 : null) + '</td><td>' + pct1(o.clicks ? o.purchases / o.clicks * 100 : null) + '</td>' +
      '<td>' + (o.purchases ? won(o.val / o.purchases) : '<span class="na">—</span>') + '</td></tr>';
  }
  var H = ['품목', '일예산 합계', '광고비', '소진률', '비중', 'C1 전환', 'C1 전환값', 'C1 ROAS', 'CPA', '노출', '클릭', 'CTR', 'CVR', '객단가'];
  var h = '<table class="grid" id="per-tbl"><colgroup>' + [18, 9, 9, 5, 5, 5.5, 9, 6.5, 6, 7.5, 6, 4.5, 4.5, 6].map(function(w){ return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
    '<thead><tr>' + H.map(function(x, i){ return '<th' + (i ? '' : ' class="left"') + '>' + x + '</th>'; }).join('') + '</tr></thead><tbody>';
  items.forEach(function(o, i){
    var open = !!S.perOpen[o.item], cs = Object.keys(o.camps).map(function(k){ return o.camps[k]; }).filter(function(c){ return c.spend > 0; }).sort(bySpend);
    h += cells(o, '<span class="arrow">' + (open ? '▾' : '▸') + '</span> <b>' + esc(o.item) + '</b> <span class="cnt">' + cs.length + '개</span>', 'lv1', ' data-pi="' + i + '"');
    if (open) cs.forEach(function(c){ h += cells(c, esc(c.item), 'lv2'); });
  });
  var acctLabel = S.acct ? ((D.accounts.filter(function(a){ return a.id === S.acct; })[0] || {}).label || '') : '전체';
  h += '</tbody><tfoot>' + cells(T, acctLabel, '') + '</tfoot></table>';

  var span = Math.round((new Date(p.to + 'T00:00:00Z') - new Date(p.from + 'T00:00:00Z')) / 86400000) + 1;
  var live = days.filter(function(x){ return !x.fin; });
  var note = '<b>' + (p.key ? Number(p.key.slice(5)) + '월' : '지정 기간') + '</b> ' + p.from.slice(5) + ' ~ ' + p.to.slice(5) +
    ' · 데이터 ' + days.length + '일 합계 · ' + esc(acctLabel) + ' · C1(1일 클릭)';
  if (days.length < span && p.from < R.dates[0].d) note += ' · 보드 기록은 ' + R.dates[0].d.slice(5) + '부터';
  if (live.length) note += ' · ' + live.map(function(x){ return x.d.slice(5) + (x.poll ? ' ' + x.poll : ''); }).join(', ') + '까지 관측값(진행 중)';
  renderPerKpi(T, days.length, p);
  var el = document.getElementById('main-tbl');
  el.innerHTML = '<div class="per-note">' + note + '</div>' + (items.length ? h : '<div class="muted">이 기간에 데이터가 없습니다.</div>');
  if (!el.getAttribute('data-per')) {
    el.setAttribute('data-per', '1');
    el.addEventListener('click', function(ev){
      if (!S.per) return;
      var tr = ev.target.closest('tr[data-pi]');
      if (!tr) return;
      var it = tr.querySelector('b').textContent;
      S.perOpen[it] = !S.perOpen[it];
      renderPer();
    });
  }
}

/* ── 메타 실매출 판단 (11/24) — C1 대신 판단 기준. 공식 메타 실매출 = Cafe24 결제액, GA 보정, 인플루언서 링크 제외 (v_media_attributed_daily_ga)

      (U.top && U.top.length ? ' · 상위: ' + U.top.slice(0, 4).map(function(x){

// 제안대로 다 하면 메타 일예산이 얼마나 바뀌나 + 어제 제안 이행 (budget.js prevProps)
function propSummary(w){
  var dn = 0, up = 0, adSp = 0, nAd = 0;
  w.forEach(function(x){ var m = x.m || {};
    if (x.t === 'cut' && m.to != null) dn += m.daily - m.to;
    if (x.t === 'off') dn += m.daily || 0;
    if (x.t === 'up' && m.to != null) up += m.to - m.daily;
    if (x.t === 'adOff') { adSp += (m.sp7 || 0) / 7; nAd++; } });
  var parts = [];
  if (dn || up) parts.push('제안대로 하면 메타 일예산 <b>' + (up - dn >= 0 ? '+' : '−') + man(Math.abs(up - dn)) + '</b> (하향·끄기 −' + man(dn) + ' · 증액 +' + man(up) + ')');
  if (nAd) parts.push('끌 소재 ' + nAd + '개가 하루 약 ' + man(adSp) + ' 쓰는 중 → 같은 캠페인 다른 소재로 감');
  if (D.ratioNow) parts.push('오늘 광고비중 예상 ' + D.ratioNow.ratio + '% (' + D.ratioNow.at + ', 목표 23%)');
  var P = D.prevProps;
  if (P && P.n) parts.push('어제 제안 ' + P.n + '건 중 실행 <b>' + P.done + '</b>' + (P.list && P.list.length ? ' — ' + P.list.map(function(x){ return esc(WT[x.t] ? WT[x.t].l : x.t) + ' ' + esc(String(x.name).slice(0, 22)) + (x.done ? ' ✓' : ' ✗'); }).join(' · ') : ''));
  return parts.length ? '<div class="wt-sum" style="font-size:12px;color:var(--ink-3);padding:8px 14px 2px;line-height:1.6">' + parts.join('<br>') + '</div>' : '';
}

/* ── 지표 추이 모달 ──
   반짝이는 CTR/CVR/AOV 를 누르면 최근 며칠이 어떻게 흘러왔는지 보여준다.
   화살표 기호를 지운 대신 "눌러서 확인"으로 바꾼 것. 원지표(노출·클릭·전환)를 같이 보여줘야
   비율이 떨어진 게 분모가 늘어서인지 분자가 줄어서인지 판별된다. */
function pp(a, b, dec){ var d = a - b; return (d > 0 ? '+' : '') + d.toFixed(dec) + '%p'; }
function rel(a, b){ var d = (a - b) / b * 100; return (d > 0 ? '+' : '') + d.toFixed(0) + '%'; }
var MET = {
  ctr: { name:'CTR', fn:ctrOf, fmt:function(v){ return v.toFixed(2)+'%'; },
         dp:function(a,b){ return pp(a,b,2); },
         sub:function(m){ return won(m.clicks)+' / '+won(m.imp)+' 노출'; }, why:'클릭률 — 소재·타겟이 먹히는 정도' },
  cvr: { name:'CVR', fn:cvrOf, fmt:function(v){ return v.toFixed(1)+'%'; },
         dp:function(a,b){ return pp(a,b,1); },
         sub:function(m){ return won(m.purchases)+'건 / '+won(m.clicks)+' 클릭'; }, why:'전환율 — 클릭 후 실제 구매로 이어지는 정도' },
  aov: { name:'AOV', fn:aovOf, fmt:function(v){ return won(v); },
         dp:function(a,b){ return rel(a,b); },          // 원 단위라 %p 가 성립하지 않는다
         sub:function(m){ return won(m.val)+' / '+won(m.purchases)+'건'; }, why:'객단가 — 한 건당 매출' }
};
function openTrend(ev, key, metric, isItem){

  S.trend = { key:key, metric:metric, isItem:!!isItem };
  push('t:' + key + ':' + metric);
  render();
}
function closeTrend(){ drop('t:' + S.trend.key + ':' + S.trend.metric); S.trend = null; render(); }

function trendModal(){
  if (!S.trend || !D.trend) return '';
  var M = MET[S.trend.metric], key = S.trend.key;
  var src = S.trend.isItem ? D.trend.item : D.trend.camp;
  var rec = (src && src[key]) || {};
  // 오늘 값은 화면 데이터에서 다시 만든다 (trend 에는 확정일만 들어 있다)
  var today = null, label = key;
  if (S.trend.isItem) {
    var acc = { imp:0, clicks:0, purchases:0, val:0, spend:0 };
    D.campaigns.filter(function(c){ return c.item === key && (!S.acct || c.account === S.acct); })
      .forEach(function(c){ acc.imp+=c.imp||0; acc.clicks+=c.clicks||0; acc.purchases+=c.purchases; acc.val+=c.val; acc.spend+=c.spend; });
    today = acc;
  } else {
    var c = D.campaigns.filter(function(x){ return x.id === key; })[0];
    if (c) { today = { imp:c.imp||0, clicks:c.clicks||0, purchases:c.purchases, val:c.val, spend:c.spend }; label = c.name; }
  }
  var pts = (D.trend.dates || []).map(function(d){
    return { d:d, m:rec[d], v: rec[d] ? M.fn(rec[d]) : null };
  }).filter(function(x){ return x.v != null; });
  if (today) pts.push({ d:D.dateStr, m:today, v:M.fn(today), today:true });

  var vals = pts.map(function(x){ return x.v; });
  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  var span = (mx - mn) || 1;
  var first = vals[0], last = vals[vals.length-1];
  var tot = first ? (last - first) / first * 100 : 0;
  var totTxt = pts.length > 1 ? M.dp(last, first) : '';

  var rows = pts.map(function(x, i){
    var prev = i ? pts[i-1].v : null;
    var dv = prev ? (x.v - prev) / prev * 100 : null;   // 색 판정은 상대 변화폭으로
    var dtxt = prev ? M.dp(x.v, prev) : null;           // 표기는 %p (AOV 만 %)
    var w = 6 + (x.v - mn) / span * 94;
    var cls = dv == null ? '' : dv <= -5 ? ' dn' : dv >= 5 ? ' up' : '';
    return '<tr' + (x.today ? ' class="tr-today"' : '') + '>' +
      '<td class="left">' + (x.today ? '<b>오늘</b> <span class="muted">' + D.pollTime + ' 기준</span>'
        : '<b>' + x.d.slice(5) + '</b> <span class="dow' + (dowOfStr(x.d) === '토' ? ' dow-sat' : dowOfStr(x.d) === '일' ? ' dow-sun' : '') + '">(' + dowOfStr(x.d) + ')</span>') + '</td>' +
      '<td class="tv">' + M.fmt(x.v) + '</td>' +
      '<td class="tc' + cls + '">' + (dtxt == null ? '<span class="muted">기준</span>' : dtxt) + '</td>' +
      '<td class="tbar"><span style="width:' + w.toFixed(1) + '%"></span></td>' +
      '<td class="left muted small">' + M.sub(x.m) + '</td></tr>';
  }).join('');

  return '<div class="tmodal" onclick="closeTrend()"><div class="tbox" onclick="event.stopPropagation()">' +
    '<button class="tclose" onclick="closeTrend()">×</button>' +
    '<div class="tt">' + esc(label) + '</div>' +
    '<div class="ts">' + M.name + ' 추이 · ' + M.why + '</div>' +
    '<div class="tsum ' + (tot < 0 ? 'dn' : 'up') + '">' + (pts.length > 1 ? M.fmt(first) + ' → ' + M.fmt(last) +
      '  <b>' + totTxt + '</b>' : M.fmt(last)) + '</div>' +
    '<table class="ttbl"><colgroup><col style="width:22%"><col style="width:15%"><col style="width:13%"><col style="width:26%"><col style="width:24%"></colgroup>' +
    '<thead><tr><th class="left">날짜</th><th>' + M.name + '</th><th>전일 대비</th><th></th><th class="left">근거</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="tnote">확정일은 하루 전체, 오늘은 ' + D.pollTime + ' 시점까지의 누적입니다. 오전에는 표본이 얇아 낮게 보일 수 있습니다.</div>' +
    '</div></div>';
}
function dowOfStr(d){ return '일월화수목금토'[new Date(d + 'T00:00:00+09:00').getDay()]; }

function sortRows(arr, s){
  arr.sort(function(a,b){
    var av = a[s.key], bv = b[s.key];
    if (typeof av === 'string' || typeof bv === 'string')
      return s.dir * String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv));
    return s.dir * ((av||0) - (bv||0));
  });
}

/* 화살표를 '일예산 숫자 끝' 과 '소진 숫자 시작' 의 정확한 중앙에 놓는다.
   칸 경계에 두면 두 칸 폭이 같아도 숫자가 우측정렬이라 일예산 쪽에 붙어 보인다. */
function placeArrows(){
  var zoom = parseFloat(getComputedStyle(document.body).zoom) || 1;
  // 칸 안에는 숫자 텍스트만 있는 게 아니라 변경 표식(.chgv) 같은 요소도 섞인다.
  // 화살표 자신은 빼고 나머지 내용의 좌·우 끝을 잡는다.
  function edge(cell, side){
    var ns = [], n;
    for (n = cell.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.className && String(n.className).indexOf('arw') >= 0) continue;
      if (n.nodeType === 3 && !n.textContent.trim()) continue;
      ns.push(n);
    }
    if (!ns.length) return null;
    var r = document.createRange();
    r.setStartBefore(ns[0]); r.setEndAfter(ns[ns.length - 1]);
    var b = r.getBoundingClientRect();
    return side === 'right' ? b.right : b.left;
  }
  var list = document.querySelectorAll('td.key.k2 .arw');
  for (var i = 0; i < list.length; i++) {
    var arw = list[i], td = arw.parentNode, prev = td.previousElementSibling;
    if (!prev) { arw.classList.remove('set'); continue; }
    var end = edge(prev, 'right'), start = edge(td, 'left');
    if (end == null || start == null) { arw.classList.remove('set'); continue; }
    // getBoundingClientRect 는 body zoom 이 반영된 값이라 CSS px 로 되돌려 놓는다
    var mid = ((end + start) / 2 - td.getBoundingClientRect().left) / zoom;
    var w = arw.getBoundingClientRect().width / zoom;
    arw.style.left = (mid - w / 2) + 'px';
    arw.classList.add('set');
  }
}
window.addEventListener('resize', placeArrows);
// 웹폰트가 늦게 뜨면 첫 배치가 몇 px 어긋난다 — 폰트 로드 후 한 번 더 잡는다
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeArrows);

/* ── 인터랙션 ── */
function setAcct(id){ S.acct = id; render(); }
function setSort(k, dd){
  var st = dd ? S.sortDD : S.sort;
  if (st.key === k) st.dir *= -1; else { st.key = k; st.dir = -1; }
  render();
}
// 드릴다운 한 단계 들어가기 / 경로로 되돌아가기
function ddIn(lv, id, focus){ if (lv === 'c') { S.ddCamp = id; S.ddSet = null; } else S.ddSet = id;
  S.ddFocus = focus || null;   // 운영 제안에서 들어오면 그 소재 행을 강조
  S.openHist = {}; S.openChg = {}; S.stack = []; render(); document.getElementById('dd').scrollTop = 0;
  var f = document.querySelector('#dd tr.ddfocus'); if (f) f.scrollIntoView({ block:'center' }); }
function ddGo(lv){ if (lv < 2) S.ddSet = null; if (lv < 1) S.ddCamp = null; render(); }
function openItem(it){
  S.modalItem = it; S.ddCamp = S.ddSet = null;
  S.sortDD = { key: 'daily', dir: -1 };   // 열 때마다 일예산 내림차순으로 시작
  render(); document.body.style.overflow = 'hidden';
}
function closeItem(){ S.modalItem = null; S.stack = []; S.openCamp = {}; S.openHist = {}; S.openChg = {};
  document.body.style.overflow = ''; render(); }
// ESC 는 한 단계씩만 접는다 — 펼쳐둔 게 있으면 마지막에 편 것부터, 없을 때만 모달을 닫는다.
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (S.stack.length) {
    var last = S.stack.pop();
    if (last.slice(0, 2) === 't:') S.trend = null;
    else if (last.slice(0, 2) === 'h:') delete S.openHist[last.slice(2)];
    else if (last.slice(0, 2) === 'c:') delete S.openCamp[last.slice(2)];
    else delete S.openChg[last.slice(2)];
    render();
    return;
  }
  if (S.ddSet) { ddGo(1); return; }
  if (S.ddCamp) { ddGo(0); return; }
  if (S.modalItem) closeItem();
});

// 품목 드릴다운 — 그 품목만 떼어내 한 화면에 보여준다. 캠페인/광고세트 펼침은 모달 안에서 그대로 동작.
function renderModal(list, cn){
  var ov = document.getElementById('dd-ov'), dd = document.getElementById('dd');
  if (!S.modalItem){ ov.style.display = 'none'; dd.style.display = 'none'; dd.innerHTML = ''; return; }
  var camps = list.filter(function(c){ return c.item === S.modalItem; });
  if (!camps.length){ closeItem(); return; }
  var expect = cn ? cn.cumShare*100 : 0;
  /* 메타 광고관리자처럼 한 단계씩 들어간다 (11/12 "캠페인 누르면 세트·소재가 한 화면에 섞여 보기 불편"):
     품목 → 캠페인 표 · 캠페인 → 광고세트 표 · 세트 → 소재 표. 위 경로를 눌러 되돌아가고 Esc 는 한 단계 뒤로. */
  var camp = S.ddCamp ? camps.filter(function(c){ return c.id === S.ddCamp; })[0] : null;
  if (S.ddCamp && !camp) { S.ddCamp = S.ddSet = null; }
  var aset = camp && S.ddSet ? (camp.adsets || []).filter(function(a){ return a.id === S.ddSet; })[0] : null;
  if (camp && S.ddSet && !aset) {
    var t0 = { spend:0, purchases:0, val:0 };
    Object.keys((D.adsToday && D.adsToday.ads) || {}).forEach(function(k){ var x = D.adsToday.ads[k]; if (x.set === S.ddSet) { t0.spend += x.spend; t0.purchases += x.purchases; t0.val += x.val; } });
    aset = { id: S.ddSet, name: '세트 ' + S.ddSet + ' (지금 보드 목록에 없음 — 꺼졌거나 보관된 세트)', daily: 0, spend: t0.spend, purchases: t0.purchases, val: t0.val };
  }
  var scope = aset ? [aset] : camp ? [camp] : camps;
  var A = agg(scope.map(function(x){ return { daily: x.daily || 0, spend: x.spend || 0, purchases: x.purchases || 0, val: x.val || 0, imp: x.imp, clicks: x.clicks }; }));
  A.pace = A.daily ? A.spend / A.daily * 100 : 0;

  var k = function(l, v){ return '<div class="dd-k"><div class="dd-kl">' + l + '</div><div class="dd-kv">' + v + '</div></div>'; };
  var crumb = '<span class="bc' + (camp ? ' bc-l' : '') + '" onclick="ddGo(0)">' + esc(S.modalItem) + '</span>' +
    (camp ? ' <span class="bc-sep">›</span> <span class="bc' + (aset ? ' bc-l' : '') + '" onclick="ddGo(1)" title="' + esc(camp.name) + '">' + esc(camp.name) + '</span>' : '') +
    (aset ? ' <span class="bc-sep">›</span> <span class="bc" title="' + esc(aset.name) + '">' + esc(aset.name) + '</span>' : '');
  var sub = aset ? '광고세트 · 아래는 이 세트 소재 (최근 7일)'
          : camp ? (camp.adsets || []).length + '개 광고세트 · 행을 누르면 소재로 들어갑니다'
          : camps.length + '개 캠페인 · 행을 누르면 광고세트로 들어갑니다';
  var head = function(first){
    return '<table class="grid"><colgroup>' +
      COLS.map(function(c){ return '<col' + (c.w ? ' style="width:' + c.w + '"' : '') + '>'; }).join('') +
      '</colgroup><thead><tr>' +
      COLS.map(function(c){
        return '<th class="sortable' + (c.left?' left':'') + (KEYCOL[c.k]?' ' + KEYCOL[c.k]:'') + (S.sortDD.key===c.k?' sort-active':'') +
          '" onclick="setSort(\'' + c.k + '\',1)">' + (c.k === 'name' ? first : sortHead(c, S.sortDD)) + '</th>';
      }).join('') + '</tr></thead><tbody>';
  };
  var body = aset ? adTable(camp.id, aset.id)
           : camp ? head('광고세트') + adsetRows(camp) + '</tbody></table>'
           : head(sortHead(COLS[0], S.sortDD)) + campRows(camps, expect) + '</tbody></table>';
  dd.innerHTML =
    '<div class="dd-hd"><div style="min-width:0">' +
      '<div class="dd-t">' + crumb + '</div>' +
      '<div class="dd-s">' + sub + ' · ' + D.dateStr + ' ' + D.pollTime + ' 기준</div>' +
    '</div><div style="display:flex;align-items:center"><button class="dd-todo' + (S.todoOnly ? ' on' : '') + '" onclick="S.todoOnly=!S.todoOnly;render()" title="할 일이 있는 캠페인·세트·소재만 남김">할 일만 보기' + (S.todoOnly ? ' ✓' : '') + '</button>' +
    '<button class="dd-x" onclick="closeItem()" title="닫기 (Esc)">×</button></div></div>' +
    '<div class="dd-kpi">' +
      k('일예산', A.daily ? won(A.daily) : '—') + k('소진', won(A.spend)) +
      '<div class="dd-k' + (A.daily ? slowCls(A.pace, expect) : '') + '"><div class="dd-kl">페이스</div><div class="dd-kv">' + (A.daily ? paceVal(A.pace, expect) : '—') + '</div></div>' +
      k('C1 전환', won(A.purchases) + '건') +
      k('C1 ROAS', roasPill(A.spend ? A.val / A.spend * 100 : 0, A.spend)) +
      (aset ? '' : k('실매출 ROAS', realCell(realAgg(camp ? [camp] : camps)))) +
    '</div>' + body;
  ov.style.display = 'block'; dd.style.display = 'block';
}
// 펼침 순서를 쌓아둔다 — ESC 가 마지막에 편 것부터 되돌리기 위해.
function push(k){ var i = S.stack.indexOf(k); if (i >= 0) S.stack.splice(i, 1); S.stack.push(k); }
function drop(k){ var i = S.stack.indexOf(k); if (i >= 0) S.stack.splice(i, 1); }
function toggleCamp(id){
  S.openCamp[id] = !S.openCamp[id];
  if (S.openCamp[id]) push('c:' + id); else { delete S.openCamp[id]; drop('c:' + id); }
  render();
}
function toggleHist(ev, id){
  ev.stopPropagation();
  S.openHist[id] = !S.openHist[id];
  if (S.openHist[id]) push('h:' + id); else { delete S.openHist[id]; drop('h:' + id); }
  render();
}
function toggleCmp(){ S.showCmp = !S.showCmp; localStorage.setItem('bdg_cmp', S.showCmp ? '1' : '0'); render(); }
// 숫자 클릭이 드릴다운 토글로 새지 않게 막는다
function toggleChg(ev, key){
  ev.stopPropagation();
  S.openChg[key] = !S.openChg[key];
  if (S.openChg[key]) push('g:' + key); else { delete S.openChg[key]; drop('g:' + key); }
  render();
}

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}
function copyName(ev, id){
  ev.stopPropagation();
  var r = D.campaigns.filter(function(c){ return c.id === id; })[0];
  if (!r) return;
  var done = function(){ toast('복사됨 — ' + r.name.slice(0,40) + (r.name.length>40?'…':'')); };
  var fallback = function(){
    // clipboard API 가 막힌 환경(비-HTTPS 등) 대비
    var ta = document.createElement('textarea');
    ta.value = r.name; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(r.name).then(done).catch(fallback);
  } else fallback();
}

function syncInputs(){
  document.getElementById('t-spend').value = S.tSpend.toLocaleString('ko-KR');
  document.getElementById('t-roas').value = S.tRoas;
}
(function bind(){
  var sp = document.getElementById('t-spend'), rs = document.getElementById('t-roas');
  sp.addEventListener('input', function(){ var v = Number(sp.value.replace(/[^0-9]/g,'')); if (v>0){ S.tSpend=v; localStorage.setItem('bdg_tspend',v); render(); } });
  sp.addEventListener('blur', syncInputs);
  rs.addEventListener('input', function(){ var v = Number(rs.value.replace(/[^0-9.]/g,'')); if (v>0){ S.tRoas=v; localStorage.setItem('bdg_troas',v); render(); } });
  var fold = document.getElementById('fold-proj');
  if (localStorage.getItem('bdg_fold') === '1') fold.open = true;
  fold.addEventListener('toggle', function(){ localStorage.setItem('bdg_fold', fold.open ? '1' : '0'); });
  var fc = document.getElementById('fold-chg');
  if (localStorage.getItem('bdg_foldchg') === '1') fc.open = true;   // 기본 접힘
  fc.addEventListener('toggle', function(){ localStorage.setItem('bdg_foldchg', fc.open ? '1' : '0'); });
})();

/* 데이터가 몇 시 것인지 늘 보이게 한다. 10분 넘게 묵으면 주황으로 바꿔 '갱신 지연'을 알린다.
   화면은 정적 파일이라 시간이 갈수록 낡는데, 그걸 모른 채 실시간으로 착각하는 게 제일 위험하다. */
function dataAgeMin(){
  var p = D.pollTime.split(':');
  var t = Date.parse(D.dateStr + 'T' + p[0] + ':' + p[1] + ':00+09:00');
  return (Date.now() - t) / 60000;
}
function updateStamp(){
  var el = document.getElementById('data-stamp'); if (!el) return;
  if (D.isArchive) { el.textContent = D.dateStr + ' 마감 기록'; return; }
  var m = Math.max(0, Math.round(dataAgeMin()));
  el.textContent = '데이터 기준 ' + D.dateStr.slice(5) + ' ' + D.pollTime + (m >= 1 ? '  (' + m + '분 전)' : '  (방금)');
  el.className = 'hd-gen' + (m > 10 ? ' stale' : '');
  if (m > 10) el.title = '10분마다 자동 갱신인데 그보다 오래됐습니다 — 수집이 밀렸거나 캐시된 화면일 수 있습니다';
}
setInterval(function(){ updateStamp(); render(); }, 30000);

// meta refresh 는 같은 URL 이라 CDN 캐시를 그대로 물 수 있다 — 매번 다른 쿼리로 새로 받는다.
if (!D.isArchive) setTimeout(function(){
  location.replace(location.pathname + '?v=' + Date.now());
}, 600000);

syncInputs(); render(); updateStamp();
</script>
